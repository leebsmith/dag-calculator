<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brewing Calculator</title>
    <link rel="icon" type="image/png" href="/src/assets/icons8-beer-50.png" />
    <link rel="stylesheet" href="/src/tokens.css" />
    <link rel="stylesheet" href="/src/style.css" />
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main class="app-shell" x-data="stepCalculator()" @keydown.escape.window="openOverview()">
      <div class="signin-panel" x-show="!$store.auth.user && !$store.auth.loading">
        <h1 class="card-title">Brewing Calculator</h1>
        <p class="card-description">Sign in to open your recipes.</p>
        <button type="button" class="btn-primary" @click="$store.auth.signIn()">
          Sign in anonymously
        </button>
      </div>

      <template x-if="$store.auth.user">
        <div class="app-content">
        <header class="menu-bar">
          <span class="menu-title">Brewing Calculator</span>
          <div class="menu-actions">
            <div class="menu-recipes">
              <button type="button" class="btn-outline" @click="$store.recipes.toggle()">
                Recipes
              </button>
              <div
                class="recipes-popover"
                x-show="$store.recipes.open"
                @click.outside="$store.recipes.open = false"
              >
                <div class="recipes-actions">
                  <button type="button" class="btn-primary" @click="$store.recipes.newRecipe()">＋ New</button>
                  <button type="button" class="btn-outline" @click="$store.recipes.rename()">Rename</button>
                  <button type="button" class="btn-outline" @click="$store.recipes.freeze()">Freeze</button>
                </div>
                <div class="recipes-list">
                  <template x-for="b in $store.recipes.batches" :key="b.id">
                    <button
                      type="button"
                      class="recipes-item"
                      :class="(b.id === $store.recipes.activeId ? 'is-active' : '') + (b.status === 'frozen' ? ' is-frozen' : '')"
                      @click="b.status === 'draft' ? $store.recipes.openDraft(b.id) : $store.recipes.forkFrozen(b.id)"
                    >
                      <span class="recipes-name" x-text="b.name"></span>
                      <span class="recipes-hint" x-show="b.status === 'frozen'" x-text="'frozen — click to copy'"></span>
                    </button>
                  </template>
                  <p class="recipes-empty" x-show="!$store.recipes.batches.length">No recipes yet.</p>
                </div>
              </div>
            </div>
            <div class="menu-unit">
              <button type="button" class="btn-outline" @click="toggleUnits()">Units</button>
              <div class="unit-popover" x-show="unitsOpen" @click.outside="unitsOpen = false">
                <template x-for="g in unitGroups" :key="g.label">
                  <div class="unit-col">
                    <span class="unit-col-title" x-text="g.label"></span>
                    <template x-for="d in g.dims" :key="d.id">
                      <div class="unit-row">
                        <label class="form-label" x-text="d.label"></label>
                        <select
                          class="form-select"
                          :value="unitMode[d.id] || d.units[0][0]"
                          @change="setUnit(d.id, $event.target.value)"
                        >
                          <template x-for="u in d.units" :key="u[0]">
                            <option :value="u[0]" x-text="u[1]"></option>
                          </template>
                        </select>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </div>
            <span class="auth-user">
              <span x-text="$store.auth.user.isAnonymous ? 'Anonymous' : ($store.auth.user.email || '')"></span>
              <button type="button" class="btn-link" @click="$store.auth.signOut()">Sign out</button>
            </span>
          </div>
        </header>

        <div class="stage">
          <div class="alert alert-warning" x-show="boundaryError">
            <div class="alert-header">
              <span class="alert-dot"></span>
              <span x-text="'Solver error: ' + (boundaryError && boundaryError.code ? boundaryError.code : 'unknown')"></span>
            </div>
            <p x-text="boundaryError && boundaryError.message"></p>
          </div>

          <div class="boundary-status" x-show="boundaryPending">
            <span class="status-dot status-dot-warning"></span>
            <span class="text-xs text-muted">Solving…</span>
          </div>

          <!-- Card picker: every step as an even grid of summary tiles. -->
          <div class="card-grid" x-show="view === 'overview'" :style="gridStyle">
            <template x-for="tile in overviewTiles" :key="tile.id">
              <button
                type="button"
                class="card-tile"
                :class="{ 'is-active': tile.active, 'is-locked': tile.locked }"
                :disabled="tile.locked"
                @click="focusStep(tile.index)"
              >
                <span class="card-tile-head">
                  <span class="card-tile-index" x-text="tile.index + 1"></span>
                  <span class="card-tile-title" x-text="tile.title"></span>
                  <span
                    class="status-dot status-dot-error"
                    x-show="tile.violations > 0"
                    :title="tile.violations + ' violation(s)'"
                  ></span>
                </span>
                <span class="card-tile-subtitle" x-show="tile.subtitle" x-text="tile.subtitle"></span>
                <span class="card-tile-readouts">
                  <template x-for="r in tile.readouts" :key="r.label">
                    <span class="card-tile-readout">
                      <span class="card-tile-readout-label" x-text="r.label"></span>
                      <span class="card-tile-readout-value">
                        <span class="tabular-nums" x-text="r.display"></span>
                        <span class="card-tile-readout-unit" x-show="r.unit" x-text="r.unit"></span>
                      </span>
                    </span>
                  </template>
                </span>
              </button>
            </template>
          </div>

          <!-- Focus: the real card for the active step. -->
          <div class="focus-view" x-show="view === 'focus'">
            <div class="focus-bar">
              <button type="button" class="btn-outline" @click="openOverview()">⊞ All steps</button>
              <span class="focus-label" x-text="activeStep.title"></span>
            </div>
            <div class="step-row">
              <div class="step-slot">
                <template x-if="activeStep.id === 'yeast'">
                  <load src="./src/partials/step-yeast.html" />
                </template>
                <template x-if="activeStep.id !== 'yeast'">
                  <load src="./src/partials/step-card.html" />
                </template>
              </div>
            </div>
          </div>
        </div>

        <footer class="app-footer">
          <button
            type="button"
            class="btn-outline"
            @click="prev()"
            :disabled="view !== 'focus' || activeIndex === 0"
          >
            ← Back
          </button>
          <span class="footer-step" x-text="'Step ' + (activeIndex + 1) + ' of ' + steps.length"></span>
          <button
            type="button"
            class="btn-outline"
            @click="next()"
            :disabled="view === 'focus' && activeIndex === steps.length - 1"
          >
            <span x-text="view === 'overview' ? 'Open →' : 'Next →'"></span>
          </button>
          <span class="footer-violations" x-show="violationCount > 0">
            <span class="status-dot status-dot-error"></span>
            <span x-text="violationCount + ' violation(s)'"></span>
          </span>
        </footer>
        </div>
      </template>
    </main>
  </body>
</html>
