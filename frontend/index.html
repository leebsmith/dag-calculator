<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brewing Calculator</title>
    <link rel="icon" type="image/png" href="/src/assets/icons8-beer-50.png" />
    <link rel="stylesheet" href="/src/tokens.css" />
    <link rel="stylesheet" href="/src/style.css" />
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main
      class="app-shell"
      x-data="stepCalculator()"
      @keydown.arrow-up.window="keyNav('prev', $event)"
      @keydown.arrow-down.window="keyNav('next', $event)"
      @keydown.page-up.window="keyNav('prev', $event)"
      @keydown.page-down.window="keyNav('next', $event)"
    >
      <div class="signin-panel" x-show="!$store.auth.user && !$store.auth.loading">
        <h1 class="card-title">Brewing Calculator</h1>
        <p class="card-description" x-show="!$store.auth.blocked && !$store.auth.sessionError">
          Sign in to open your recipes.
        </p>
        <div class="alert alert-warning" x-show="$store.auth.blocked">
          <div class="alert-header">
            <span class="alert-dot"></span>
            <span>Access not allowed</span>
          </div>
          <p>
            <span x-text="$store.auth.blockedEmail || 'This account'"></span>
            is not on the allowlist for this app.
          </p>
        </div>
        <div class="alert alert-warning" x-show="$store.auth.sessionError">
          <div class="alert-header">
            <span class="alert-dot"></span>
            <span>Couldn't verify your session</span>
          </div>
          <p>Check the server connection and sign in again.</p>
        </div>
        <button type="button" class="btn-primary" @click="$store.auth.signIn()">
          Sign in with Google
        </button>
      </div>

      <template x-if="$store.auth.user">
        <div class="app-content">
          <template x-if="libraryOpen">
            <load src="./src/partials/library.html" />
          </template>

          <!-- Recipe landing ------------------------------------------------>
          <template x-if="$store.recipes.view !== 'editor'">
            <div class="chooser">
              <header class="menu-bar">
                <span class="menu-title">Brewing Calculator</span>
                <div class="menu-actions">
                  <button
                    type="button"
                    class="btn-outline"
                    x-show="$store.recipes.trashView"
                    @click="$store.recipes.showRecipes()"
                  >
                    Back to recipes
                  </button>
                  <button
                    type="button"
                    class="btn-outline"
                    x-show="$store.recipes.view === 'chooser' && !$store.recipes.trashView"
                    @click="openLibrary()"
                  >
                    Library
                  </button>
                  <button
                    type="button"
                    class="btn-outline"
                    x-show="$store.recipes.view === 'chooser' && !$store.recipes.trashView"
                    @click="$store.recipes.openTrash()"
                  >
                    Trash
                  </button>
                  <span class="auth-user">
                    <span x-text="$store.auth.user.email || ''"></span>
                    <button type="button" class="btn-link" @click="$store.auth.signOut()">Sign out</button>
                  </span>
                </div>
              </header>

              <div
                class="chooser-body"
                @scroll="$store.recipes.closeRowMenu(); $store.recipes.closeSort()"
              >
                <div class="alert alert-warning" x-show="$store.recipes.loadError">
                  <div class="alert-header">
                    <span class="alert-dot"></span>
                    <span>Couldn't reach the server</span>
                  </div>
                  <p>Your recipes couldn't be loaded.</p>
                  <button type="button" class="btn-outline" @click="$store.recipes.retryLoad()">Retry</button>
                </div>

                <template x-if="$store.recipes.view === 'freezes'">
                  <div class="landing">
                    <section class="landing-library">
                      <div class="landing-section-bar">
                        <h2 class="landing-heading">Frozen batches</h2>
                        <button type="button" class="btn-outline" @click="$store.recipes.backToChooser()">
                          Back to recipes
                        </button>
                      </div>

                      <div class="landing-table-wrap" x-show="$store.recipes.freezes.length">
                        <table class="landing-table">
                          <thead>
                            <tr>
                              <th scope="col">Title</th>
                              <th scope="col" class="landing-col-date">Frozen</th>
                              <th scope="col" class="landing-col-actions" aria-label="Actions"></th>
                            </tr>
                          </thead>
                          <tbody>
                            <template x-for="b in $store.recipes.freezes" :key="b.id">
                              <tr>
                                <td class="landing-col-title">
                                  <template x-if="$store.recipes.renamingId === b.id">
                                    <input
                                      class="landing-rename"
                                      type="text"
                                      :value="$store.recipes.renameValue"
                                      @input="$store.recipes.setRenameValue($event.target.value)"
                                      @keydown.enter.prevent="$store.recipes.commitRename(b)"
                                      @keydown.escape.prevent="$store.recipes.cancelRename()"
                                      @blur="$store.recipes.commitRename(b)"
                                      x-init="$el.focus(); $el.select()"
                                    />
                                  </template>
                                  <template x-if="$store.recipes.renamingId !== b.id">
                                    <button
                                      type="button"
                                      class="landing-title"
                                      @click="$store.recipes.forkFrozen(b.id)"
                                    >
                                      <span class="landing-name" x-text="b.name"></span>
                                      <span class="landing-row-hint">frozen — click to fork a copy</span>
                                    </button>
                                  </template>
                                </td>
                                <td class="landing-col-date" x-text="$store.recipes.dateLabel(b.frozen_at)"></td>
                                <td class="landing-col-actions">
                                  <button
                                    type="button"
                                    class="landing-kebab"
                                    aria-label="Frozen batch actions"
                                    aria-haspopup="menu"
                                    :aria-expanded="$store.recipes.rowMenu && $store.recipes.rowMenu.id === b.id"
                                    @click.stop="$store.recipes.openRowMenu(b, $event)"
                                  >
                                    ⋮
                                  </button>
                                </td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                      </div>

                      <p class="landing-empty" x-show="!$store.recipes.freezes.length">
                        No frozen batches yet. Freeze a recipe to keep an immutable snapshot.
                      </p>
                    </section>
                  </div>
                </template>

                <template x-if="$store.recipes.view === 'chooser'">
                  <div class="landing">
                    <template x-if="$store.recipes.trashView">
                      <div class="recipes-list">
                        <template x-for="b in $store.recipes.trashRows" :key="b.id">
                          <div class="recipes-item" :class="b.status === 'frozen' ? 'is-frozen' : ''">
                            <span class="recipes-name" x-text="b.name"></span>
                            <span class="recipes-hint" x-show="b.status === 'frozen'" x-text="'frozen'"></span>
                            <span
                              class="recipes-hint"
                              x-text="'Moved ' + $store.recipes.dateLabel(b.updated_at)"
                            ></span>
                            <div class="recipes-row-actions">
                              <button type="button" class="btn-outline" @click="$store.recipes.restore(b.id)">
                                Restore
                              </button>
                              <button type="button" class="btn-outline" @click="$store.recipes.deletePermanent(b.id)">
                                Delete permanently
                              </button>
                            </div>
                          </div>
                        </template>
                        <p class="recipes-empty" x-show="!$store.recipes.trashRows.length">Trash is empty.</p>
                      </div>
                    </template>

                    <template x-if="!$store.recipes.trashView">
                      <div class="landing-page">
                        <section class="landing-hero">
                          <button type="button" class="landing-create" @click="$store.recipes.newRecipe()">
                            <span class="landing-create-icon">＋</span>
                            <span class="landing-create-title">New recipe</span>
                            <span class="landing-create-hint">Start with a blank batch</span>
                          </button>

                          <div class="landing-freezes">
                            <div class="landing-section-bar">
                              <h2 class="landing-subheading">Start from a frozen batch</h2>
                              <button
                                type="button"
                                class="btn-link"
                                x-show="$store.recipes.freezes.length > $store.recipes.recentFreezeRail.length"
                                @click="$store.recipes.showFreezes()"
                              >
                                View all
                              </button>
                            </div>

                            <div class="landing-freeze-rail" x-show="$store.recipes.freezes.length">
                              <template x-for="b in $store.recipes.recentFreezeRail" :key="b.id">
                                <button
                                  type="button"
                                  class="landing-freeze-card"
                                  @click="$store.recipes.forkFrozen(b.id)"
                                >
                                  <span class="landing-freeze-name" x-text="b.name"></span>
                                  <span
                                    class="landing-freeze-date"
                                    x-text="'Frozen ' + $store.recipes.dateLabel(b.frozen_at)"
                                  ></span>
                                </button>
                              </template>
                            </div>

                            <p class="landing-empty" x-show="!$store.recipes.freezes.length">
                              Freeze a recipe to keep an immutable snapshot and fork it later.
                            </p>
                          </div>
                        </section>

                        <section class="landing-library">
                          <div class="landing-section-bar">
                            <h2 class="landing-heading">Your recipes</h2>
                            <button
                              type="button"
                              class="btn-outline landing-sort-btn"
                              @click.stop="$store.recipes.toggleSort($event)"
                            >
                              <span x-text="'Sort: ' + $store.recipes.sortLabel"></span>
                              <span aria-hidden="true">▾</span>
                            </button>
                          </div>

                          <template x-for="section in $store.recipes.sections" :key="section.key">
                            <div class="landing-group">
                              <h3 class="landing-group-title" x-text="section.label"></h3>
                              <div class="landing-table-wrap">
                                <table class="landing-table">
                                  <thead>
                                    <tr>
                                      <th scope="col">Title</th>
                                      <th scope="col" class="landing-col-date">Modified</th>
                                      <th scope="col" class="landing-col-actions" aria-label="Actions"></th>
                                    </tr>
                                  </thead>
                                  <tbody>
                                    <template x-for="b in section.batches" :key="b.id">
                                      <tr>
                                        <td class="landing-col-title">
                                          <template x-if="$store.recipes.renamingId === b.id">
                                            <input
                                              class="landing-rename"
                                              type="text"
                                              :value="$store.recipes.renameValue"
                                              @input="$store.recipes.setRenameValue($event.target.value)"
                                              @keydown.enter.prevent="$store.recipes.commitRename(b)"
                                              @keydown.escape.prevent="$store.recipes.cancelRename()"
                                              @blur="$store.recipes.commitRename(b)"
                                              x-init="$el.focus(); $el.select()"
                                            />
                                          </template>
                                          <template x-if="$store.recipes.renamingId !== b.id">
                                            <button
                                              type="button"
                                              class="landing-title"
                                              @click="$store.recipes.openDraft(b.id)"
                                            >
                                              <span class="landing-name" x-text="b.name"></span>
                                            </button>
                                          </template>
                                        </td>
                                        <td class="landing-col-date" x-text="$store.recipes.dateLabel(b.updated_at)"></td>
                                        <td class="landing-col-actions">
                                          <button
                                            type="button"
                                            class="landing-kebab"
                                            aria-label="Recipe actions"
                                            aria-haspopup="menu"
                                            :aria-expanded="$store.recipes.rowMenu && $store.recipes.rowMenu.id === b.id"
                                            @click.stop="$store.recipes.openRowMenu(b, $event)"
                                          >
                                            ⋮
                                          </button>
                                        </td>
                                      </tr>
                                    </template>
                                  </tbody>
                                </table>
                              </div>
                            </div>
                          </template>

                          <p class="landing-empty" x-show="!$store.recipes.drafts.length">
                            No recipes yet. Start with a blank recipe.
                          </p>
                        </section>
                      </div>
                    </template>
                  </div>
                </template>
              </div>

              <template x-if="$store.recipes.rowMenu">
                <div
                  class="landing-menu"
                  :style="$store.recipes.rowMenuStyle"
                  role="menu"
                  @click.outside="$store.recipes.closeRowMenu()"
                  @keydown.escape.window="$store.recipes.closeRowMenu()"
                >
                  <button
                    type="button"
                    class="landing-menu-item"
                    role="menuitem"
                    x-show="$store.recipes.rowMenu.status === 'frozen'"
                    @click="$store.recipes.forkRow()"
                  >
                    Fork a copy
                  </button>
                  <button
                    type="button"
                    class="landing-menu-item"
                    role="menuitem"
                    @click="$store.recipes.startRename()"
                  >
                    Rename
                  </button>
                  <button
                    type="button"
                    class="landing-menu-item"
                    role="menuitem"
                    @click="$store.recipes.trashRow()"
                  >
                    Move to trash
                  </button>
                </div>
              </template>

              <template x-if="$store.recipes.sortOpen">
                <div
                  class="landing-menu"
                  :style="$store.recipes.sortMenuStyle"
                  role="menu"
                  @click.outside="$store.recipes.closeSort()"
                  @keydown.escape.window="$store.recipes.closeSort()"
                >
                  <button
                    type="button"
                    class="landing-menu-item"
                    role="menuitemradio"
                    :aria-checked="$store.recipes.sort === 'modified'"
                    @click="$store.recipes.setSort('modified')"
                  >
                    Last modified
                  </button>
                  <button
                    type="button"
                    class="landing-menu-item"
                    role="menuitemradio"
                    :aria-checked="$store.recipes.sort === 'title'"
                    @click="$store.recipes.setSort('title')"
                  >
                    Title
                  </button>
                </div>
              </template>
            </div>
          </template>

          <!-- Editor -------------------------------------------------------->
          <template x-if="$store.recipes.view === 'editor'">
            <div class="editor">
              <header class="menu-bar">
                <div class="editor-title">
                  <input
                    type="text"
                    class="editor-title-input"
                    :value="$store.recipes.activeName"
                    placeholder="Untitled recipe"
                    @change="$store.recipes.rename($event.target.value)"
                  />
                </div>
                <div class="menu-actions">
                  <button type="button" class="btn-outline" @click="$store.recipes.backToChooser()">
                    Recipes
                  </button>
                  <button type="button" class="btn-outline" @click="$store.recipes.openTrash()">Trash</button>
                  <button type="button" class="btn-outline" @click="$store.recipes.freeze()">Freeze</button>
                  <button type="button" class="btn-outline" @click="$store.recipes.trash()">Move to Trash</button>
                  <button type="button" class="btn-outline" @click="openLibrary()">Library</button>
                  <div class="menu-unit">
                    <button type="button" class="btn-outline" @click="toggleUnits()">Units</button>
                    <div class="unit-popover" x-show="unitsOpen" @click.outside="closeUnits()">
                      <div class="unit-cols">
                        <template x-for="g in unitGroups" :key="g.label">
                          <div class="unit-col">
                            <span class="unit-col-title" x-text="g.label"></span>
                            <template x-for="d in g.dims" :key="d.id">
                              <div class="unit-row">
                                <label class="form-label" x-text="d.label"></label>
                                <select
                                  class="form-select"
                                  :value="unitMode[d.id] || d.default || d.units[0][0]"
                                  @change="setUnit(d.id, $event.target.value)"
                                >
                                  <template x-for="u in d.units" :key="u[0]">
                                    <option :value="u[0]" :selected="u[0] === (unitMode[d.id] || d.default || d.units[0][0])" x-text="u[1]"></option>
                                  </template>
                                </select>
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                      <div class="unit-reset">
                        <button type="button" class="btn-link text-xs" @click="resetUnits()">
                          Reset unit defaults
                        </button>
                      </div>
                    </div>
                  </div>
                  <span class="auth-user">
                    <span x-text="$store.auth.user.email || ''"></span>
                    <button type="button" class="btn-link" @click="$store.auth.signOut()">Sign out</button>
                  </span>
                </div>
              </header>

              <div class="stage">
                <div class="alert alert-warning" x-show="boundaryError">
                  <div class="alert-header">
                    <span class="alert-dot"></span>
                    <span x-text="'Solver error: ' + (boundaryError && boundaryError.code ? boundaryError.code : 'unknown')"></span>
                  </div>
                  <p x-text="boundaryError && boundaryError.message"></p>
                </div>

                <!-- Step body: a definite-width nav rail + the active step card. -->
                <div class="step-body">
                  <nav class="step-rail" aria-label="Step navigation">
                    <button
                      type="button"
                      class="step-rail-btn"
                      @click="prev()"
                      :disabled="activeIndex === 0"
                      aria-label="Previous step"
                    >
                      ▲
                    </button>
                    <button
                      type="button"
                      class="step-rail-btn"
                      @click="next()"
                      :disabled="activeIndex === steps.length - 1"
                      aria-label="Next step"
                    >
                      ▼
                    </button>
                  </nav>

                  <div class="step-viewport">
                    <div class="step-row">
                      <template x-for="step in [activeStep]" :key="step.id">
                        <div class="step-slot" :class="navClass">
                          <template x-if="step.id === 'style'">
                            <load src="./src/partials/step-style.html" />
                          </template>
                          <template x-if="step.id === 'yeast'">
                            <load src="./src/partials/step-yeast.html" />
                          </template>
                          <template x-if="step.id === 'fermentables'">
                            <load src="./src/partials/step-fermentables.html" />
                          </template>
                          <template x-if="step.id === 'hops'">
                            <load src="./src/partials/step-hops.html" />
                          </template>
                          <template x-if="step.id === 'late-additions'">
                            <load src="./src/partials/step-late-additions.html" />
                          </template>
                          <template x-if="step.id === 'mash'">
                            <load src="./src/partials/step-mash.html" />
                          </template>
                          <template x-if="step.id === 'brew-day'">
                            <load src="./src/partials/step-brew-day.html" />
                          </template>
                          <template x-if="step.id !== 'yeast' && step.id !== 'style' && step.id !== 'fermentables' && step.id !== 'hops' && step.id !== 'late-additions' && step.id !== 'mash' && step.id !== 'brew-day'">
                            <load src="./src/partials/step-card.html" />
                          </template>
                        </div>
                      </template>
                    </div>
                  </div>
                </div>
              </div>

              <footer class="app-footer">
                <span class="save-state text-xs" x-show="$store.recipes.saveState !== 'idle'">
                  <span x-show="$store.recipes.saveState === 'dirty'">Unsaved</span>
                  <span x-show="$store.recipes.saveState === 'saving'">Saving…</span>
                  <button
                    type="button"
                    class="btn-link text-xs"
                    x-show="$store.recipes.saveState === 'error'"
                    @click="$store.recipes.retrySave()"
                  >Save failed — retry</button>
                  <span x-show="$store.recipes.saveState === 'conflict'">
                    Changed in another tab —
                    <button type="button" class="btn-link text-xs" @click="$store.recipes.keepMine()">Keep mine</button>
                    <button type="button" class="btn-link text-xs" @click="$store.recipes.reloadFromRemote()">Reload</button>
                  </span>
                </span>
                <span class="footer-step" x-text="activeStep.title"></span>
                <span class="footer-step-count" x-text="'Step ' + (activeIndex + 1) + ' of ' + steps.length"></span>
                <span class="boundary-status" x-show="boundaryPending">
                  <span class="status-dot status-dot-warning"></span>
                  <span class="text-xs text-muted">Solving…</span>
                </span>
                <span class="footer-violations" x-show="violationCount > 0">
                  <span class="status-dot status-dot-error"></span>
                  <span x-text="violationCount + ' violation(s)'"></span>
                </span>
                <span class="footer-violations" x-show="styleConformance && styleConformance.hasBaseline">
                  <span
                    class="status-dot"
                    :class="styleSai >= 90 ? 'status-dot-success' : 'status-dot-warning'"
                  ></span>
                  <span x-text="'SAI ' + styleSai"></span>
                </span>
              </footer>
            </div>
          </template>
        </div>
      </template>
    </main>
  </body>
</html>
