<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brewing Calculator</title>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main class="app-shell" x-data="stepCalculator()" x-init="init()">
      <div class="signin-panel" x-show="!$store.auth.user && !$store.auth.loading">
        <h1 class="card-title">Brewing Calculator</h1>
        <p class="card-description">Sign in to open your recipes.</p>
        <button type="button" class="btn-primary" @click="$store.auth.signIn()">
          Sign in anonymously
        </button>
      </div>

      <div class="app-content" x-show="$store.auth.user">
        <header class="menu-bar">
          <span class="menu-title">Brewing Calculator</span>
          <div class="menu-actions">
            <div class="menu-recipes">
              <button type="button" class="btn-outline" @click="$store.recipes.toggle()">
                Recipes
              </button>
              <div
                class="recipes-popover"
                x-show="$store.recipes.open"
                @click.outside="$store.recipes.open = false"
              >
                <div class="recipes-actions">
                  <button type="button" class="btn-primary" @click="$store.recipes.newRecipe()">＋ New</button>
                  <button type="button" class="btn-outline" @click="$store.recipes.rename()">Rename</button>
                  <button type="button" class="btn-outline" @click="$store.recipes.freeze()">Freeze</button>
                </div>
                <div class="recipes-list">
                  <template x-for="b in $store.recipes.batches" :key="b.id">
                    <button
                      type="button"
                      class="recipes-item"
                      :class="(b.id === $store.recipes.activeId ? 'is-active' : '') + (b.status === 'frozen' ? ' is-frozen' : '')"
                      @click="b.status === 'draft' ? $store.recipes.openDraft(b.id) : $store.recipes.forkFrozen(b.id)"
                    >
                      <span class="recipes-name" x-text="b.name"></span>
                      <span class="recipes-hint" x-show="b.status === 'frozen'" x-text="'frozen — click to copy'"></span>
                    </button>
                  </template>
                  <p class="recipes-empty" x-show="!$store.recipes.batches.length">No recipes yet.</p>
                </div>
              </div>
            </div>
            <div class="menu-unit">
              <button type="button" class="btn-outline" @click="toggleUnits()">Units</button>
              <div class="unit-popover" x-show="unitsOpen" @click.outside="unitsOpen = false">
                <template x-for="d in unitDimensions" :key="d.id">
                  <div class="unit-row">
                    <label class="form-label" x-text="d.label"></label>
                    <select
                      class="form-select"
                      :value="unitMode[d.id] || d.units[0][0]"
                      @change="setUnit(d.id, $event.target.value)"
                    >
                      <template x-for="u in d.units" :key="u[0]">
                        <option :value="u[0]" x-text="u[1]"></option>
                      </template>
                    </select>
                  </div>
                </template>
              </div>
            </div>
            <span class="auth-user">
              <span x-text="$store.auth.user.isAnonymous ? 'Anonymous' : ($store.auth.user.email || '')"></span>
              <button type="button" class="btn-link" @click="$store.auth.signOut()">Sign out</button>
            </span>
          </div>
        </header>

        <nav class="step-progress">
          <template x-for="(s, i) in steps" :key="s.id">
            <button
              type="button"
              class="step-progress-node"
              :class="i < highwater ? 'is-complete' : (i === activeIndex ? 'is-active' : '')"
              :disabled="i > highwater"
              @click="selectStep(i)"
            >
              <span class="step-progress-index" x-text="i + 1"></span>
              <span class="step-progress-label" x-text="s.title"></span>
              <span
                class="status-dot status-dot-error"
                x-show="(stepStatus[s.slice].relations.length + stepStatus[s.slice].domains.length) > 0"
              ></span>
            </button>
          </template>
        </nav>

        <div class="alert alert-warning" x-show="boundaryError">
          <div class="alert-header">
            <span class="alert-dot"></span>
            <span x-text="'Solver error: ' + (boundaryError && boundaryError.code ? boundaryError.code : 'unknown')"></span>
          </div>
          <p x-text="boundaryError && boundaryError.message"></p>
        </div>

        <div class="boundary-status" x-show="boundaryPending">
          <span class="status-dot status-dot-warning"></span>
          <span class="text-xs text-muted">Solving…</span>
        </div>

        <div class="step-row">
          <template x-for="step in visibleSteps" :key="step.id">
            <template x-if="step.id === 'yeast'">
              <load src="./src/partials/step-yeast.html" />
            </template>
            <template x-if="step.id !== 'yeast'">
              <load src="./src/partials/step-card.html" />
            </template>
          </template>
        </div>

        <footer class="sticky-footer">
          <button type="button" class="btn-outline" @click="prev()" :disabled="activeIndex === 0">
            ← Back
          </button>
          <span class="footer-step" x-text="'Step ' + (activeIndex + 1) + ' of ' + steps.length"></span>
          <button
            type="button"
            class="btn-outline"
            @click="next()"
            :disabled="activeIndex === steps.length - 1"
          >
            Next →
          </button>
          <span class="footer-violations" x-show="violationCount > 0">
            <span class="status-dot status-dot-error"></span>
            <span x-text="violationCount + ' violation(s)'"></span>
          </span>
        </footer>
      </div>
    </main>
  </body>
</html>
