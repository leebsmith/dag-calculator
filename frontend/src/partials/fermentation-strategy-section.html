<section class="card-section">
  <div class="section-header">
    <span class="region-title">Fermentation strategy</span>
  </div>
  <div class="section-body">
    <div
      x-data="formBuilder({
        schema: [
          {
            id: 'fermentation-strategy',
            type: 'textarea',
            label: 'Strategy',
            rows: 5,
            read: () => fermentationStrategy,
            write: (value) => setFermentationStrategy(value),
            commit: 'change',
            placeholder: 'Pitch rate and starter, oxygenation, temperature schedule, and the character you want from the strain.',
            attrs: { maxlength: 4000 },
            hint: 'Markdown supported: paragraphs, lists, tables, emphasis, links, and code. Blank lines separate paragraphs.'
          }
        ]
      })"
    >
      <load src="src/partials/ui-form-fields.html" />
      <template x-for="issue in proseIssues(fermentationStrategy)" :key="issue.code">
        <p class="form-hint text-warning" x-text="issue.message"></p>
      </template>
    </div>
  </div>
</section>
