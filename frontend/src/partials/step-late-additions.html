<section class="step-card">
  <div class="step-card-header">
    <h2 class="card-title" x-text="activeStep.title"></h2>
    <p class="card-subtitle" x-show="activeStep.subtitle" x-text="activeStep.subtitle"></p>
  </div>

  <div class="step-card-content">
    <div class="table-header-toolbar">
      <div>
        <h3 class="modal-drawer-title">Late Sugar Additions</h3>
        <p class="text-xs text-muted">Kettle sugars, dosed by mass; they feed the batch solver's late extract.</p>
      </div>
      <button type="button" class="btn-primary text-xs" @click="openSugarEditor()">Configure Sugars ⚙</button>
    </div>

    <template x-if="lateSugarField">
      <div class="data-table-container">
        <table class="data-table">
          <thead>
            <tr>
              <template x-for="c in lateSugarField.columns" :key="c.id">
                <th :class="c.dimension ? 'text-right' : ''" x-text="fmt.formatColumnHeader(c)"></th>
              </template>
            </tr>
          </thead>
          <tbody>
            <template x-for="(row, ri) in lateSugarField.rows" :key="ri">
              <tr>
                <template x-for="c in lateSugarField.columns" :key="c.id">
                  <td :class="c.dimension ? 'text-right tabular-nums' : ''" x-text="row[c.id]"></td>
                </template>
              </tr>
            </template>
            <template x-if="lateSugarField.rows.length === 0">
              <tr>
                <td :colspan="lateSugarField.columns.length" class="table-empty-cell">
                  No sugars yet. Click “Configure Sugars” to add late additions.
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </template>

    <p class="text-xs text-muted">
      Fermentable is the real share of extract. <span aria-hidden="true">~</span> assumed
      prior · <span aria-hidden="true">≥</span> published minimum (a floor) ·
      <span aria-hidden="true">≈</span> converted from apparent attenuation at 12 °P.
    </p>

    <div class="grain-bill-summary" x-show="lateSugarField && lateSugarField.rows.length > 0">
      <div class="grain-bill-summary-item">
        <span class="text-xs text-muted">Total sugar mass</span>
        <span
          class="text-base font-bold tabular-nums"
          x-text="fmt.formatQuantity(sugarMassField)"
        ></span>
      </div>
      <div class="grain-bill-summary-item">
        <span class="text-xs text-muted">Weighted sugar color</span>
        <span
          class="text-base font-bold tabular-nums"
          x-text="fmt.formatQuantity(sugarColorField)"
        ></span>
      </div>
      <div class="grain-bill-summary-item">
        <span class="text-xs text-muted">Late extract</span>
        <span
          class="text-base font-bold tabular-nums"
          x-text="fmt.formatQuantity(lateExtractField)"
        ></span>
      </div>
    </div>

    <template x-if="sugarEffectDisplay">
      <div>
        <div class="grain-bill-summary">
          <div class="grain-bill-summary-item">
            <span class="text-xs text-muted">Extract share</span>
            <span class="text-base font-bold tabular-nums" x-text="sugarEffectDisplay.share"></span>
          </div>
          <div class="grain-bill-summary-item">
            <span class="text-xs text-muted">ΔOG</span>
            <span class="text-base font-bold tabular-nums" x-text="sugarEffectDisplay.og"></span>
          </div>
          <div class="grain-bill-summary-item">
            <span class="text-xs text-muted">ΔFG</span>
            <span class="text-base font-bold tabular-nums" x-text="sugarEffectDisplay.fg"></span>
          </div>
          <div class="grain-bill-summary-item">
            <span class="text-xs text-muted">ΔABV</span>
            <span class="text-base font-bold tabular-nums" x-text="sugarEffectDisplay.abv"></span>
          </div>
          <div class="grain-bill-summary-item">
            <span class="text-xs text-muted">Malt displaced</span>
            <span class="text-base font-bold tabular-nums" x-text="sugarEffectDisplay.grist"></span>
          </div>
        </div>
        <p class="text-xs text-muted">
          At the current ABV pin. Sugar is fully fermentable, so it adds alcohol and
          extract but no FG; the view shows what removing this dose would change.
        </p>
      </div>
    </template>
  </div>

  <load src="src/partials/modal-sugar-editor.html" />
</section>
