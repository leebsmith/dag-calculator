<section class="step-card">
  <div class="step-card-header">
    <h2 class="card-title" x-text="activeStep.title"></h2>
    <p class="card-subtitle" x-show="activeStep.subtitle" x-text="activeStep.subtitle"></p>
  </div>

  <div class="step-card-content">
    <div class="table-header-toolbar">
      <div>
        <h3 class="modal-drawer-title">Late Sugar Additions</h3>
        <p class="text-xs text-muted" x-text="lateAdditionIntent === 'share'
          ? 'Kettle sugars authored as a share of total extract; the solver derives the row masses.'
          : 'Kettle sugars, dosed by mass; they feed the batch solver\'s late extract.'"></p>
      </div>
      <button type="button" class="btn-primary text-xs" @click="openSugarEditor()">Configure Sugars ⚙</button>
    </div>

    <template x-if="lateIntentField">
      <div class="form-group">
        <label class="form-label" :for="lateIntentField.id" x-text="lateIntentField.label"></label>
        <select
          class="form-select"
          :id="lateIntentField.id"
          :value="lateIntentField.value"
          @change="setLateAdditionIntent($event.target.value)"
        >
          <template x-for="opt in (lateIntentField.options || [])" :key="opt">
            <option
              :value="opt"
              :selected="opt === lateIntentField.value"
              x-text="fmt.optionLabel(lateIntentField.optionLabels, opt)"
            ></option>
          </template>
        </select>
        <span class="form-hint" x-text="lateIntentField.hint"></span>
      </div>
    </template>

    <template x-if="lateAdditionIntent === 'share' && sugarShareField">
      <div class="form-group">
        <label class="form-label" :for="sugarShareField.id" x-text="sugarShareField.label"></label>
        <input
          class="form-input"
          type="number"
          step="0.1"
          min="0"
          max="95"
          :id="sugarShareField.id"
          :value="inputDraft(inputKey('field', sugarShareField.id), sugarShareField.display)"
          @input="editNumberInput(inputKey('field', sugarShareField.id), sugarShareField, $event.target.value)"
          @change="commitNumberInput(inputKey('field', sugarShareField.id), sugarShareField)"
        />
        <span class="form-hint" x-text="sugarShareField.hint"></span>
        <div class="table-action-cell">
          <button type="button" class="btn-outline text-xs" @click="adoptLateAdditionDose()">
            Adopt current dose
          </button>
          <button type="button" class="btn-outline text-xs" @click="adoptLateAdditionShare()">
            Adopt share into masses
          </button>
        </div>
      </div>
    </template>

    <template x-if="latePinPanelVisible">
      <div class="synthesized-card">
        <div class="synthesized-header">
          <h3 class="synthesized-title">Pin preview</h3>
          <button
            type="button"
            class="btn-outline text-xs"
            @click="toggleLatePinPanel()"
            x-text="latePinPanelOpen ? 'Hide' : 'Show'"
          ></button>
        </div>
        <div x-show="latePinPanelOpen">
          <p class="form-hint" x-text="previewCompositionCaption"></p>

          <p class="form-hint">
            Pin: <span class="font-bold" x-text="scalePinLabel"></span> — change the pin and
            target on the Style step.
          </p>
          <div class="data-table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Pin</th>
                  <th class="text-right">OG</th>
                  <th class="text-right">FG</th>
                  <th class="text-right">ABV</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="row in scalePreviewRows" :key="row.pin">
                  <tr :class="{ 'font-bold': row.active }">
                    <td>
                      <span x-text="row.pinLabel"></span>
                      <span class="text-xs text-danger" x-show="!row.ok" x-text="row.statusLabel"></span>
                    </td>
                    <td class="text-right tabular-nums">
                      <span :class="row.ogClass" x-text="row.ogDisplay"></span>
                    </td>
                    <td class="text-right tabular-nums">
                      <span :class="row.fgClass" x-text="row.fgDisplay"></span>
                    </td>
                    <td class="text-right tabular-nums">
                      <span :class="row.abvClass" x-text="row.abvDisplay"></span>
                    </td>
                  </tr>
                </template>
                <template x-if="scalePreviewRows.length === 0">
                  <tr>
                    <td colspan="4" class="table-empty-cell">Solve the batch to preview the three pins.</td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <p class="form-hint">
            The active row is the batch; the others are hypothetical solves at their own
            targets. Style conflicts are warnings, never freeze gates.
          </p>
        </div>
      </div>
    </template>

    <template x-if="lateSugarField">
      <div class="data-table-container">
        <table class="data-table">
          <thead>
            <tr>
              <template x-for="c in lateSugarField.columns" :key="c.id">
                <th :class="c.dimension ? 'text-right' : ''" x-text="fmt.formatColumnHeader(c)"></th>
              </template>
            </tr>
          </thead>
          <tbody>
            <template x-for="(row, ri) in lateSugarField.rows" :key="ri">
              <tr>
                <template x-for="c in lateSugarField.columns" :key="c.id">
                  <td :class="c.dimension ? 'text-right tabular-nums' : ''" x-text="row[c.id]"></td>
                </template>
              </tr>
            </template>
            <template x-if="lateSugarField.rows.length === 0">
              <tr>
                <td :colspan="lateSugarField.columns.length" class="table-empty-cell">
                  No sugars yet. Click “Configure Sugars” to add late additions.
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </template>

    <p class="text-xs text-muted">
      Fermentable is the real share of extract. <span aria-hidden="true">~</span> assumed
      prior · <span aria-hidden="true">≥</span> published minimum (a floor) ·
      <span aria-hidden="true">≈</span> converted from apparent attenuation at 12 °P.
      In share mode, Parts weight the sugar-extract budget and Mass is derived.
    </p>

    <div class="grain-bill-summary" x-show="lateSugarField && lateSugarField.rows.length > 0">
      <div class="grain-bill-summary-item">
        <span class="text-xs text-muted">Total sugar mass</span>
        <span
          class="text-base font-bold tabular-nums"
          x-text="fmt.formatQuantity(sugarMassField)"
        ></span>
      </div>
      <div class="grain-bill-summary-item">
        <span class="text-xs text-muted">Weighted sugar color</span>
        <span
          class="text-base font-bold tabular-nums"
          x-text="fmt.formatQuantity(sugarColorField)"
        ></span>
      </div>
      <div class="grain-bill-summary-item">
        <span class="text-xs text-muted">Late extract</span>
        <span
          class="text-base font-bold tabular-nums"
          x-text="fmt.formatQuantity(lateExtractField)"
        ></span>
      </div>
    </div>

    <template x-if="sugarEffectDisplay">
      <div>
        <div class="grain-bill-summary">
          <div class="grain-bill-summary-item">
            <span class="text-xs text-muted">Extract share</span>
            <span class="text-base font-bold tabular-nums" x-text="sugarEffectDisplay.share"></span>
          </div>
          <div class="grain-bill-summary-item">
            <span class="text-xs text-muted">ΔOG</span>
            <span class="text-base font-bold tabular-nums" x-text="sugarEffectDisplay.og"></span>
          </div>
          <div class="grain-bill-summary-item">
            <span class="text-xs text-muted">ΔFG</span>
            <span class="text-base font-bold tabular-nums" x-text="sugarEffectDisplay.fg"></span>
          </div>
          <div class="grain-bill-summary-item">
            <span class="text-xs text-muted">ΔABV</span>
            <span class="text-base font-bold tabular-nums" x-text="sugarEffectDisplay.abv"></span>
          </div>
          <div class="grain-bill-summary-item">
            <span class="text-xs text-muted">Malt displaced</span>
            <span class="text-base font-bold tabular-nums" x-text="sugarEffectDisplay.grist"></span>
          </div>
        </div>
        <p class="text-xs text-muted">
          At the current ABV pin. Sugar is fully fermentable, so it adds alcohol and
          extract but no FG; the view shows what removing this dose would change.
          In share mode the dose is the sugar-extract budget derived from the share.
        </p>
      </div>
    </template>
  </div>

  <load src="src/partials/modal-sugar-editor.html" />
</section>
