<section class="step-card">
  <div class="step-card-header">
    <h2 class="card-title" x-text="activeStep.title"></h2>
    <p class="card-subtitle" x-show="activeStep.subtitle" x-text="activeStep.subtitle"></p>
  </div>

  <div class="step-card-content">
    <div class="table-header-toolbar">
      <div>
        <h3 class="modal-drawer-title">Late Sugar Additions</h3>
        <p class="table-header-meta">Kettle sugars, dosed by mass (kg); they feed the batch solver's late extract.</p>
      </div>
      <button type="button" class="btn-primary text-xs" @click="openSugarEditor()">Configure Sugars ⚙</button>
    </div>

    <div class="data-table-container">
      <table class="data-table">
        <colgroup>
          <col style="width: 40%" />
          <col style="width: 18%" />
          <col style="width: 20%" />
          <col style="width: 22%" />
        </colgroup>
        <thead>
          <tr>
            <th>Sugar</th>
            <th class="text-right">Mass</th>
            <th class="text-right">Yield</th>
            <th class="text-right">°L</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="(row, ri) in sugarList" :key="ri">
            <tr>
              <td><span class="font-medium" x-text="row.name"></span></td>
              <td class="text-right tabular-nums" x-text="row.mass_kg"></td>
              <td class="text-right tabular-nums" x-text="(row.yield_fraction * 100).toFixed(1) + '%'"></td>
              <td class="text-right tabular-nums" x-text="Number(row.color_lovibond).toFixed(1)"></td>
            </tr>
          </template>
          <template x-if="sugarList.length === 0">
            <tr>
              <td colspan="4" class="table-empty-cell">
                No sugars yet. Click “Configure Sugars” to add late additions.
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>

    <div class="grain-bill-summary" x-show="sugarList.length > 0">
      <div class="grain-bill-summary-item">
        <span class="text-xs text-muted">Total sugar mass</span>
        <span
          class="text-base font-bold tabular-nums"
          x-text="sugarMassField ? sugarMassField.display + ' ' + (sugarMassField.unit ?? '') : '—'"
        ></span>
      </div>
      <div class="grain-bill-summary-item">
        <span class="text-xs text-muted">Weighted sugar color</span>
        <span
          class="text-base font-bold tabular-nums"
          x-text="sugarColorField ? sugarColorField.display + ' ' + (sugarColorField.unit ?? '') : '—'"
        ></span>
      </div>
      <div class="grain-bill-summary-item">
        <span class="text-xs text-muted">Late extract</span>
        <span
          class="text-base font-bold tabular-nums"
          x-text="lateExtractField ? lateExtractField.display + ' ' + (lateExtractField.unit ?? '') : '—'"
        ></span>
      </div>
    </div>
  </div>

  <load src="src/partials/modal-sugar-editor.html" />
</section>
