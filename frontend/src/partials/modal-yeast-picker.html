<!-- Yeast picker: one strain for the batch. The page shows the chosen row; this
     modal is the catalog. -->
<div
  x-data="modalShell({
    id: 'yeast-picker',
    title: 'Choose Yeast',
    subtitle: () => (selectedYeast ? selectedYeast.name : 'No strain selected'),
    cancel: () => closeYeastPicker(),
    cancelLabel: 'Close',
    escape: () => handleYeastEscape()
  })"
  x-effect="syncOpen(yeastPickerOpen)"
>
  <load src="src/partials/ui-modal-shell.html" />

  <template x-teleport="#yeast-picker-body">
    <div class="modal-workspace-main">
        <div class="yeast-filter-grid">
          <div class="form-group">
            <label class="form-label" for="yeast-search">Search</label>
            <div class="table-action-cell">
              <input
                id="yeast-search"
                type="text"
                class="form-input"
                placeholder="e.g. American Ale"
                x-model="yeastSearchQuery"
              />
              <button
                type="button"
                class="filter-pill segmented-item segmented-item--solid"
                :class="{ 'is-active': yeastSearchNotes }"
                :aria-pressed="yeastSearchNotes ? 'true' : 'false'"
                @click="toggleYeastSearchNotes()"
              >
                Notes
              </button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="yeast-manufacturer">Manufacturer</label>
            <select id="yeast-manufacturer" class="form-select" x-model="yeastManufacturerFilter">
              <option value="">All manufacturers</option>
              <template x-for="mfr in yeastManufacturers" :key="mfr">
                <option :value="mfr" x-text="mfr"></option>
              </template>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="yeast-attenuation">Attenuation</label>
            <select id="yeast-attenuation" class="form-select" x-model="yeastAttenuationFilter">
              <option value="">Any attenuation</option>
              <template x-for="t in yeastAttenuationTiers" :key="'a-' + t.key">
                <option :value="t.key" x-text="t.label"></option>
              </template>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="yeast-sta1">STA1</label>
            <select id="yeast-sta1" class="form-select" x-model="yeastDiastaticusFilter">
              <option value="">Any STA1</option>
              <template x-for="t in yeastDiastaticusTiers" :key="'d-' + t.key">
                <option :value="t.key" x-text="t.label + ' · ' + t.count"></option>
              </template>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="yeast-pof">POF</label>
            <select id="yeast-pof" class="form-select" x-model="yeastPofFilter">
              <option value="">Any POF</option>
              <template x-for="t in yeastPofTiers" :key="'p-' + t.key">
                <option :value="t.key" x-text="t.label + ' · ' + t.count"></option>
              </template>
            </select>
          </div>
        </div>
        <p class="form-hint">
          STA1 is the vendor's QC marker; it does not change the primary attenuation solve.
          An unpublished result is shown as unknown. POF is the phenolic off-flavour phenotype,
          unrelated to attenuation; unknown means no vendor result is recorded.
        </p>

        <div class="catalog-result-counter" aria-live="polite" x-text="yeastResultLabel"></div>

        <div class="data-table-container data-table-container--scroll">
          <table class="data-table data-table--editor data-table--fixed">
            <colgroup>
              <col style="width: 40%;" />
              <col style="width: 16%;" />
              <col style="width: 16%;" />
              <col style="width: 16%;" />
              <col style="width: 12%;" />
            </colgroup>
            <thead>
              <tr>
                <th>Strain</th>
                <th>Manufacturer</th>
                <th class="text-right">Attenuation</th>
                <th>Temp</th>
                <th class="text-right">Action</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="y in visibleYeasts" :key="y.id">
                <tr :class="{ 'is-selected': selectedYeastId === y.id }">
                  <td>
                    <div class="yeast-row-badges">
                      <span class="font-medium" x-text="y.name"></span>
                      <template x-if="isUserItem(y.id)">
                        <span class="status-badge status-badge-info text-nano">mine</span>
                      </template>
                      <span
                        class="status-badge status-badge-info text-nano"
                        x-text="yeastSta1(y)"
                      ></span>
                      <template x-if="yeastPof(y)">
                        <span
                          class="status-badge status-badge-info text-nano"
                          x-text="yeastPof(y)"
                        ></span>
                      </template>
                    </div>
                    <details
                      class="yeast-row-details"
                      x-show="y.flocculation || y.alcohol_tolerance"
                    >
                      <summary>details</summary>
                      <span x-show="y.flocculation">
                        Flocculation: <span x-text="y.flocculation"></span>
                      </span>
                      <span x-show="y.alcohol_tolerance">
                        Tolerance: <span x-text="y.alcohol_tolerance"></span>
                      </span>
                    </details>
                  </td>
                  <td x-text="y.manufacturer"></td>
                  <td class="text-right tabular-nums" x-text="yeastPublished(y)"></td>
                  <td x-text="yeastTemperature(y)"></td>
                  <td class="table-action-cell">
                    <button
                      type="button"
                      class="btn btn-secondary btn-sm"
                      :class="{ 'is-active': selectedYeastId === y.id }"
                      :aria-pressed="selectedYeastId === y.id ? 'true' : 'false'"
                      @click="selectYeast(y.id)"
                      x-text="selectedYeastId === y.id ? 'Selected' : 'Use'"
                    ></button>
                  </td>
                </tr>
              </template>
              <template x-if="filteredYeasts.length === 0">
                <tr>
                  <td colspan="5" class="table-empty-cell">No yeast strains match the current filters.</td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
  </template>
</div>
