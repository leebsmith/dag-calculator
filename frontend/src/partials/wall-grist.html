<section class="card">
  <div class="card-header">
    <h2 class="card-title" x-text="fieldset.title"></h2>
    <p class="card-subtitle" x-show="fieldset.subtitle" x-text="fieldset.subtitle"></p>
  </div>

  <div class="card-body">
    <section class="card-section">
      <div class="wall-fields">
        <template x-for="block in fieldsetBlocks['grist']" :key="block.id">
          <template x-if="block.id === 'moisture'">
            <load src="src/partials/wall-block.html" />
          </template>
        </template>
      </div>
    </section>

    <section class="card-section card-section--collapsible">
      <div class="section-header">
        <button
          type="button"
          class="section-toggle"
          :aria-expanded="maltSectionOpen ? 'true' : 'false'"
          aria-controls="fermentables-grist"
          @click="toggleMaltSection()"
        >
          <span class="section-chevron" aria-hidden="true">▸</span>
          <span class="region-title">Major Grist</span>
          <span class="section-meta" x-text="maltSectionMeta"></span>
        </button>
        <div class="section-actions">
          <button type="button" class="btn-primary btn-sm" @click="openMaltEditor()">Configure Malts ⚙</button>
        </div>
      </div>

      <div class="section-body" id="fermentables-grist" x-show="maltSectionOpen">
        <p class="text-xs text-muted">
          Authored as parts, normalized by the Hamilton largest-remainder algorithm (sums to 100.0%).
        </p>

        <div x-data="tableConfig" data-config="gristTableConfig">
          <load src="src/partials/ui-data-table.html" />
        </div>

        <p class="text-xs text-muted">
          Fermentable is the real share of extract. <span aria-hidden="true">~</span> assumed
          prior · <span aria-hidden="true">≥</span> published minimum (a floor) ·
          <span aria-hidden="true">≈</span> converted from apparent attenuation at 12 °P.
        </p>

      </div>
    </section>

    <section class="card-section card-section--collapsible">
      <div class="section-header">
        <button
          type="button"
          class="section-toggle"
          :aria-expanded="traceSectionOpen ? 'true' : 'false'"
          aria-controls="fermentables-trace"
          @click="toggleTraceSection()"
        >
          <span class="section-chevron" aria-hidden="true">▸</span>
          <span class="region-title">Trace / Color Malts</span>
          <span class="section-meta" x-text="traceSectionMeta"></span>
        </button>
        <div class="section-actions">
          <button type="button" class="btn-primary btn-sm" @click="openTraceEditor()">Configure Trace Malts ⚙</button>
        </div>
      </div>

      <div class="section-body" id="fermentables-trace" x-show="traceSectionOpen">
        <p class="text-xs text-muted">
          Dosed by mass; they influence color and mash pH, not extract.
        </p>

        <template x-if="traceMaltField">
          <div x-data="tableConfig" data-config="traceMaltTableConfig">
            <load src="src/partials/ui-data-table.html" />
          </div>
        </template>
      </div>
    </section>

    <load src="src/partials/fermentables-sugar-section.html" />
  </div>

  <load src="src/partials/modal-malt-editor.html" />
  <load src="src/partials/modal-trace-malt-editor.html" />
</section>
