<!-- Import view shell: the transcription stage, and the two stages still to come.
     Identity was chosen in the New batch dialog, so this surface never asks for it
     again — it shows what was read and lets a person correct it. -->
<div class="import-view">
  <header class="menu-bar">
    <span class="menu-title">Import a recipe</span>
    <div class="menu-actions">
      <button type="button" class="btn-outline" @click="$store.recipes.backToBatches()">
        Batches
      </button>
      <span class="auth-user">
        <span x-text="$store.auth.user.email || ''"></span>
        <button type="button" class="btn-link" @click="$store.auth.signOut()">Sign out</button>
      </span>
    </div>
  </header>

  <nav class="import-stages" aria-label="Import stages">
    <button
      type="button"
      class="btn-outline text-xs"
      :class="{ 'is-active': $store.importReview.stage === 'transcribe' }"
      :aria-pressed="$store.importReview.stage === 'transcribe'"
      @click="$store.importReview.goTo('transcribe')"
    >1 · Transcribe</button>
    <button
      type="button"
      class="btn-outline text-xs"
      :class="{ 'is-active': $store.importReview.stage === 'map' }"
      :aria-pressed="$store.importReview.stage === 'map'"
      @click="$store.importReview.goTo('map')"
    >2 · Map</button>
    <button
      type="button"
      class="btn-outline text-xs"
      :class="{ 'is-active': $store.importReview.stage === 'check' }"
      :aria-pressed="$store.importReview.stage === 'check'"
      @click="$store.importReview.goTo('check')"
    >3 · Check</button>
  </nav>

  <div class="import-body">
    <div class="alert alert-warning" x-show="$store.importReview.error">
      <div class="alert-header">
        <span class="alert-dot"></span>
        <span x-text="$store.importReview.error"></span>
      </div>
    </div>

    <div class="import-empty" x-show="!$store.importReview.record">
      <p class="form-hint">
        No document is open. Start one from <strong>New batch → From a recipe</strong>, or resume an
        import from the landing page.
      </p>
      <button type="button" class="btn-outline" @click="$store.recipes.backToBatches()">
        Back to batches
      </button>
    </div>

    <div class="alert alert-warning import-verdict" x-show="$store.importReview.verdict">
      <div class="alert-header">
        <span class="alert-dot"></span>
        <span x-text="$store.importReview.verdict?.title"></span>
      </div>
      <p x-text="$store.importReview.verdict?.detail"></p>
      <p class="text-xs text-muted">
        You can still enter batch quantities by hand — a grain bill can be typed straight from
        printed rates as parts.
      </p>
      <div class="import-queue-actions">
        <button type="button" class="btn-outline text-xs" :disabled="$store.importReview.busy"
          @click="$store.importReview.markFailed()">Mark as failed</button>
        <button type="button" class="btn-outline text-xs" :disabled="$store.importReview.busy"
          @click="$store.importReview.discard()">Delete</button>
      </div>
    </div>

    <template x-if="$store.importReview.record && $store.importReview.stage === 'transcribe'">
      <load src="src/partials/import-transcribe.html" />
    </template>

    <template x-if="$store.importReview.record && $store.importReview.stage === 'map'">
      <load src="src/partials/import-map.html" />
    </template>

    <template x-if="$store.importReview.record && $store.importReview.stage === 'check'">
      <load src="src/partials/import-check.html" />
    </template>
  </div>

  <footer class="app-footer" x-show="$store.importReview.record">
    <span class="footer-step" x-text="$store.importReview.stage === 'map' ? 'Map' : 'Transcribe'"></span>
    <span class="text-xs text-muted" x-text="$store.importReview.summary?.filename || ''"></span>
    <span class="text-xs text-muted" x-show="$store.importReview.dirty">Unsaved corrections</span>
    <span class="text-xs text-muted" x-show="$store.importReview.busy">Saving…</span>
    <span class="boundary-status" x-show="$store.importReview.savedAt">
      <span class="status-dot status-dot-ok"></span>
      <span class="text-xs text-muted">Saved</span>
    </span>
    <span class="text-xs text-muted" x-show="$store.importReview.stage === 'map' && !$store.importReview.verdict"
      x-text="$store.importReview.ledgerCounts.total - $store.importReview.unresolved.length
        + ' of ' + $store.importReview.ledgerCounts.total + ' decided'"></span>
    <button
      type="button"
      class="btn-primary text-xs"
      x-show="$store.importReview.stage === 'map'"
      :disabled="$store.importReview.busy
        || (!$store.importReview.dirty && $store.importReview.unresolved.length > 0)"
      @click="$store.importReview.saveAndAdvance()"
      x-text="$store.importReview.unresolved.length === 0
        ? 'Save mapping and check →'
        : 'Save mapping'"
    ></button>
    <button
      type="button"
      class="btn-primary text-xs"
      x-show="$store.importReview.stage !== 'map'"
      :disabled="$store.importReview.busy || !$store.importReview.dirty"
      @click="$store.importReview.save()"
    >Save corrections</button>
    <button
      type="button"
      class="btn-outline text-xs"
      :disabled="$store.importReview.busy"
      @click="$store.importReview.discard()"
    >Delete this import</button>
    <button type="button" class="btn-outline text-xs" @click="$store.recipes.backToBatches()">
      Close
    </button>
  </footer>
</div>
