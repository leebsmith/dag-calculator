<template x-for="field in fields" :key="field.id">
  <div class="form-group" x-show="field.visible">
    <template x-if="field.type === 'checkbox'">
      <label class="form-checkbox-row" :for="field.id">
        <input
          class="form-checkbox"
          type="checkbox"
          :id="field.id"
          :name="field.modelKey"
          x-model="field.value"
          :disabled="field.disabled"
          :required="field.required"
          :aria-invalid="field.invalid ? 'true' : null"
          :aria-describedby="field.hint ? field.id + '-hint' : null"
        />
        <span x-text="field.label"></span>
        <span class="unit-badge" x-show="field.unit" x-text="field.unit"></span>
      </label>
    </template>

    <template x-if="field.type !== 'checkbox'">
      <label class="form-label" :for="field.id">
        <span x-text="field.label"></span>
        <span class="unit-badge" x-show="field.unit" x-text="field.unit"></span>
      </label>
    </template>

    <template x-if="field.type === 'select'">
      <select
        class="form-select"
        :id="field.id"
        :name="field.modelKey"
        x-model="field.value"
        :disabled="field.disabled"
        :required="field.required"
        :aria-invalid="field.invalid ? 'true' : null"
        :aria-describedby="field.hint ? field.id + '-hint' : null"
      >
        <template x-for="option in field.options" :key="option.value">
          <option :value="option.value" x-text="option.label"></option>
        </template>
      </select>
    </template>

    <template x-if="field.type === 'textarea'">
      <textarea
        class="form-input"
        :id="field.id"
        :name="field.modelKey"
        :rows="field.rows || 3"
        x-model="field.value"
        :placeholder="field.placeholder"
        :readonly="field.readonly"
        :disabled="field.disabled"
        :required="field.required"
        :aria-invalid="field.invalid ? 'true' : null"
        :aria-describedby="field.hint ? field.id + '-hint' : null"
      ></textarea>
    </template>

    <template x-if="field.type !== 'select' && field.type !== 'textarea' && field.type !== 'checkbox'">
      <input
        class="form-input"
        :id="field.id"
        :name="field.modelKey"
        :type="field.type || 'text'"
        x-model="field.value"
        :placeholder="field.placeholder"
        :min="field.min"
        :max="field.max"
        :step="field.step"
        :readonly="field.readonly"
        :disabled="field.disabled"
        :required="field.required"
        :aria-invalid="field.invalid ? 'true' : null"
        :aria-describedby="field.hint ? field.id + '-hint' : null"
      />
    </template>

    <p
      class="form-hint"
      :id="field.id + '-hint'"
      x-show="field.hint"
      x-text="field.hint"
    ></p>
  </div>
</template>
