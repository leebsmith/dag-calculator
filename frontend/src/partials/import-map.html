<!-- Map: every transcribed line, its proposed destination, and the decision it
     still needs. The proposals come from the imported recipe; the user confirms them. -->
<section class="import-map">
  <header class="import-doc-header">
    <div>
      <h2 class="import-doc-title" x-text="$store.importReview.title"></h2>
      <p class="text-xs text-muted">
        <span x-text="$store.importReview.summary?.filename"></span>
        · <span x-text="$store.importReview.ledgerCounts.total"></span> lines
      </p>
    </div>
    <div class="import-verification" :class="{ 'is-ok': $store.importReview.unresolved.length === 0, 'is-warn': $store.importReview.unresolved.length > 0 }">
      <span class="font-medium"
        x-text="$store.importReview.unresolved.length === 0
          ? 'Every line is decided'
          : $store.importReview.unresolved.length + ' line(s) still need a decision'"></span>
      <span class="text-xs text-muted"
        x-text="$store.importReview.unresolved.length === 0
          ? 'Every line is decided.'
          : 'Each one is marked on its line, with what it needs.'"></span>
    </div>
  </header>

  <div class="import-queue-actions" x-show="$store.importReview.unresolved.length">
    <button
      type="button"
      class="btn-outline text-xs"
      :disabled="$store.importReview.matchBusy"
      @click="$store.importReview.enrichSuggestions()"
      x-text="$store.importReview.matchBusy ? 'Asking the model…' : 'Ask the model for matches'"
    ></button>
    <span class="text-xs text-muted">One batched call per catalog kind; the chips it returns are kept with the record.</span>
    <span class="text-xs text-muted" x-show="$store.importReview.matchError" x-text="$store.importReview.matchError"></span>
  </div>

  <div class="import-verdict" x-show="$store.importReview.sections.find((s) => s.id === 'hops')?.rows.length">
    <h3 class="import-section-title">Whirlpool IBU share</h3>
    <p class="form-hint" x-show="$store.importReview.printedPoolFraction != null">
      Printed per-addition IBUs give this exactly:
      <strong x-text="Math.round($store.importReview.printedPoolFraction * 100) + '%'"></strong>
      of <span x-text="$store.importReview.payload?.targets?.ibu?.value ?? '—'"></span> IBU.
    </p>
    <template x-if="$store.importReview.printedPoolFraction == null">
      <div>
        <p class="form-hint">
          Imported recipe does not print per-addition IBUs, so the split is yours to author. A zero would
          put every IBU in the boil while the whirlpool charges solve nothing.
        </p>
        <div class="import-queue-actions">
          <input
            class="form-input text-xs"
            type="number"
            min="0"
            max="100"
            step="1"
            placeholder="share %"
            :value="$store.importReview.poolFraction == null ? '' : Math.round($store.importReview.poolFraction * 100)"
            @change="$store.importReview.setPoolFraction(Number($event.target.value) / 100)"
          />
          <button
            type="button"
            class="btn-outline text-xs"
            x-show="$store.importReview.estimatedPoolFraction != null"
            @click="$store.importReview.useEstimatedPoolFraction()"
            x-text="'Use the estimate (' + Math.round(($store.importReview.estimatedPoolFraction ?? 0) * 100) + '%)'"
          ></button>
          <span class="text-xs text-muted" x-show="$store.importReview.poolSource"
            x-text="'source: ' + $store.importReview.poolSource"></span>
        </div>
      </div>
    </template>
  </div>

  <ul class="import-line-list" x-show="$store.importReview.hopFindings.length">
    <template x-for="(finding, index) in $store.importReview.hopFindings" :key="'hf' + index">
      <li class="import-line map-row" :class="{ 'is-undecided': finding.blocking }">
        <span class="map-badge" x-show="finding.blocking">needs a decision</span>
        <span class="font-medium" x-text="finding.code"></span>
        <span class="text-xs text-muted" x-text="finding.message"></span>
      </li>
    </template>
  </ul>

  <template x-for="section in $store.importReview.sections" :key="section.id">
    <div class="map-section">
      <h3 class="import-section-title">
        <span x-text="section.id"></span>
        <span class="text-xs text-muted"
          x-text="'(' + section.rows.filter((r) => r.decision === 'mapped' || r.decision === 'ignored').length + ' of ' + section.rows.length + ')'"></span>
      </h3>
      <p class="form-hint" x-show="section.empty" x-text="section.note"></p>
      <p class="form-hint"
        x-show="section.id === 'yeasts' && $store.importReview.mappedYeasts.length === 0">
        Pick the strain this batch ferments with.
      </p>

      <template x-if="section.id === 'hops'">
        <div class="hop-panes">
          <template x-for="pane in [
            { id: 'boil', title: 'Boil', wide: false },
            { id: 'candidates', title: 'Candidates', wide: false },
            { id: 'whirlpool', title: 'Whirlpool', wide: false },
            { id: 'dry', title: 'Dry hops', wide: true },
          ]" :key="pane.id">
            <div class="hop-pane" :class="{ 'hop-pane-wide': pane.wide }">
              <h4 class="hop-pane-title">
                <span x-text="pane.title"></span>
                <span class="text-xs text-muted" x-text="'(' + $store.importReview.hopPanes[pane.id].length + ')'"></span>
              </h4>
              <ul class="import-line-list">
                <template x-for="row in $store.importReview.hopPanes[pane.id]" :key="pane.id + row.line_id">
                  <li class="import-line map-row" :class="{ 'is-undecided': $store.importReview.isUndecided(row) }">
                    <div class="map-row-main">
                      <span class="map-badge" x-show="$store.importReview.isUndecided(row)">needs a decision</span>
                      <span class="text-xs text-muted" x-text="row.tag"></span>
                      <span class="font-medium" x-text="row.name"></span>
                      <span class="text-xs text-muted" x-text="row.stage_verbatim || row.stage_guess"></span>
                      <span class="text-xs text-muted" x-show="row.duration_min" x-text="row.duration_min + ' min contact'"></span>
                    </div>
                    <div class="map-row-actions">
                      <button
                        type="button"
                        class="btn-outline text-xs"
                        x-show="pane.id === 'candidates'"
                        @click="$store.importReview.moveHop(row.line_id, 'batch.boil_hops')"
                      >← Boil</button>
                      <button
                        type="button"
                        class="btn-outline text-xs"
                        x-show="pane.id === 'candidates'"
                        @click="$store.importReview.moveHop(row.line_id, 'batch.whirlpool_hops')"
                      >Whirlpool →</button>
                      <button
                        type="button"
                        class="btn-outline text-xs"
                        x-show="pane.id === 'boil'"
                        @click="$store.importReview.moveHop(row.line_id, 'batch.whirlpool_hops')"
                      >→ Whirlpool</button>
                      <button
                        type="button"
                        class="btn-outline text-xs"
                        x-show="pane.id === 'whirlpool'"
                        @click="$store.importReview.moveHop(row.line_id, 'batch.boil_hops')"
                      >← Boil</button>
                      <button
                        type="button"
                        class="btn-outline text-xs"
                        x-show="pane.id !== 'candidates'"
                        @click="$store.importReview.returnHop(row.line_id)"
                        x-text="pane.id === 'dry' ? '↩ Candidates' : '↩'"
                      ></button>
                      <button
                        type="button"
                        class="btn-outline text-xs"
                        @click="$store.importReview.ignoreLine(row.line_id)"
                      >Leave out</button>
                      <span class="text-xs text-muted" x-show="!$store.importReview.rowState(row).ref">
                        a pool is not a hop: pick the one the imported recipe named
                      </span>
                    </div>
                    <div class="map-suggestions">
                      <button
                        type="button"
                        class="map-chip is-chosen"
                        x-show="$store.importReview.rowState(row).picked"
                        x-text="$store.importReview.refLabel(row)"
                        @click="$store.importReview.chooseRef(row.line_id, { id: $store.importReview.rowState(row).ref, name: $store.importReview.refLabel(row) })"
                      ></button>
                      <span
                        class="map-chip is-deleted"
                        x-show="$store.importReview.rowState(row).state === 'broken'"
                        x-text="$store.importReview.refLabel(row) + ' (deleted)'"
                      ></span>
                      <template x-for="chip in $store.importReview.chipsFor(row)" :key="chip.id">
                        <button
                          type="button"
                          class="map-chip"
                          :class="{ 'is-chosen': chip.id === $store.importReview.rowState(row).ref }"
                          :title="chip.manufacturer || chip.category || ''"
                          @click="$store.importReview.chooseRef(row.line_id, chip)"
                          x-text="chip.name"
                        ></button>
                      </template>
                      <span class="text-xs text-muted" x-show="!$store.importReview.rowState(row).ref && $store.importReview.chipsFor(row).length === 0">
                        no candidate from the imported name — search below
                      </span>
                      <details class="map-search">
                        <summary class="text-xs">Search the library</summary>
                        <input
                          class="form-input text-xs"
                          type="search"
                          placeholder="Type a name…"
                          :value="$store.importReview.queryFor(row.line_id)"
                          @input="$store.importReview.setQuery(row.line_id, $event.target.value)"
                        />
                        <template x-for="hit in $store.importReview.search(row)" :key="hit.id">
                          <button
                            type="button"
                            class="map-chip"
                            @click="$store.importReview.chooseRef(row.line_id, hit)"
                            x-text="hit.name"
                          ></button>
                        </template>
                        <span
                          class="text-xs text-muted"
                          x-show="$store.importReview.queryFor(row.line_id).trim() && $store.importReview.search(row).length === 0"
                        >Nothing matches. Build the record in the Library, then come back.</span>
                      </details>
                    </div>
                  </li>
                </template>
              </ul>
            </div>
          </template>

          <div class="hop-pane hop-pane-wide" x-show="$store.importReview.hopPanes.ignored.length">
            <h4 class="hop-pane-title">
              Not modelled
              <span class="text-xs text-muted" x-text="'(' + $store.importReview.hopPanes.ignored.length + ')'"></span>
            </h4>
            <ul class="import-line-list">
              <template x-for="row in $store.importReview.hopPanes.ignored" :key="'ignored' + row.line_id">
                <li class="import-line">
                  <span class="text-xs text-muted" x-text="row.tag"></span>
                  <span class="font-medium" x-text="row.name"></span>
                  <span class="text-xs text-muted" x-text="row.reason"></span>
                  <button
                    type="button"
                    class="btn-outline text-xs"
                    @click="$store.importReview.returnHop(row.line_id)"
                  >Add back</button>
                </li>
              </template>
            </ul>
          </div>
        </div>
      </template>

      <template x-if="section.id === 'yeasts'">
        <div>
          <p class="form-hint" x-show="$store.importReview.yeastSectionOpen">
            Imported recipe names more than one strain. A batch ferments with one: pick each
            strain's record, then choose the strain this batch takes. A blend is a Library record
            like any other yeast.
          </p>
          <div class="import-queue-actions" x-show="$store.importReview.mappedYeasts.length > 1">
            <label class="text-xs text-muted" for="import-carrier">This batch ferments with</label>
            <select
              class="form-select text-xs"
              id="import-carrier"
              @change="$store.importReview.setCarrier($event.target.value)"
            >
              <option value="" :selected="!$store.importReview.carrierLineId">— choose —</option>
              <template x-for="row in $store.importReview.mappedYeasts" :key="row.line_id">
                <option
                  :value="row.line_id"
                  :selected="row.line_id === $store.importReview.carrierLineId"
                  x-text="$store.importReview.refLabel(row) || row.name"
                ></option>
              </template>
            </select>
          </div>
        </div>
      </template>

      <ul class="import-line-list" x-show="section.id !== 'hops'">
        <template x-for="row in section.rows" :key="row.line_id">
          <li class="import-line map-row" :class="{ 'is-undecided': $store.importReview.isUndecided(row) }">
            <div class="map-row-main">
              <span class="map-badge" x-show="$store.importReview.isUndecided(row)">
                needs a decision
              </span>
              <span class="map-badge" x-show="row.section === 'yeasts' && $store.importReview.fermentingYeastId === row.line_id">
                ferments this batch
              </span>
              <span class="font-medium" x-text="row.name"></span>
              <span class="text-xs text-muted" x-text="row.text"></span>
              <span class="text-xs text-muted" x-show="row.page" x-text="'p' + row.page"></span>
            </div>
            <p class="text-xs text-muted" x-show="$store.importReview.rowIssue(row)"
              x-text="$store.importReview.rowIssue(row)"></p>
            <p class="text-xs text-muted"
              x-show="row.section === 'yeasts' && $store.importReview.rowState(row).picked
                && $store.importReview.carrierLineId
                && $store.importReview.carrierLineId !== row.line_id">
              not the batch's yeast
            </p>

            <div class="map-row-actions">
              <select
                class="form-select text-xs"
                x-show="$store.importReview.destinationsFor(row.section).length > 1"
                :value="row.destination ?? ''"
                @change="$store.importReview.changeDestination(row.line_id, $event.target.value)"
              >
                <template x-for="option in $store.importReview.destinationsFor(row.section)" :key="option.id">
                  <option :value="option.id" :selected="option.id === row.destination" x-text="option.label"></option>
                </template>
              </select>
              <span
                class="text-xs"
                x-show="$store.importReview.destinationsFor(row.section).length <= 1"
                x-text="$store.importReview.destinationLabel(row)"
              ></span>
              <span class="text-xs text-muted" x-text="row.transform"></span>
              <button
                type="button"
                class="btn-outline text-xs"
                x-show="!$store.importReview.rowState(row).leftOut"
                @click="$store.importReview.ignoreLine(row.line_id)"
              >Leave out</button>
              <span class="text-xs text-muted" x-show="$store.importReview.rowState(row).leftOut" x-text="row.reason"></span>
              <button
                type="button"
                class="btn-outline text-xs"
                x-show="$store.importReview.rowState(row).leftOut"
                @click="$store.importReview.restoreLine(row.line_id)"
              >Add back</button>
            </div>

            <div class="map-suggestions" x-show="!$store.importReview.rowState(row).leftOut">
              <button
                type="button"
                class="map-chip is-chosen"
                x-show="$store.importReview.rowState(row).picked"
                x-text="$store.importReview.refLabel(row)"
                @click="$store.importReview.chooseRef(row.line_id, { id: $store.importReview.rowState(row).ref, name: $store.importReview.refLabel(row) })"
              ></button>
              <span
                class="map-chip is-deleted"
                x-show="$store.importReview.rowState(row).state === 'broken'"
                x-text="$store.importReview.refLabel(row) + ' (deleted)'"
              ></span>
              <template x-for="chip in $store.importReview.chipsFor(row)" :key="chip.id">
                <button
                  type="button"
                  class="map-chip"
                  :class="{ 'is-chosen': chip.id === $store.importReview.rowState(row).ref, 'is-proposed': $store.importReview.rowState(row).proposed }"
                  :title="chip.maltster || chip.manufacturer || chip.category || ''"
                  @click="$store.importReview.chooseRef(row.line_id, chip)"
                  x-text="chip.name"
                ></button>
              </template>
              <span class="text-xs text-muted" x-show="!$store.importReview.rowState(row).ref && $store.importReview.chipsFor(row).length === 0">
                no candidate from the imported name — search below
              </span>
              <span class="text-xs text-muted" x-show="row.section === 'mashes'">
                a mash step picks one of the eight rests above, ranked by its temperature
              </span>
              <details class="map-search" x-show="row.section !== 'mashes'">
                <summary class="text-xs">Search the library</summary>
                <input
                  class="form-input text-xs"
                  type="search"
                  placeholder="Type a name…"
                  :value="$store.importReview.queryFor(row.line_id)"
                  @input="$store.importReview.setQuery(row.line_id, $event.target.value)"
                />
                <template x-for="hit in $store.importReview.search(row)" :key="hit.id">
                  <button
                    type="button"
                    class="map-chip"
                    @click="$store.importReview.chooseRef(row.line_id, hit)"
                    x-text="hit.name"
                  ></button>
                </template>
                <span
                  class="text-xs text-muted"
                  x-show="$store.importReview.queryFor(row.line_id).trim() && $store.importReview.search(row).length === 0"
                >Nothing matches. Build the record in the Library, then come back.</span>
              </details>
            </div>
          </li>
        </template>
      </ul>
    </div>
  </template>

  <p class="form-hint" x-show="$store.importReview.sections.length === 0">
    Nothing to map: this transcription has no lines.
  </p>
</section>
