<nav class="wall-chips" aria-label="Sections">
  <template x-for="chip in wallChips" :key="chip.id">
    <button
      type="button"
      class="wall-chip"
      :aria-current="activeChipId === chip.id ? 'true' : 'false'"
      @click="selectFieldset(chip.id)"
      x-text="chip.title"
    ></button>
  </template>
</nav>
