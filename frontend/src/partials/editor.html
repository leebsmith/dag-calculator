            <div class="editor">
              <header class="menu-bar">
                <div class="editor-title">
                  <input
                    type="text"
                    class="editor-title-input"
                    :value="$store.recipes.activeName"
                    :readonly="$store.recipes.readOnly"
                    placeholder="Untitled batch"
                    @change="$store.recipes.rename($event.target.value)"
                  />
                </div>
                <div class="menu-actions">
                  <button type="button" class="btn-outline" @click="$store.recipes.backToBatches()">
                    Batches
                  </button>
                  <button
                    type="button"
                    class="btn-outline"
                    x-show="!$store.recipes.readOnly"
                    @click="$store.recipes.freeze()"
                  >Freeze</button>
                  <button type="button" class="btn-outline" @click="$store.recipes.downloadActiveBundle()">
                    Download bundle
                  </button>
                  <button type="button" class="btn-outline" @click="$store.recipes.openReportPicker()">
                    Build report…
                  </button>
                  <button
                    type="button"
                    class="btn-outline"
                    x-show="!$store.recipes.readOnly"
                    @click="$store.recipes.trash()"
                  >Move to trash</button>
                  <load src="src/partials/ui-theme-control.html" />
                  <div class="menu-unit">
                    <button
                      type="button"
                      class="btn-outline"
                      @click="toggleUnits()"
                      :aria-expanded="unitsOpen ? 'true' : 'false'"
                      aria-controls="unit-popover"
                    >Units</button>
                    <div class="unit-popover" id="unit-popover" x-show="unitsOpen" @click.outside="closeUnits()">
                      <div class="unit-cols">
                        <template x-for="g in unitGroups" :key="g.label">
                          <div class="unit-col">
                            <span class="unit-col-title" x-text="g.label"></span>
                            <template x-for="d in g.dims" :key="d.id">
                              <div class="unit-row">
                                <label class="form-label" :for="'unit-' + d.id" x-text="d.label"></label>
                                <select
                                  class="form-select"
                                  :id="'unit-' + d.id"
                                  :value="unitMode[d.id] || d.default || d.units[0][0]"
                                  @change="setUnit(d.id, $event.target.value)"
                                >
                                  <template x-for="u in d.units" :key="u[0]">
                                    <option :value="u[0]" :selected="u[0] === (unitMode[d.id] || d.default || d.units[0][0])" x-text="u[1]"></option>
                                  </template>
                                </select>
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                      <div class="unit-reset">
                        <button type="button" class="btn-link text-xs" @click="resetUnits()">
                          Reset unit defaults
                        </button>
                      </div>
                    </div>
                  </div>
                  <span class="auth-user">
                    <span x-text="$store.auth.user.email || ''"></span>
                    <button type="button" class="btn-link" @click="$store.auth.signOut()">Sign out</button>
                  </span>
                </div>
              </header>

              <load src="src/partials/stepper.html" />

              <template x-if="$store.imports.originOf($store.recipes.activeId)">
                <details class="import-origin" x-data="scopeAlias" data-origin="$store.imports.originOf" data-origin-arg="$store.recipes.activeId">
                  <summary class="text-xs">
                    <span class="font-medium">Imported from</span>
                    <span x-text="origin.title"></span>
                    <span class="text-muted" x-text="origin.outcome"></span>
                  </summary>
                  <div x-data="scopeAlias" data-delta="origin.delta">
                    <p class="form-hint" x-show="!delta">
                      No comparison was captured for this batch.
                    </p>
                    <template x-if="delta">
                      <load src="src/partials/import-delta.html" />
                    </template>
                  </div>
                </details>
              </template>

              <div class="stage">
                <div class="alert alert-info" x-show="$store.recipes.readOnly">
                  <div class="alert-header">
                    <span class="alert-dot"></span>
                    <span>Read-only view</span>
                  </div>
                  <p>Changes are disabled. Open the batch normally to edit it.</p>
                </div>

                <div class="alert alert-info" x-show="boundaryBlockedMessage">
                  <div class="alert-header">
                    <span class="alert-dot"></span>
                    <span x-text="boundaryBlockedMessage"></span>
                  </div>
                </div>

                <template x-if="boundaryError">
                  <div class="alert alert-warning">
                    <div class="alert-header">
                      <span class="alert-dot"></span>
                      <span x-text="boundaryError.label"></span>
                    </div>
                    <p x-text="boundaryError.message"></p>
                  </div>
                </template>

                <load src="src/partials/action-error.html" />

                <!-- Wall: one scroll region over every current fieldset, panel pinned. -->
                <div class="wall-workspace">
                  <div class="wall-scroll" @scroll="wallScrolled($event)">
                    <fieldset class="readonly-field wall-fieldsets" :disabled="$store.recipes.readOnly">
                      <template x-for="fieldset in fieldsets" :key="fieldset.id">
                        <section
                          class="wall-fieldset"
                          :class="(landingFieldset === fieldset.id ? 'is-landing ' : '') + 'wall-fieldset--' + fieldset.width"
                          :data-fieldset="fieldset.id"
                        >
                          <template x-if="fieldset.id === 'targets'">
                            <load src="src/partials/wall-targets.html" />
                          </template>
                          <template x-if="fieldset.id === 'yeast'">
                            <load src="src/partials/wall-yeast.html" />
                          </template>
                          <template x-if="fieldset.id === 'grist'">
                            <load src="src/partials/wall-grist.html" />
                          </template>
                          <template x-if="fieldset.id === 'hops'">
                            <load src="src/partials/wall-hops.html" />
                          </template>
                          <template x-if="fieldset.id === 'mash'">
                            <load src="src/partials/wall-mash.html" />
                          </template>
                          <template x-if="fieldset.id === 'water'">
                            <load src="src/partials/wall-water.html" />
                          </template>
                          <template x-if="fieldset.id === 'boil'">
                            <load src="src/partials/wall-boil.html" />
                          </template>
                        </section>
                      </template>
                    </fieldset>
                  </div>

                  <aside class="wall-panel" aria-label="Determinations">
                    <p class="wall-panel-placeholder">
                      The determination panel arrives with its groups; this shell only holds the place.
                    </p>
                  </aside>
                </div>
              </div>

              <footer class="app-footer">
                <span class="save-state text-xs" x-show="$store.recipes.saveState !== 'idle'">
                  <span x-show="$store.recipes.saveState === 'dirty'">Unsaved</span>
                  <span x-show="$store.recipes.saveState === 'saving'">Saving…</span>
                  <button
                    type="button"
                    class="btn-link text-xs"
                    x-show="$store.recipes.saveState === 'error'"
                    @click="$store.recipes.retrySave()"
                  >Save failed — retry</button>
                  <span x-show="$store.recipes.saveState === 'conflict'">
                    Changed in another tab —
                    <button type="button" class="btn-link text-xs" @click="$store.recipes.keepMine()">Keep mine</button>
                    <button type="button" class="btn-link text-xs" @click="$store.recipes.reloadFromRemote()">Reload</button>
                  </span>
                </span>
                <span class="boundary-status" x-show="boundaryPending">
                  <span class="status-dot status-dot-warning"></span>
                  <span class="text-xs text-muted">Solving…</span>
                </span>
                <span class="footer-violations" x-show="violationCount > 0">
                  <span class="status-dot status-dot-error"></span>
                  <span x-text="violationCount + ' violation(s)'"></span>
                </span>
                <span class="footer-violations" x-show="styleConformance && styleConformance.hasBaseline">
                  <span
                    class="status-dot"
                    :class="styleSai >= 90 ? 'status-dot-success' : 'status-dot-warning'"
                  ></span>
                  <span x-text="'SAI ' + styleSai"></span>
                </span>
                <div class="footer-findings" x-data="scopeAlias" data-findings="findings">
                  <load src="src/partials/findings.html" />
                </div>
              </footer>
            </div>
