<!-- Configure Mash Rests modal: draft/cancel editor over the enabled rests. -->
<div
  class="modal-backdrop"
  x-show="mashModalOpen"
  @click.self="closeMashModal()"
  @keydown.escape.window="closeMashModal()"
>
  <div
    class="modal-dialog modal-dialog-workspace"
    role="dialog"
    aria-modal="true"
    aria-labelledby="mash-rests-title"
    tabindex="-1"
    x-effect="dialogFocus($el, mashModalOpen)"
  >
    <div class="modal-workspace-header">
      <div class="modal-workspace-header-title">
        <h2 class="modal-workspace-title" id="mash-rests-title">Configure Mash Rests</h2>
      </div>
      <div class="modal-workspace-header-actions">
        <button type="button" class="btn-outline text-xs" @click="closeMashModal()">Cancel</button>
        <button
          type="button"
          class="btn-primary text-xs"
          @click="commitMashSchedule()"
          :disabled="!isMashDraftValid"
        >
          OK
        </button>
      </div>
    </div>

    <div class="modal-workspace-body">
      <div class="modal-workspace-main">
        <div class="data-table-container">
          <table class="data-table is-fixed">
            <thead>
              <tr>
                <th>Rest</th>
                <th>Low</th>
                <th>Use</th>
                <th>High</th>
                <th>Duration</th>
                <th>Purpose</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="rest in sortedMashDraftRests" :key="rest.rest_id">
                <tr>
                  <td x-text="restName(rest.rest_id)"></td>
                  <td class="text-xs text-muted tabular-nums">
                    <span x-text="fmt.displayOrDash(restBoundDisplay(rest.rest_id, 'min'))"></span>
                  </td>
                  <td>
                    <input
                      type="number"
                      step="0.1"
                      class="form-input tabular-nums"
                      :value="restUseTempDisplay(rest)"
                      @change="setMashDraftTemp(rest.rest_id, $event.target.value)"
                    />
                    <template x-if="isRestOutOfRange(rest.rest_id, rest.use_temp_c)">
                      <span class="form-hint text-danger">
                        Outside recommended range
                        (<span x-text="restBoundDisplay(rest.rest_id, 'min')"></span>–<span x-text="restBoundDisplay(rest.rest_id, 'max')"></span>
                        <span x-text="temperatureUnit"></span>)
                      </span>
                    </template>
                  </td>
                  <td class="text-xs text-muted tabular-nums">
                    <span x-text="fmt.displayOrDash(restBoundDisplay(rest.rest_id, 'max'))"></span>
                  </td>
                  <td>
                    <input
                      type="number"
                      step="1"
                      min="0"
                      class="form-input tabular-nums"
                      :value="rest.duration_min"
                      @change="setMashDraftDuration(rest.rest_id, $event.target.value)"
                    />
                  </td>
                  <td class="text-xs text-muted" x-text="restPurpose(rest.rest_id)"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
