<!-- Configure Mash Rests modal: draft/cancel editor over the enabled rests. -->
<div
  x-data="modalShell({
    id: 'mash-rests',
    title: 'Configure Mash Rests',
    cancel: () => closeMashModal(),
    save: () => commitMashSchedule(),
    saveLabel: 'OK',
    saveDisabled: () => !isMashDraftValid,
    escape: () => closeMashModal()
  })"
  x-effect="syncOpen(mashModalOpen)"
>
  <load src="src/partials/ui-modal-shell.html" />

  <template x-teleport="#mash-rests-body">
    <div class="modal-workspace-main">
        <p class="form-hint text-danger" x-show="!isMashDraftValid">
          Every enabled rest needs a use temperature and a duration.
        </p>
        <div class="data-table-container data-table-container--fit">
          <table class="data-table data-table--editor data-table--fixed">
            <colgroup>
              <col />
              <col />
              <col />
              <col />
              <col />
              <col />
            </colgroup>
            <thead>
              <tr>
                <th>Rest</th>
                <th>Low</th>
                <th>Use</th>
                <th>High</th>
                <th>Duration</th>
                <th>Purpose</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="rest in sortedMashDraftRests" :key="rest.rest_id">
                <tr>
                  <td x-text="restName(rest.rest_id)"></td>
                  <td class="text-xs text-muted tabular-nums">
                    <span x-text="fmt.displayOrDash(restBoundDisplay(rest.rest_id, 'min'))"></span>
                  </td>
                  <td>
                    <input
                      type="number"
                      step="0.1"
                      class="form-input tabular-nums"
                      :value="restUseTempDisplay(rest)"
                      @change="setMashDraftTemp(rest.rest_id, $event.target.value)"
                    />
                    <template x-if="isRestOutOfRange(rest.rest_id, rest.use_temp_c)">
                      <span class="form-hint text-danger">
                        Outside recommended range
                        (<span x-text="restBoundDisplay(rest.rest_id, 'min')"></span>–<span x-text="restBoundDisplay(rest.rest_id, 'max')"></span>
                        <span x-text="temperatureUnit"></span>)
                      </span>
                    </template>
                  </td>
                  <td class="text-xs text-muted tabular-nums">
                    <span x-text="fmt.displayOrDash(restBoundDisplay(rest.rest_id, 'max'))"></span>
                  </td>
                  <td>
                    <input
                      type="number"
                      step="1"
                      min="0"
                      class="form-input tabular-nums"
                      :value="rest.duration_min"
                      @change="setMashDraftDuration(rest.rest_id, $event.target.value)"
                    />
                  </td>
                  <td class="text-xs text-muted" x-text="restPurpose(rest.rest_id)"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
  </template>
</div>
