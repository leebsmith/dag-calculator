<section class="step-card">
  <div class="step-card-header">
    <h2 class="card-title" x-text="activeStep.title"></h2>
    <p class="card-subtitle" x-show="activeStep.subtitle" x-text="activeStep.subtitle"></p>
  </div>

  <div class="step-card-content">
    <!-- Filters -->
    <div class="step-grid-2col">
      <div class="form-group">
        <label class="form-label">Search by name</label>
        <input
          type="text"
          class="form-input"
          placeholder="e.g. American Ale"
          x-model="yeastSearchQuery"
        />
        <span class="form-hint">Case-insensitive substring match on strain name</span>
      </div>
      <div class="form-group">
        <label class="form-label">Manufacturer</label>
        <select class="form-select" x-model="yeastManufacturerFilter">
          <option value="">All manufacturers</option>
          <template x-for="mfr in yeastManufacturers" :key="mfr">
            <option :value="mfr" x-text="mfr"></option>
          </template>
        </select>
        <span class="form-hint">Filter by yeast lab</span>
      </div>
    </div>

    <!-- Apparent attenuation tiers -->
    <div class="filter-pills-container">
      <template x-for="t in yeastAttenuationTiers" :key="'a-' + t.key">
        <button
          type="button"
          class="filter-pill"
          :class="{ 'is-active': yeastAttenuationFilter === t.key }"
          @click="toggleYeastAttenuation(t.key)"
          x-text="t.label"
        ></button>
      </template>
    </div>

    <!-- Result counter -->
    <div
      class="catalog-result-counter"
      aria-live="polite"
      x-text="yeastResultLabel"
    ></div>

    <!-- Results -->
    <div class="data-table-container data-table-container-scroll">
      <table class="data-table is-fixed">
        <colgroup>
          <col style="width: 26%;" />
          <col style="width: 16%;" />
          <col style="width: 14%;" />
          <col style="width: 16%;" />
          <col style="width: 14%;" />
          <col style="width: 14%;" />
        </colgroup>
        <thead>
          <tr>
            <th>Strain</th>
            <th>Manufacturer</th>
            <th class="text-right">Attenuation</th>
            <th>Flocculation</th>
            <th class="text-right">Alcohol tolerance</th>
            <th class="text-right">Action</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="y in visibleYeasts" :key="y.id">
            <tr :class="{ 'is-selected': selectedYeastId === y.id }">
              <td>
                <span class="font-medium" x-text="y.name"></span>
                <template x-if="isUserItem(y.id)">
                  <span class="status-badge status-badge-info text-nano">mine</span>
                </template>
              </td>
              <td x-text="y.manufacturer"></td>
              <td class="text-right tabular-nums" x-text="yeastAttenuation(y)"></td>
              <td x-text="y.flocculation"></td>
              <td class="text-right tabular-nums" x-text="y.alcohol_tolerance"></td>
              <td class="table-action-cell">
                <button type="button" class="btn btn-secondary text-xs" @click="selectYeast(y.id)">
                  Use
                </button>
                <button
                  type="button"
                  class="btn btn-outline text-xs"
                  x-show="!isUserItem(y.id)"
                  @click="duplicateUserItem('yeast', y)"
                  title="Copy to my items"
                >
                  Copy
                </button>
              </td>
            </tr>
          </template>
          <template x-if="filteredYeasts.length === 0">
            <tr>
              <td colspan="6" class="table-empty-cell">No yeast strains match the current filters.</td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>

    <!-- Selected strain -->
    <template x-if="selectedYeast">
      <div class="synthesized-card">
        <div class="synthesized-header">
          <span class="synthesized-title" x-text="selectedYeast.name"></span>
          <button type="button" class="btn btn-secondary text-xs" @click="clearYeastSelection()">
            Clear
          </button>
        </div>
        <div class="step-grid-2col">
          <div class="form-group">
            <span class="form-label">Typical attenuation</span>
            <span class="tabular-nums" x-text="yeastAttenuation(selectedYeast)"></span>
          </div>
          <div class="form-group">
            <span class="form-label">Strain details</span>
            <div class="text-xs text-muted">
              <div><strong>Manufacturer:</strong> <span x-text="selectedYeast.manufacturer"></span></div>
              <div><strong>Flocculation:</strong> <span x-text="selectedYeast.flocculation"></span></div>
              <div><strong>Alcohol tolerance:</strong> <span x-text="selectedYeast.alcohol_tolerance"></span></div>
              <div x-show="selectedYeast.form"><strong>Form:</strong> <span x-text="selectedYeast.form"></span></div>
              <div x-show="selectedYeastTemp"><strong>Temperature:</strong> <span x-text="selectedYeastTemp"></span></div>
              <div x-show="selectedYeast.recipes !== undefined"><strong>Recipes:</strong> <span x-text="selectedYeast.recipes"></span></div>
              <div x-show="selectedYeast.url"><strong>Source:</strong> <a :href="fmt.safeHref(selectedYeast.url)" target="_blank" rel="noopener" x-text="selectedYeast.url"></a></div>
              <div class="card-subtitle" x-text="selectedYeast.notes"></div>
            </div>
          </div>
        </div>
      </div>
    </template>

    <p class="form-hint">Batch-specific attenuation is set on the Batch Sparge step.</p>
  </div>
</section>
