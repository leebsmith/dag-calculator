<section class="step-card">
  <h2 class="card-title" x-text="step.title"></h2>

  <template x-for="f in fieldsBySlice[step.slice]" :key="f.id">
    <div class="form-group">
      <template x-if="f.control === 'number'">
        <div>
          <label
            class="form-label"
            :for="f.id"
            x-text="f.label + (f.unit ? ' (' + f.unit + ')' : '')"
          ></label>
          <input
            class="form-input"
            :id="f.id"
            type="number"
            step="0.1"
            :value="f.value"
            @input="edit(f, $event.target.value)"
          />
          <template x-if="f.overridden">
            <button type="button" class="btn-link" @click="clearOverlay(f)">reset to profile</button>
          </template>
        </div>
      </template>

      <template x-if="f.control === 'choice-select' || f.control === 'selection-picker'">
        <div>
          <label class="form-label" :for="f.id" x-text="f.label"></label>
          <select
            class="form-select"
            :id="f.id"
            :value="f.value"
            @change="edit(f, $event.target.value)"
          >
            <template x-for="opt in (f.options || [])" :key="opt">
              <option :value="opt" x-text="opt"></option>
            </template>
          </select>
        </div>
      </template>

      <template x-if="f.control === 'readout'">
        <div>
          <span class="form-label" x-text="f.label + (f.unit ? ' (' + f.unit + ')' : '')"></span>
          <span class="tabular-nums" x-text="f.display"></span>
        </div>
      </template>

      <template x-if="f.control === 'collection-table'">
        <div>
          <span class="form-label" x-text="f.label"></span>
          <div class="data-table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <template x-for="c in f.columns" :key="c.id">
                    <th x-text="c.label"></th>
                  </template>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="(row, ri) in f.rows" :key="ri">
                  <tr>
                    <template x-for="c in f.columns" :key="c.id">
                      <td>
                        <input
                          class="form-input"
                          :value="row[c.id]"
                          @input="editCell(f, ri, c.id, $event.target.value)"
                        />
                      </td>
                    </template>
                    <td>
                      <button type="button" class="btn-link" @click="removeRow(f, ri)">×</button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <button type="button" class="btn-outline" @click="addRow(f)">Add row</button>
        </div>
      </template>
    </div>
  </template>

  <template x-for="a in (step.actions || [])" :key="a.id">
    <button
      type="button"
      class="btn-outline"
      x-show="fieldsBySlice[step.slice].some((f) => f.id === a.gate)"
      @click="runAction(a)"
      x-text="a.label"
    ></button>
  </template>
</section>
