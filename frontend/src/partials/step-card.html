<section class="step-card">
  <div class="step-card-header">
    <h2 class="card-title" x-text="activeStep.title"></h2>
    <p class="card-subtitle" x-show="activeStep.subtitle" x-text="activeStep.subtitle"></p>
  </div>

  <template x-for="f in fieldsBySlice[activeStep.slice]" :key="f.id">
    <div class="form-group">
      <template x-if="f.control === 'number'">
        <div>
          <label class="form-label" :for="f.id">
            <span x-text="fmt.formatFieldLabel(f.label, f.toggleable ? null : f.unit)"></span>
            <button
              type="button"
              class="unit-badge"
              x-show="f.toggleable"
              :class="{ 'unit-badge-customized': f.customized }"
              title="Click to change unit"
              @click="toggleFieldUnit(f)"
              x-text="f.unit"
            ></button>
            <span
              class="seed-badge"
              x-show="f.seeded"
              :title="'Auto-filled from ' + f.seededSource + ' (seed); edit to override'"
            >seed</span>
            <button
              type="button"
              class="seed-reset"
              x-show="!f.seeded && f.seededValue !== undefined"
              :title="'Reset to ' + f.seededSource"
              @click="resetField(f)"
            >↺</button>
          </label>
          <input
            class="form-input"
            :class="{ 'is-seeded': f.seeded }"
            :id="f.id"
            type="number"
            step="0.1"
            :value="f.display"
            @input="edit(f, $event.target.value)"
            @change="commitField(f)"
          />
          <span class="form-hint" x-show="f.rangeHint" x-text="'Allowed: ' + f.rangeHint"></span>
          <span class="form-hint" x-show="f.hint" x-text="f.hint"></span>
          <span class="form-hint text-danger" x-show="f.validation && !f.validation.holds">Outside the allowed range</span>
          <span class="form-hint text-warning" x-show="f.conformanceHint" x-text="f.conformanceHint"></span>
        </div>
      </template>

      <template x-if="f.control === 'choice-select' || f.control === 'selection-picker'">
        <div>
          <label class="form-label" :for="f.id">
            <span x-text="f.label"></span>
            <span
              class="seed-badge"
              x-show="f.seeded"
              :title="'Auto-filled from ' + f.seededSource + ' (seed); edit to override'"
            >seed</span>
            <button
              type="button"
              class="seed-reset"
              x-show="!f.seeded && f.seededValue !== undefined"
              :title="'Reset to ' + f.seededSource"
              @click="resetField(f)"
            >↺</button>
          </label>
          <select
            class="form-select"
            :class="{ 'is-seeded': f.seeded }"
            :id="f.id"
            :value="f.value"
            @change="edit(f, $event.target.value)"
          >
            <template x-for="opt in (f.options || [])" :key="opt">
              <option :value="opt" :selected="opt === f.value" x-text="fmt.optionLabel(f.optionLabels, opt)"></option>
            </template>
          </select>
          <span class="form-hint" x-show="f.hint" x-text="f.hint"></span>
          <button type="button" class="btn-link text-xs" @click="openLibrary()">
            Manage library
          </button>
        </div>
      </template>

      <template x-if="f.control === 'readout'">
        <div>
          <span class="form-label">
            <span x-text="fmt.formatFieldLabel(f.label, f.toggleable ? null : f.unit)"></span>
            <button
              type="button"
              class="unit-badge"
              x-show="f.toggleable"
              :class="{ 'unit-badge-customized': f.customized }"
              title="Click to change unit"
              @click="toggleFieldUnit(f)"
              x-text="f.unit"
            ></button>
          </span>
          <span class="field-value" x-text="f.display"></span>
          <span class="form-hint" x-show="f.hint" x-text="f.hint"></span>
          <span class="form-hint text-danger" x-show="f.validation && !f.validation.holds">Outside the allowed range</span>
          <span class="form-hint text-warning" x-show="f.conformanceHint" x-text="f.conformanceHint"></span>
        </div>
      </template>

      <template x-if="f.control === 'readout-table'">
        <div>
          <h3 class="modal-drawer-title" x-text="f.title"></h3>
          <div class="data-table-container">
            <table class="data-table">
              <thead x-show="f.header">
                <tr>
                  <template x-for="c in f.columns" :key="c.id">
                    <th :class="{ 'text-right': c.align === 'right' }" x-text="c.label"></th>
                  </template>
                </tr>
              </thead>
              <tbody>
                <template x-for="(row, ri) in f.rows" :key="ri">
                  <tr>
                    <template x-for="c in f.columns" :key="c.id">
                      <td :class="{ 'text-right tabular-nums': c.align === 'right', 'font-bold': row.bold }">
                        <template x-if="row.cells[c.id] && row.cells[c.id].text !== undefined">
                          <span x-text="row.cells[c.id].text"></span>
                        </template>
                        <template x-if="row.cells[c.id] && row.cells[c.id].display !== undefined">
                          <span x-text="row.cells[c.id].display"></span>
                          <span x-text="row.cells[c.id].unit ? ' ' + row.cells[c.id].unit : ''"></span>
                        </template>
                        <template x-if="!row.cells[c.id]">
                          <span>—</span>
                        </template>
                        <template x-if="c.id === f.columns[f.columns.length - 1].id">
                          <div class="text-xs text-muted" x-show="row.hint" x-text="'(' + row.hint + ')'"></div>
                          <div class="text-xs text-muted" x-show="row.note && row.note.show" x-text="'(' + row.note.label + ': ' + fmt.formatQuantity(row.note, { dash: '' }) + ')'"></div>
                        </template>
                      </td>
                    </template>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </template>

      <template x-if="f.control === 'collection-table'">
        <div>
          <span class="form-label" x-text="f.label"></span>
          <div class="data-table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <template x-for="c in f.columns" :key="c.id">
                    <th x-text="fmt.formatColumnHeader(c)"></th>
                  </template>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="(row, ri) in f.rows" :key="ri">
                  <tr>
                    <template x-for="c in f.columns" :key="c.id">
                      <td>
                        <template x-if="c.editable">
                          <input
                            class="form-input"
                            :class="{ 'is-invalid': f.rowValidations[ri] && f.rowValidations[ri][c.id] && !f.rowValidations[ri][c.id].holds }"
                            :value="row[c.id]"
                            @input="editCell(f, ri, c.id, $event.target.value)"
                          />
                        </template>
                        <template x-if="!c.editable">
                          <span
                            class="collection-readout tabular-nums"
                            :class="{ 'is-invalid': f.rowValidations[ri] && f.rowValidations[ri][c.id] && !f.rowValidations[ri][c.id].holds }"
                            x-text="row[c.id]"
                          ></span>
                        </template>
                      </td>
                    </template>
                    <td>
                      <button type="button" class="btn-link" @click="removeRow(f, ri)">×</button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <span
            class="form-hint text-danger"
            x-show="f.rowValidations && f.rowValidations.some((r) => Object.values(r).some((v) => !v.holds))"
          >Some cells are outside their allowed range</span>
          <button type="button" class="btn-outline" @click="runCollectionAdd(f)" x-text="f.addLabel"></button>
        </div>
      </template>
    </div>
  </template>

  <template x-if="activeStep.slice === 'water'">
    <div class="water-summary">
      <p class="water-basis" x-text="waterSummary.basis"></p>
      <p class="water-destinations">Mash → dry grist, before underletting · Sparge → HLT after top-up</p>
      <table class="water-treated">
        <thead>
          <tr>
            <th>Ion</th>
            <th>Mash</th>
            <th>HLT</th>
            <th>Kettle</th>
            <th>Target</th>
            <th>Δ kettle</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="r in waterSummary.ions" :key="r.ion">
            <tr>
              <td x-text="r.label"></td>
              <td x-text="r.mashText"></td>
              <td x-text="r.hltText"></td>
              <td x-text="r.kettleText"></td>
              <td x-text="r.targetText"></td>
              <td x-text="r.kettleDeltaText"></td>
            </tr>
          </template>
        </tbody>
      </table>
      <p class="text-warning" x-show="waterSummary.tanninWarning">Sparge tannin risk — the sparge acid is still required.</p>
      <template x-for="n in waterSummary.notes" :key="n">
        <p class="text-warning" x-text="n"></p>
      </template>
      <p class="water-not-modelled" x-text="waterSummary.notModelled"></p>
    </div>
  </template>

  <template x-for="a in (activeStep.actions || [])" :key="a.id">
    <button
      type="button"
      class="btn-outline"
      x-show="fieldsBySlice[activeStep.slice].some((f) => f.id === a.gate)"
      @click="runAction(a)"
      x-text="a.label"
    ></button>
  </template>
</section>
