<!-- Late Additions editor (sugar draft + catalog picker) -->
<div
  class="modal-backdrop"
  x-show="sugarEditorOpen"
  @click.self="cancelSugarEditor()"
  @keydown.escape.window="handleSugarEscape()"
>
  <div class="modal-dialog modal-dialog-workspace">
    <div class="modal-workspace-header">
      <div class="modal-workspace-header-title">
        <h2 class="modal-workspace-title">Late Additions Editor</h2>
        <span class="status-badge badge-info text-xs" x-text="sugarTotalMass.toFixed(2) + ' kg'"></span>
      </div>
      <div class="modal-workspace-header-actions">
        <button type="button" class="btn-outline text-xs" @click="cancelSugarEditor()">Cancel</button>
        <button type="button" class="btn-primary text-xs" @click="saveSugarEditor()">Save &amp; Apply</button>
      </div>
    </div>

    <div class="modal-workspace-body">
      <div class="modal-workspace-main">
        <div class="table-header-toolbar">
          <span class="table-header-meta">
            Dose sugars by mass (kg). Yield and color come from the catalog.
          </span>
          <button type="button" class="btn-primary text-xs" @click="openSugarSearch()">
            ＋ Add Sugar from Catalog
          </button>
        </div>

        <div class="data-table-container">
          <table class="data-table is-fixed">
            <colgroup>
              <col style="width: 34%" />
              <col style="width: 16%" />
              <col style="width: 14%" />
              <col style="width: 12%" />
              <col style="width: 16%" />
              <col style="width: 8%" />
            </colgroup>
            <thead>
              <tr>
                <th>Sugar</th>
                <th class="text-right">Mass (kg)</th>
                <th class="text-right">Yield</th>
                <th class="text-right">°L</th>
                <th class="text-right">Extract (kg)</th>
                <th class="text-right">Actions</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="row in sugarDraft" :key="row._key">
                <tr>
                  <td><span class="font-medium" x-text="row.name"></span></td>
                  <td class="text-right">
                    <input
                      type="number"
                      step="0.01"
                      min="0"
                      class="form-input table-input-parts"
                      :value="row.mass_kg"
                      @input="updateDraftMass(row._key, $event.target.value)"
                    />
                  </td>
                  <td class="text-right tabular-nums" x-text="(row.yield_fraction * 100).toFixed(1) + '%'"></td>
                  <td class="text-right tabular-nums" x-text="Number(row.color_lovibond).toFixed(1)"></td>
                  <td class="text-right tabular-nums" x-text="(row.mass_kg * row.yield_fraction).toFixed(3)"></td>
                  <td class="text-right">
                    <div class="table-action-cell">
                      <button
                        type="button"
                        class="btn-action-icon btn-action-danger"
                        @click="removeDraftSugar(row._key)"
                        title="Remove"
                      >
                        🗑
                      </button>
                    </div>
                  </td>
                </tr>
              </template>
              <template x-if="sugarDraft.length === 0">
                <tr>
                  <td colspan="6" class="table-empty-cell">
                    No sugars in the draft. Click “＋ Add Sugar from Catalog”.
                  </td>
                </tr>
              </template>
            </tbody>
            <tfoot>
              <tr>
                <td colspan="4" class="font-bold">Totals</td>
                <td class="text-right tabular-nums font-bold" x-text="sugarTotalExtract.toFixed(3)"></td>
                <td></td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>

      <div class="modal-drawer-scrim" x-show="sugarDrawer !== null" @click="closeSugarDrawer()"></div>

      <div class="modal-workspace-drawer" x-show="sugarDrawer !== null">
        <div class="modal-drawer-header">
          <h3 class="modal-drawer-title">Sugar Catalog</h3>
          <button type="button" class="btn-close text-xs" @click="closeSugarDrawer()">✕</button>
        </div>

        <div class="modal-drawer-body modal-drawer-body-pinned">
          <div class="catalog-drawer-content">
            <div class="catalog-drawer-controls">
              <div class="catalog-search-wrapper">
                <input
                  type="text"
                  class="form-input text-xs"
                  placeholder="Search sugars by name or notes…"
                  x-model.debounce.50ms="sugarSearch"
                />
              </div>
              <div
                class="catalog-result-counter text-xs"
                aria-live="polite"
                x-text="sugarCatalogTruncated
                  ? `Showing ${sugarVisibleCatalog.length} of ${sugarFilteredCatalog.length} sugars — refine search`
                  : `Showing ${sugarFilteredCatalog.length} sugars`"
              ></div>
            </div>
            <div class="catalog-drawer-list">
              <template x-for="item in sugarVisibleCatalog" :key="item.id">
                <div class="catalog-item-card">
                  <div>
                    <div class="catalog-item-name" x-text="item.name"></div>
                    <div
                      class="catalog-item-meta"
                      x-text="'Yield ' + Math.round(item.yield_fraction * 100) + '% • ' + item.color_lovibond + ' °L'"
                    ></div>
                  </div>
                  <button type="button" class="btn-primary text-xs" @click="addCatalogSugar(item.id)">＋ Add</button>
                </div>
              </template>
              <template x-if="sugarFilteredCatalog.length === 0">
                <div class="table-empty-cell">No matching sugars found.</div>
              </template>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
