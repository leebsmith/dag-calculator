<!-- Late Additions editor (draft grid + catalog picker) -->
<div
  class="modal-backdrop"
  x-show="sugarEditorOpen"
  @click.self="cancelSugarEditor()"
  @keydown.escape.window="handleSugarEscape()"
>
  <div
    class="modal-dialog modal-dialog-workspace"
    role="dialog"
    aria-modal="true"
    aria-labelledby="sugar-editor-title"
    tabindex="-1"
    x-effect="dialogFocus($el, sugarEditorOpen)"
  >
    <div class="modal-workspace-header">
      <div class="modal-workspace-header-title">
        <h2 class="modal-workspace-title" id="sugar-editor-title">Late Additions Editor</h2>
        <span class="status-badge badge-info text-xs" x-text="sugarDraftMassDisplay"></span>
      </div>
      <div class="modal-workspace-header-actions">
        <button type="button" class="btn-outline text-xs" @click="cancelSugarEditor()">Cancel</button>
        <button type="button" class="btn-primary text-xs" @click="saveSugarEditor()">Save &amp; Apply</button>
      </div>
    </div>

    <div class="modal-workspace-body">
      <div class="modal-workspace-main">
        <div class="table-header-toolbar">
          <span class="text-xs text-muted">
            Dose sugars by mass. Yield and color come from the catalog.
          </span>
          <button type="button" class="btn-primary text-xs" @click="openSugarSearch()" :aria-expanded="(sugarDrawer !== null) ? 'true' : 'false'" aria-controls="sugar-drawer">
            ＋ Add Sugar from Catalog
          </button>
        </div>

        <div class="data-table-container">
          <table class="data-table is-fixed">
            <thead>
              <tr>
                <template x-for="c in draftColumns" :key="c.id">
                  <th :class="c.id === 'name' ? '' : 'text-right'" x-text="fmt.formatColumnHeader(c)"></th>
                </template>
                <th class="text-right">Actions</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="(row, ri) in draftDisplayRows" :key="ri">
                <tr>
                  <template x-for="c in draftColumns" :key="c.id">
                    <td :class="c.id === 'name' ? '' : 'text-right'">
                      <template x-if="c.editable">
                        <input
                          type="number"
                          step="0.01"
                          min="0"
                          class="form-input table-input-parts"
                          :value="inputDraft(inputKey('draft', draftNodeId, ri, c.id), row[c.id])"
                          @input="editDraftCellInput(inputKey('draft', draftNodeId, ri, c.id), ri, c.id, $event.target.value)"
                          @change="commitDraftCellInput(inputKey('draft', draftNodeId, ri, c.id))"
                        />
                      </template>
                      <template x-if="!c.editable">
                        <span class="collection-readout tabular-nums" x-text="row[c.id]"></span>
                      </template>
                    </td>
                  </template>
                  <td class="text-right">
                    <div class="table-action-cell">
                      <button
                        type="button"
                        class="btn-action-icon btn-action-danger"
                        @click="removeDraftRow(ri)"
                        title="Remove"
                      >
                        🗑
                      </button>
                    </div>
                  </td>
                </tr>
              </template>
              <template x-if="draftRows.length === 0">
                <tr>
                  <td :colspan="draftColumns.length + 1" class="table-empty-cell">
                    No sugars in the draft. Click “＋ Add Sugar from Catalog”.
                  </td>
                </tr>
              </template>
            </tbody>
            <tfoot>
              <tr>
                <td :colspan="draftColumns.length + 1" class="tabular-nums">
                  <span class="font-bold">Total extract:</span>
                  <span x-text="' ' + sugarDraftExtractDisplay"></span>
                </td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>

      <div class="modal-drawer-scrim" x-show="sugarDrawer !== null" @click="closeSugarDrawer()"></div>

      <div class="modal-workspace-drawer" id="sugar-drawer" x-show="sugarDrawer !== null">
        <div class="modal-drawer-header">
          <h3 class="modal-drawer-title">Sugar Catalog</h3>
          <button type="button" class="btn-close text-xs" @click="closeSugarDrawer()">✕</button>
        </div>

        <div class="modal-drawer-body modal-drawer-body-pinned">
          <div class="catalog-drawer-content">
            <div class="catalog-drawer-controls">
              <div class="catalog-search-wrapper">
                <input
                  type="text"
                  class="form-input text-xs"
                  placeholder="Search sugars by name…"
                  x-model.debounce.50ms="sugarSearch"
                />
              </div>

              <div class="filter-pills-container">
                <button
                  type="button"
                  class="filter-pill"
                  :class="{ 'is-active': sugarSearchNotes }" :aria-pressed="(sugarSearchNotes) ? 'true' : 'false'"
                  @click="toggleSugarSearchNotes()"
                >Search notes</button>
              </div>
              <div
                class="catalog-result-counter text-xs"
                aria-live="polite"
                x-text="sugarResultLabel"
              ></div>
            </div>
            <div class="catalog-drawer-list">
              <template x-for="item in sugarVisibleCatalog" :key="item.id">
                <div class="catalog-item-card">
                  <div>
                    <div class="catalog-item-name">
                      <span x-text="item.name"></span>
                      <template x-if="isUserItem(item.id)">
                        <span class="status-badge status-badge-info text-nano">mine</span>
                      </template>
                    </div>
                    <div
                      class="catalog-item-meta"
                      x-text="sugarItemMeta(item)"
                    ></div>
                  </div>
                  <div class="catalog-item-actions">
                    <button
                      type="button"
                      class="btn-outline text-xs"
                      x-show="!isUserItem(item.id)"
                      @click="duplicateCatalogSugar(item.id)"
                      title="Copy to my items"
                    >
                      Copy
                    </button>
                    <button type="button" class="btn-primary text-xs" @click="addCatalogSugar(item.id)">＋ Add</button>
                  </div>
                </div>
              </template>
              <template x-if="sugarFilteredCatalog.length === 0">
                <div class="table-empty-cell">No matching sugars found.</div>
              </template>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
