<!-- Grain Bill Editor (workspace modal): draft grid + catalog / inspector drawers -->
<div
  class="modal-backdrop"
  x-show="maltEditorOpen"
  @click.self="cancelMaltEditor()"
  @keydown.escape.window="handleMaltEscape()"
>
  <div
    class="modal-dialog modal-dialog-workspace"
    role="dialog"
    aria-modal="true"
    aria-labelledby="malt-editor-title"
    tabindex="-1"
    x-effect="dialogFocus($el, maltEditorOpen)"
  >
    <div class="modal-workspace-header">
      <div class="modal-workspace-header-title">
        <h2 class="modal-workspace-title" id="malt-editor-title">Grain Bill Editor</h2>
        <span class="status-badge text-xs" :class="maltValidation.class" x-text="maltValidation.label"></span>
      </div>
      <div class="modal-workspace-header-actions">
        <button type="button" class="btn-outline text-xs" @click="cancelMaltEditor()">Cancel</button>
        <button
          type="button"
          class="btn-primary text-xs"
          @click="saveMaltEditor()"
          :disabled="maltValidation.type !== 'balanced'"
        >
          Save &amp; Apply
        </button>
      </div>
    </div>

    <div class="modal-workspace-body">
      <div class="modal-workspace-main">
        <load src="src/partials/draft-table.html" />
      </div>

      <div
        class="modal-drawer-scrim"
        x-show="maltDrawer !== null"
        x-transition.opacity.duration.200ms
        @click="closeMaltDrawer()"
      ></div>

      <div
        class="modal-workspace-drawer"
        id="malt-drawer"
        x-show="maltDrawer !== null"
        x-transition:enter="modal-drawer-enter"
        x-transition:enter-start="modal-drawer-enter-start"
        x-transition:enter-end="modal-drawer-enter-end"
        x-transition:leave="modal-drawer-leave"
        x-transition:leave-start="modal-drawer-leave-start"
        x-transition:leave-end="modal-drawer-leave-end"
      >
        <div class="modal-drawer-header">
          <h3
            class="section-title"
            x-text="maltDrawer === 'search' ? 'Malt Catalog Browser' : 'Row Inspector'"
          ></h3>
          <button type="button" class="btn-close text-xs" @click="closeMaltDrawer()">✕</button>
        </div>

        <div class="modal-drawer-body" :class="{ 'modal-drawer-body-pinned': maltDrawer === 'search' }">
          <template x-if="draftDrawer === 'search'">
            <load src="src/partials/draft-search-pane.html" />
          </template>

          <template x-if="maltDrawer === 'inspect'">
            <template x-if="maltActiveRow">
              <div class="inspector-form">
                <div class="form-group">
                  <label class="form-label text-xs" for="malt-row-name">Malt name</label>
                  <input
                    id="malt-row-name"
                    type="text"
                    class="form-input text-xs"
                    :value="maltActiveRow.name"
                    @input="setMaltField(maltActiveIndex, 'name', $event.target.value)"
                  />
                </div>
                <div class="form-group">
                  <label class="form-label text-xs" for="malt-row-category">Category</label>
                  <select
                    id="malt-row-category"
                    class="form-select text-xs"
                    :value="maltActiveRow.category"
                    @change="setMaltField(maltActiveIndex, 'category', $event.target.value)"
                  >
                    <template x-for="c in maltCategories" :key="c">
                      <option :value="c" :selected="c === maltActiveRow.category" x-text="c"></option>
                    </template>
                  </select>
                </div>
                <div class="inspector-grid-2col">
                  <div class="form-group">
                    <label class="form-label text-xs" for="malt-row-yield">Extract yield (%)</label>
                    <input
                      id="malt-row-yield"
                      type="number"
                      step="1"
                      min="0"
                      max="100"
                      class="form-input text-xs"
                      :value="fmt.toPercentValue(maltActiveRow.yield_fraction, 0)"
                      @change="setMaltField(maltActiveIndex, 'yield_fraction', $event.target.value, 0.01)"
                    />
                  </div>
                  <div class="form-group">
                    <label class="form-label text-xs" for="malt-row-color" x-text="'Color (' + colorUnit() + ')'"></label>
                    <input
                      id="malt-row-color"
                      type="number"
                      step="0.1"
                      min="0"
                      class="form-input text-xs"
                      :value="colorDisplay(maltActiveRow.color_lovibond)"
                      @change="setColorField(maltActiveIndex, $event.target.value)"
                    />
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label text-xs" for="malt-row-notes">Notes</label>
                  <textarea
                    id="malt-row-notes"
                    class="form-input text-xs"
                    rows="3"
                    :value="maltActiveRow.notes ?? ''"
                    @input="setMaltField(maltActiveIndex, 'notes', $event.target.value)"
                  ></textarea>
                </div>
              </div>
            </template>
          </template>
        </div>
      </div>
    </div>

    <load src="src/partials/draft-discard-confirm.html" />
  </div>
</div>
