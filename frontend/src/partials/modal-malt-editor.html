<!-- Grain Bill Editor (workspace modal): draft grid + catalog / inspector drawers -->
<div
  class="modal-backdrop"
  x-show="maltEditorOpen"
  @click.self="cancelMaltEditor()"
  @keydown.escape.window="handleMaltEscape()"
>
  <div class="modal-dialog modal-dialog-workspace">
    <div class="modal-workspace-header">
      <div class="modal-workspace-header-title">
        <h2 class="modal-workspace-title">Grain Bill Editor</h2>
        <span class="status-badge text-xs" :class="maltValidation.class" x-text="maltValidation.label"></span>
      </div>
      <div class="modal-workspace-header-actions">
        <button type="button" class="btn-outline text-xs" @click="cancelMaltEditor()">Cancel</button>
        <button
          type="button"
          class="btn-primary text-xs"
          @click="saveMaltEditor()"
          :disabled="maltValidation.type !== 'balanced'"
        >
          Save &amp; Apply
        </button>
      </div>
    </div>

    <div class="modal-workspace-body">
      <div class="modal-workspace-main">
        <div class="table-header-toolbar">
          <span class="table-header-meta">
            Enter relative proportional parts. Hamilton normalizes the bill to exactly 100.0%.
          </span>
          <button
            type="button"
            class="btn-primary text-xs"
            @click="openMaltSearch()"
            :disabled="maltAtLimit"
          >
            ＋ Add Malt from Catalog
          </button>
        </div>

        <div class="data-table-container">
          <table class="data-table is-fixed">
            <thead>
              <tr>
                <template x-for="c in draftColumns" :key="c.id">
                  <th :class="c.id === 'name' || c.id === 'category' ? '' : 'text-right'">
                    <span x-text="c.label + (c.unit ? ' (' + c.unit + ')' : '')"></span>
                  </th>
                </template>
                <th class="text-right">Actions</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="(row, ri) in draftDisplayRows" :key="ri">
                <tr>
                  <template x-for="c in draftColumns" :key="c.id">
                    <td :class="c.id === 'name' || c.id === 'category' ? '' : 'text-right'">
                      <template x-if="c.editable">
                        <input
                          type="number"
                          step="0.1"
                          min="0"
                          class="form-input table-input-parts"
                          :value="row[c.id]"
                          @input="editDraftCell(ri, c.id, $event.target.value)"
                        />
                      </template>
                      <template x-if="!c.editable">
                        <span class="collection-readout">
                          <span x-text="row[c.id]"></span>
                          <template x-if="c.id === 'pct'">
                            <span class="table-pct-badge" :class="maltIsTrace(draftRows[ri]) ? 'is-trace' : 'is-valid'">
                              <span x-text="maltIsTrace(draftRows[ri]) ? '✗' : '✓'"></span>
                            </span>
                          </template>
                        </span>
                      </template>
                    </td>
                  </template>
                  <td class="text-right">
                    <div class="table-action-cell">
                      <button
                        type="button"
                        class="btn-action-icon"
                        @click="cloneDraftMalt(ri)"
                        :disabled="maltAtLimit"
                        title="Clone &amp; Edit"
                      >
                        📋
                      </button>
                      <button type="button" class="btn-action-icon" @click="inspectMaltRow(ri)" title="Inspect">✎</button>
                      <button
                        type="button"
                        class="btn-action-icon btn-action-danger"
                        @click="removeMalt(ri)"
                        title="Remove"
                      >
                        🗑
                      </button>
                    </div>
                  </td>
                </tr>
              </template>
              <template x-if="draftRows.length === 0">
                <tr>
                  <td :colspan="draftColumns.length + 1" class="table-empty-cell">
                    No malts in the draft. Click “＋ Add Malt from Catalog” to begin.
                  </td>
                </tr>
              </template>
            </tbody>
            <tfoot>
              <tr>
                <td :colspan="draftColumns.length + 1" class="tabular-nums">
                  <span class="font-bold">Totals:</span>
                  <span x-text="' ' + maltTotalParts.toFixed(1) + ' parts · ' + (maltTotalPct * 100).toFixed(1) + '%'"></span>
                </td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>

      <div class="modal-drawer-scrim" x-show="maltDrawer !== null" @click="closeMaltDrawer()"></div>

      <div class="modal-workspace-drawer" x-show="maltDrawer !== null">
        <div class="modal-drawer-header">
          <h3
            class="modal-drawer-title"
            x-text="maltDrawer === 'search' ? 'Malt Catalog Browser' : 'Row Inspector'"
          ></h3>
          <button type="button" class="btn-close text-xs" @click="closeMaltDrawer()">✕</button>
        </div>

        <div class="modal-drawer-body" :class="{ 'modal-drawer-body-pinned': maltDrawer === 'search' }">
          <template x-if="maltDrawer === 'search'">
            <div class="catalog-drawer-content">
              <div class="catalog-drawer-controls">
                <div class="catalog-search-wrapper">
                  <input
                    type="text"
                    class="form-input text-xs"
                    placeholder="Search malts by name or notes…"
                    x-model.debounce.50ms="maltSearch"
                  />
                </div>
                <div class="filter-pills-container">
                  <template x-for="c in maltCategories" :key="c">
                    <button
                      type="button"
                      class="filter-pill"
                      :class="{ 'is-active': maltCategoryFilter.includes(c) }"
                      @click="toggleMaltCategory(c)"
                      x-text="c"
                    ></button>
                  </template>
                </div>
                <div
                  class="catalog-result-counter text-xs"
                  aria-live="polite"
                  x-text="maltCatalogTruncated
                    ? `Showing ${maltVisibleCatalog.length} of ${maltFilteredCatalog.length} malts — refine search or category filters`
                    : `Showing ${maltFilteredCatalog.length} malts`"
                ></div>
              </div>
              <div class="catalog-drawer-list">
                <template x-for="item in maltVisibleCatalog" :key="item.id">
                  <div class="catalog-item-card">
                    <div>
                      <div class="catalog-item-name">
                        <span x-text="item.name"></span>
                        <template x-if="isUserItem(item.id)">
                          <span class="status-badge status-badge-info text-nano">mine</span>
                        </template>
                      </div>
                      <div
                        class="catalog-item-meta"
                        x-text="item.category + ' • ' + item.color_lovibond + ' °L' + (item.notes ? ' • ' + item.notes : '')"
                      ></div>
                    </div>
                    <div class="catalog-item-actions">
                      <button
                        type="button"
                        class="btn-outline text-xs"
                        x-show="!isUserItem(item.id)"
                        @click="duplicateCatalogMalt(item.id)"
                        title="Copy to my items"
                      >
                        Copy
                      </button>
                      <button
                        type="button"
                        class="btn-primary text-xs"
                        @click="addCatalogMalt(item.id)"
                        :disabled="maltAtLimit"
                      >
                        ＋ Add
                      </button>
                    </div>
                  </div>
                </template>
                <template x-if="maltFilteredCatalog.length === 0">
                  <div class="table-empty-cell">No matching malts found.</div>
                </template>
              </div>
            </div>
          </template>

          <template x-if="maltDrawer === 'inspect'">
            <template x-if="maltActiveRow">
              <div class="inspector-form">
                <div class="form-group">
                  <label class="form-label text-xs">Malt name</label>
                  <input
                    type="text"
                    class="form-input text-xs"
                    :value="maltActiveRow.name"
                    @input="setMaltField(maltActiveIndex, 'name', $event.target.value)"
                  />
                </div>
                <div class="form-group">
                  <label class="form-label text-xs">Category</label>
                  <select
                    class="form-select text-xs"
                    :value="maltActiveRow.category"
                    @change="setMaltField(maltActiveIndex, 'category', $event.target.value)"
                  >
                    <template x-for="c in maltCategories" :key="c">
                      <option :value="c" x-text="c"></option>
                    </template>
                  </select>
                </div>
                <div class="inspector-grid-2col">
                  <div class="form-group">
                    <label class="form-label text-xs">Extract yield (%)</label>
                    <input
                      type="number"
                      step="1"
                      min="0"
                      max="100"
                      class="form-input text-xs"
                      :value="(maltActiveRow.yield_fraction * 100).toFixed(0)"
                      @input="setMaltField(maltActiveIndex, 'yield_fraction', $event.target.value, 0.01)"
                    />
                  </div>
                  <div class="form-group">
                    <label class="form-label text-xs">Color (°L)</label>
                    <input
                      type="number"
                      step="0.1"
                      min="0"
                      class="form-input text-xs"
                      :value="maltActiveRow.color_lovibond"
                      @input="setMaltField(maltActiveIndex, 'color_lovibond', $event.target.value)"
                    />
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label text-xs">Notes</label>
                  <textarea
                    class="form-input text-xs"
                    rows="3"
                    :value="maltActiveRow.notes ?? ''"
                    @input="setMaltField(maltActiveIndex, 'notes', $event.target.value)"
                  ></textarea>
                </div>
              </div>
            </template>
          </template>
        </div>
      </div>
    </div>
  </div>
</div>
