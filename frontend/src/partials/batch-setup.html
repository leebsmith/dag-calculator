<!-- New batch dialog: selection only. Records are authored in the Library. ------->
<div
  x-data="modalShell({
    open: () => $store.setup.state.modalOpen,
    id: 'new-batch',
    title: 'New batch',
    cancel: () => $store.setup.closeModal(),
    cancelLabel: 'Cancel',
    cancelDisabled: () => $store.setup.state.busy,
    save: () => ($store.setup.state.mode === 'scratch' ? $store.setup.create() : $store.setup.startImport()),
    saveLabel: () => ($store.setup.state.mode === 'scratch' ? 'Create batch' : $store.setup.primaryLabel()),
    saveDisabled: () => $store.setup.state.busy || ($store.setup.state.mode === 'scratch' ? !$store.setup.canCreate() : !$store.setup.canStartImport()),
    escape: () => $store.setup.closeModal()
  })"
>
  <load src="src/partials/ui-modal-shell.html" />

  <template x-teleport="#new-batch-overlay">
    <div class="modal-busy" x-show="$store.setup.state.busy" role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <p class="font-medium" x-text="$store.setup.primaryLabel()"></p>
      <p class="text-xs text-muted">
        One pass over the document, usually ten to thirty seconds. The PDF is not kept — only the
        transcription and the mapping persist.
      </p>
    </div>
  </template>

  <template x-teleport="#new-batch-body">
    <div class="modal-workspace-main">
        <div class="setup-mode-switch" role="group" aria-label="How to start">
          <button
            type="button"
            class="btn-outline btn-sm"
            :class="{ 'is-active': $store.setup.state.mode === 'scratch' }"
            :aria-pressed="$store.setup.state.mode === 'scratch'"
            @click="$store.setup.setMode('scratch')"
          >From scratch</button>
          <button
            type="button"
            class="btn-outline btn-sm"
            :class="{ 'is-active': $store.setup.state.mode === 'recipe' }"
            :aria-pressed="$store.setup.state.mode === 'recipe'"
            @click="$store.setup.setMode('recipe')"
          >From a recipe</button>
        </div>

        <p class="form-hint text-warning" role="note">
          Style, rig, and water source are sealed into this batch. To change any of them later,
          start a new batch.
        </p>

        <div class="form-group" x-show="$store.setup.state.mode === 'recipe'">
          <label class="form-label" for="recipe-file"><span>Recipe document (PDF)</span></label>
          <input
            id="recipe-file"
            class="form-input"
            type="file"
            accept="application/pdf"
            @change="$store.setup.chooseFile($event.target.files[0])"
          />
          <p class="form-hint" x-show="$store.setup.state.filename" x-text="$store.setup.state.filename"></p>
          <p class="form-hint">
            The document is read once and not kept: only the transcription and your mapping persist.
          </p>
        </div>

        <div class="form-hint text-warning" x-show="$store.setup.state.mode === 'recipe' && $store.imports.duplicateOf">
          <template x-if="$store.imports.duplicateStatus === 'failed'">
            <p>
              This document was read before and could not be used:
              <span x-text="$store.imports.duplicateReason || 'not enough to build a batch'"></span>.
              <button
                type="button"
                class="btn-link"
                @click="$store.imports.reread({ filename: $store.setup.state.filename, file: $store.setup.state.file, identity: $store.setup.identity() })"
              >Delete it and read again</button>,
              or
              <button type="button" class="btn-link" @click="$store.imports.discardDuplicate()">choose a different file</button>.
            </p>
          </template>
          <template x-if="$store.imports.duplicateStatus !== 'failed'">
            <p>
              This document was already imported.
              <button type="button" class="btn-link" @click="$store.imports.resume($store.imports.duplicateOf); $store.setup.closeModal()">Resume that import</button>,
              or
              <button type="button" class="btn-link" @click="$store.imports.discardDuplicate()">choose a different file</button>.
            </p>
          </template>
        </div>

        <div class="form-group" x-show="$store.setup.state.mode === 'scratch'">
          <label class="form-label" for="batch-name"><span>Batch name</span></label>
          <input
            id="batch-name"
            class="form-input"
            type="text"
            placeholder="e.g. House Pale"
            :value="$store.setup.state.name"
            @input="$store.setup.state.name = $event.target.value"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="batch-style"><span>Style</span></label>
          <select id="batch-style" class="form-select" @change="$store.setup.state.styleId = $event.target.value">
            <template x-for="option in $store.setup.styleOptions()" :key="option.value">
              <option :value="option.value" :selected="option.value === $store.setup.state.styleId" x-text="option.label"></option>
            </template>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="batch-rig"><span>Rig</span></label>
          <select id="batch-rig" class="form-select" @change="$store.setup.state.equipmentId = $event.target.value">
            <template x-for="option in $store.setup.equipmentOptions()" :key="option.value">
              <option :value="option.value" :selected="option.value === $store.setup.state.equipmentId" x-text="option.label"></option>
            </template>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="batch-water"><span>Water source</span></label>
          <select id="batch-water" class="form-select" @change="$store.setup.state.waterId = $event.target.value">
            <template x-for="option in $store.setup.waterOptions()" :key="option.value">
              <option :value="option.value" :selected="option.value === $store.setup.state.waterId" x-text="option.label"></option>
            </template>
          </select>
        </div>

        <p class="form-hint" x-show="!$store.setup.state.busy && ($store.setup.state.mode === 'scratch' ? !$store.setup.canCreate() : !$store.setup.canStartImport())">
          <span x-show="$store.setup.state.mode === 'scratch'">
            Choose a name, a style, a rig, and a water source. Records are created and sealed in the
            Library's Sources section.
          </span>
          <span x-show="$store.setup.state.mode === 'recipe'">
            Choose a style, a rig, and a water source, then pick a PDF. The identity is sealed into
            the batch this import will become.
          </span>
        </p>

        <p class="form-hint text-danger" x-show="$store.setup.state.error" x-text="$store.setup.state.error"></p>
      </div>
  </template>
</div>
