<section class="card">
  <div class="card-header">
    <h2 class="card-title" x-text="activeStep.title"></h2>
    <p class="card-subtitle" x-show="activeStep.subtitle" x-text="activeStep.subtitle"></p>
  </div>

  <div class="card-body">
    <div
      x-data="formBuilder({
        schema: [
          {
            id: 'checklist-level',
            type: 'select',
            label: 'Checklist level',
            read: () => brewDayLevel,
            write: (value) => setBrewDayLevel(value),
            options: () => brewDayLevels.map((level) => ({ value: level.id, label: level.name })),
            commit: 'change',
            hint: 'Critical path is the short gate list; Standard is the full brew sheet; Diagnostic adds expected values, methods and model caveats.'
          }
        ]
      })"
    >
      <load src="src/partials/ui-form-fields.html" />
    </div>

    <template x-for="phase in brewDaySections" :key="phase.id">
      <section class="card-section card-section--collapsible">
        <div class="section-header">
          <button
            type="button"
            class="section-toggle"
            :aria-expanded="isBrewDaySectionOpen(phase.id) ? 'true' : 'false'"
            :aria-controls="'brew-day-panel-' + phase.id"
            @click="toggleBrewDaySection(phase.id)"
          >
            <span class="section-chevron" aria-hidden="true">▸</span>
            <span class="region-title" x-text="phase.name"></span>
            <span class="section-meta" x-text="phase.sections.length + ' sections'"></span>
          </button>
        </div>

        <div
          class="section-body"
          :id="'brew-day-panel-' + phase.id"
          x-show="isBrewDaySectionOpen(phase.id)"
        >
          <template x-for="section in phase.sections" :key="section.id">
            <div>
              <h3 class="eyebrow" x-text="section.name"></h3>

              <template x-for="row in section.rows" :key="row.kind + ':' + row.step_id + ':' + row.title">
                <div class="brew-day-step">
                  <template x-if="row.kind === 'step'">
                    <div>
                      <div class="brew-day-step-toggle">
                        <span class="font-medium" x-text="row.title"></span>
                        <span class="text-xs text-muted" x-show="row.auto" x-text="'Preflight'"></span>
                        <span class="text-xs text-warning" x-show="row.skipped" x-text="'Skipped'"></span>
                        <span class="text-xs text-muted" x-show="row.not_applicable" x-text="'N/A'"></span>
                      </div>

                      <p class="text-sm" x-text="row.text"></p>
                      <p
                        class="text-xs text-muted"
                        x-show="row.done_when"
                        x-text="'Done when: ' + row.done_when"
                      ></p>

                      <template x-if="!row.auto && !row.not_applicable">
                        <div class="brew-day-instructions-wrap">
                          <textarea
                            class="form-input brew-day-instructions"
                            rows="2"
                            :value="row.note"
                            placeholder="Add a note for this step"
                            @input="setBrewDayNote(row.step_id, $event.target.value)"
                          ></textarea>

                          <label class="text-xs">
                            <input
                              type="checkbox"
                              :checked="row.skipped"
                              @change="setBrewDaySkipped(row.step_id, $event.target.checked)"
                            />
                            Skip this step
                          </label>

                          <input
                            type="text"
                            class="form-input text-xs"
                            x-show="row.skipped"
                            :value="row.skip_reason"
                            placeholder="Why skip this step?"
                            @change="setBrewDaySkipReason(row.step_id, $event.target.value)"
                          />
                        </div>
                      </template>
                    </div>
                  </template>

                  <template x-if="row.kind === 'observation'">
                    <div class="text-sm">
                      <span class="font-medium" x-text="row.title"></span>
                      <span
                        class="text-xs text-muted"
                        x-text="'Expected ' + row.expected + ' · ' + row.unit + ' · ' + row.method"
                      ></span>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </template>
        </div>
      </section>
    </template>
  </div>
</section>
