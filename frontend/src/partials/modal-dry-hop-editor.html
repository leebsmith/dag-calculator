<!-- Dry Hop Editor (workspace modal): draft table + hop catalog / inspector drawers -->
<div
  x-data="modalShell" data-shell="dryHopEditorConfig"
  x-effect="syncOpen(dryHopEditorOpen)"
>
  <load src="src/partials/ui-modal-shell.html" />

  <template x-teleport="#dry-hop-editor-body">
    <div class="modal-teleport-root">
      <div class="modal-workspace-main">
          <div class="table-header-toolbar">
            <span class="text-xs text-muted">
              Applied in fermentation (cold side). The application and the contact span record intent;
              nothing here is solved.
            </span>
            <button
              type="button"
              class="btn-primary btn-sm"
              @click="openDryHopSearch()"
              :aria-expanded="(dryHopDrawer !== null) ? 'true' : 'false'"
              aria-controls="dry-hop-drawer"
            >
              ＋ Add from Catalog
            </button>
          </div>

          <div class="data-table-container data-table-container--fit">
            <table class="data-table data-table--editor data-table--fixed">
              <colgroup>
                <col style="width: 14%" />
                <col style="width: 10%" />
                <col style="width: 7%" />
                <col style="width: 8%" />
                <col style="width: 26%" />
                <col style="width: 28%" />
                <col style="width: 7%" />
              </colgroup>
              <thead>
                <tr>
                  <th>Hop</th>
                  <th>Type</th>
                  <th class="text-right">Qty</th>
                  <th>Unit</th>
                  <th>When</th>
                  <th>Contact</th>
                  <th class="text-right">Actions</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="(row, ri) in draftRows" :key="ri">
                  <tr>
                    <td>
                      <span class="font-medium" x-text="dryHopTitle(row)"></span>
                    </td>
                    <td x-text="dryHopTypeLabel(row)"></td>
                    <td class="text-right tabular-nums">
                      <input
                        type="number"
                        step="0.1"
                        min="0"
                        class="form-input table-input-parts"
                        :value="row.quantity"
                        @change="setDryHopDraftNumber(ri, 'quantity', $event.target.value)"
                        :aria-label="'Quantity for ' + dryHopTitle(row)"
                      />
                    </td>
                    <td>
                      <select
                        class="form-select text-xs"
                        :value="row.unit"
                        @change="setDryHopDraftField(ri, 'unit', $event.target.value)"
                        :aria-label="'Unit for ' + dryHopTitle(row)"
                      >
                        <template x-for="opt in dryHopUnitOptions" :key="opt.value">
                          <option
                            :value="opt.value"
                            :selected="opt.value === row.unit"
                            x-text="opt.label"
                          ></option>
                        </template>
                      </select>
                    </td>
                    <td x-text="dryHopWhen(row)"></td>
                    <td x-text="dryHopContact(row)"></td>
                    <td class="text-right">
                      <div class="row-actions">
                        <button type="button" class="btn-action-icon" @click="inspectDryHopRow(ri)" title="Inspect">✎</button>
                        <button
                          type="button"
                          class="btn-action-icon btn-action-danger"
                          @click="removeDryHop(ri)"
                          title="Remove"
                        >
                          🗑
                        </button>
                      </div>
                    </td>
                  </tr>
                </template>
                <template x-if="draftRows.length === 0">
                  <tr>
                    <td colspan="7" class="empty-state">
                      No dry hops in the draft. Click “＋ Add from Catalog”.
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

        <div
          class="modal-drawer-scrim"
          x-show="dryHopDrawer !== null"
          x-transition.opacity.duration.200ms
          @click="closeDryHopDrawer()"
        ></div>

        <div
          class="modal-workspace-drawer"
          id="dry-hop-drawer"
          x-show="dryHopDrawer !== null"
          x-transition:enter="modal-drawer-enter"
          x-transition:enter-start="modal-drawer-enter-start"
          x-transition:enter-end="modal-drawer-enter-end"
          x-transition:leave="modal-drawer-leave"
          x-transition:leave-start="modal-drawer-leave-start"
          x-transition:leave-end="modal-drawer-leave-end"
        >
          <div class="modal-drawer-header">
            <h3
              class="region-title"
              x-text="dryHopDrawer === 'search' ? 'Hop / Product Catalog' : 'Dry Hop Inspector'"
            ></h3>
            <button type="button" class="btn-close text-xs" @click="closeDryHopDrawer()">✕</button>
          </div>

          <div class="modal-drawer-body" :class="fmt.classWhen(dryHopDrawer === 'search', 'modal-drawer-body-pinned')">
            <template x-if="draftDrawer === 'search'">
              <load src="src/partials/draft-search-pane.html" />
            </template>

            <template x-if="dryHopDrawer === 'inspect'">
              <template x-if="dryHopActiveRow">
                <div class="inspector-form">
                  <section class="card-section">
                    <div class="card-section-header">
                      <h4 class="eyebrow">When</h4>
                    </div>

                    <div class="form-group">
                      <label class="form-label" for="dh-application-kind">Applied</label>
                      <select
                        id="dh-application-kind"
                        class="form-select"
                        :value="dryHopApplicationKind()"
                        @change="setDryHopApplicationKind($event.target.value)"
                      >
                        <template x-for="opt in dryHopApplicationKindOptions" :key="opt.id">
                          <option :value="opt.id" :selected="opt.id === dryHopApplicationKind()" x-text="opt.label"></option>
                        </template>
                      </select>
                    </div>

                    <div class="form-group" x-show="dryHopApplicationKind() === 'event'">
                      <label class="form-label" for="dh-application-event">Event</label>
                      <select
                        id="dh-application-event"
                        class="form-select"
                        :value="dryHopApplicationEvent()"
                        @change="setDryHopApplicationEvent($event.target.value)"
                      >
                        <template x-for="opt in dryHopEventOptions" :key="opt.value">
                          <option :value="opt.value" :selected="opt.value === dryHopApplicationEvent()" x-text="opt.label"></option>
                        </template>
                      </select>
                    </div>

                    <div class="form-group" x-show="dryHopApplicationKind() === 'day'">
                      <label class="form-label" for="dh-application-day">Day of fermentation</label>
                      <input
                        id="dh-application-day"
                        type="number"
                        min="0"
                        step="0.25"
                        class="form-input"
                        :value="dryHopApplicationDay()"
                        @change="setDryHopApplicationDay($event.target.value)"
                      />
                    </div>

                    <div class="form-group" x-show="dryHopApplicationKind() === 'after'">
                      <label class="form-label" for="dh-application-ref">Charge</label>
                      <select
                        id="dh-application-ref"
                        class="form-select"
                        :value="dryHopApplicationRefKey()"
                        @change="setDryHopApplicationRef($event.target.value)"
                      >
                        <template x-for="opt in dryHopApplicationRefOptions()" :key="opt.value">
                          <option :value="opt.value" :selected="opt.value === dryHopApplicationRefKey()" x-text="opt.label"></option>
                        </template>
                      </select>
                    </div>

                    <div class="form-group" x-show="dryHopApplicationKind() !== 'day'">
                      <label class="form-label" for="dh-application-offset">Offset (days)</label>
                      <input
                        id="dh-application-offset"
                        type="number"
                        step="0.25"
                        class="form-input"
                        :value="dryHopApplicationOffset()"
                        @change="setDryHopApplicationOffset($event.target.value)"
                      />
                      <span class="form-hint">Negative shifts earlier; 0.25 is six hours.</span>
                    </div>
                  </section>

                  <section class="card-section">
                    <div class="card-section-header">
                      <h4 class="eyebrow">Contact</h4>
                    </div>

                    <div class="form-group">
                      <label class="form-label" for="dh-contact-kind">Ends</label>
                      <select
                        id="dh-contact-kind"
                        class="form-select"
                        :value="dryHopContactKind()"
                        @change="setDryHopContactKind($event.target.value)"
                      >
                        <template x-for="opt in dryHopContactKindOptions" :key="opt.id">
                          <option :value="opt.id" :selected="opt.id === dryHopContactKind()" x-text="opt.label"></option>
                        </template>
                      </select>
                    </div>

                    <div class="form-group" x-show="dryHopContactKind() === 'for'">
                      <label class="form-label" for="dh-contact-days">Days</label>
                      <input
                        id="dh-contact-days"
                        type="number"
                        min="0.25"
                        step="0.25"
                        class="form-input"
                        :value="dryHopContactDays()"
                        @change="setDryHopContactDays($event.target.value)"
                      />
                    </div>

                    <template x-if="dryHopContactKind() === 'until'">
                      <div>
                        <div class="form-group">
                          <label class="form-label" for="dh-contact-until-kind">Until</label>
                          <select
                            id="dh-contact-until-kind"
                            class="form-select"
                            :value="dryHopContactUntilKind()"
                            @change="setDryHopContactUntilKind($event.target.value)"
                          >
                            <template x-for="opt in dryHopInstantKindOptions" :key="opt.id">
                              <option :value="opt.id" :selected="opt.id === dryHopContactUntilKind()" x-text="opt.label"></option>
                            </template>
                          </select>
                        </div>

                        <div class="form-group" x-show="dryHopContactUntilKind() === 'event'">
                          <label class="form-label" for="dh-contact-until-event">Event</label>
                          <select
                            id="dh-contact-until-event"
                            class="form-select"
                            :value="dryHopContactUntilEvent()"
                            @change="setDryHopContactUntilEvent($event.target.value)"
                          >
                            <template x-for="opt in dryHopEventOptions" :key="opt.value">
                              <option :value="opt.value" :selected="opt.value === dryHopContactUntilEvent()" x-text="opt.label"></option>
                            </template>
                          </select>
                        </div>

                        <div class="form-group" x-show="dryHopContactUntilKind() === 'day'">
                          <label class="form-label" for="dh-contact-until-day">Day of fermentation</label>
                          <input
                            id="dh-contact-until-day"
                            type="number"
                            min="0"
                            step="0.25"
                            class="form-input"
                            :value="dryHopContactUntilDay()"
                            @change="setDryHopContactUntilDay($event.target.value)"
                          />
                        </div>

                        <div class="form-group" x-show="dryHopContactUntilKind() === 'after'">
                          <label class="form-label" for="dh-contact-until-ref">Charge</label>
                          <select
                            id="dh-contact-until-ref"
                            class="form-select"
                            :value="dryHopContactUntilRefKey()"
                            @change="setDryHopContactUntilRef($event.target.value)"
                          >
                            <template x-for="opt in dryHopContactRefOptions()" :key="opt.value">
                              <option :value="opt.value" :selected="opt.value === dryHopContactUntilRefKey()" x-text="opt.label"></option>
                            </template>
                          </select>
                        </div>

                        <div class="form-group" x-show="dryHopContactUntilKind() !== 'day'">
                          <label class="form-label" for="dh-contact-until-offset">Offset (days)</label>
                          <input
                            id="dh-contact-until-offset"
                            type="number"
                            step="0.25"
                            class="form-input"
                            :value="dryHopContactUntilOffset()"
                            @change="setDryHopContactUntilOffset($event.target.value)"
                          />
                        </div>
                      </div>
                    </template>
                  </section>

                  <div
                    x-data="formBuilder" data-schema="dryHopInspectorFields"
                    x-effect="setModel(dryHopActiveRow)"
                  >
                    <load src="src/partials/ui-form-fields.html" />
                  </div>
                </div>
              </template>
            </template>
          </div>
        </div>
    </div>
  </template>

  <template x-teleport="#dry-hop-editor-overlay">
    <load src="src/partials/draft-discard-confirm.html" />
  </template>
</div>
