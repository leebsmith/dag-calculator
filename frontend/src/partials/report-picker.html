<!-- Report sections picker: assemble a subset of the registered sections. -------->
<div
  x-data="modalShell({
    id: 'report-picker',
    variant: 'plain',
    cancel: () => $store.recipes.closeReportPicker(),
    escape: () => $store.recipes.closeReportPicker()
  })"
  x-effect="syncOpen($store.recipes.reportPickerOpen)"
>
  <load src="src/partials/ui-modal-shell.html" />

  <template x-teleport="#report-picker-body">
    <div class="modal-teleport-root">
      <h2 class="modal-workspace-title" id="report-picker-title">Report sections</h2>
      <p class="form-hint">
        Sections without data for this batch are left out. They always print in the
        order below.
      </p>

      <div
        x-data="formBuilder({
          schema: [
            {
              id: 'report-sections',
              type: 'checkbox-group',
              label: 'Sections',
              options: () => $store.recipes.reportSections.map((section) => ({ value: section.id, label: section.title })),
              read: () => $store.recipes.reportSelection,
              write: (next) => { $store.recipes.reportSelection = next; },
              actions: [
                { label: 'All', class: 'btn-outline btn-sm', run: () => $store.recipes.selectAllReportSections() },
                { label: 'None', class: 'btn-outline btn-sm', run: () => $store.recipes.clearReportSections() }
              ]
            }
          ]
        })"
      >
        <load src="src/partials/ui-form-fields.html" />
      </div>

      <div class="report-picker-actions">
        <span class="form-hint" x-text="$store.recipes.reportSelection.length + ' of ' + $store.recipes.reportSections.length + ' selected'"></span>
        <button type="button" class="btn-outline btn-sm" @click="$store.recipes.closeReportPicker()">
          Cancel
        </button>
        <button
          type="button"
          class="btn-outline btn-sm"
          :disabled="!$store.recipes.reportSelection.length"
          @click="$store.recipes.previewSelectedReport()"
        >
          Preview
        </button>
        <button
          type="button"
          class="btn-primary btn-sm"
          :disabled="!$store.recipes.reportSelection.length"
          @click="$store.recipes.downloadSelectedReport()"
        >
          Download
        </button>
      </div>
    </div>
  </template>
</div>
