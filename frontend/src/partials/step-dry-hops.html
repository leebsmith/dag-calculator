<section class="step-card">
  <div class="step-card-header">
    <h2 class="card-title" x-text="activeStep.title"></h2>
    <p class="card-subtitle" x-show="activeStep.subtitle" x-text="activeStep.subtitle"></p>
  </div>

  <div class="step-card-content">
    <div class="table-header-toolbar">
      <div>
        <h3 class="modal-drawer-title">Dry-hop schedule</h3>
        <p class="text-xs text-muted">
          Application event, contact time &amp; hop type. Nothing here is solved.
        </p>
      </div>
      <button type="button" class="btn-primary text-xs" @click="openDryHopEditor()">Configure Dry Hops ⚙</button>
    </div>

    <div class="data-table-container">
      <table class="data-table">
        <colgroup>
          <col style="width: 30%" />
          <col style="width: 17%" />
          <col style="width: 10%" />
          <col style="width: 8%" />
          <col style="width: 17%" />
          <col style="width: 18%" />
        </colgroup>
        <thead>
          <tr>
            <th>Hop</th>
            <th>Type</th>
            <th class="text-right">Qty</th>
            <th class="text-right">Unit</th>
            <th>Applied at</th>
            <th>Contact</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="(row, ri) in dryHopRows" :key="ri">
            <tr>
              <td><span class="font-medium" x-text="dryHopTitle(row)"></span></td>
              <td x-text="dryHopTypeLabel(row)"></td>
              <td class="text-right tabular-nums" x-text="row.quantity"></td>
              <td class="text-right" x-text="row.unit"></td>
              <td x-text="dryHopEventLabel(row)"></td>
              <td x-text="dryHopContactLabel(row)"></td>
            </tr>
          </template>
          <template x-if="dryHopRows.length === 0">
            <tr>
              <td colspan="6" class="table-empty-cell">
                No dry hops yet. Click “Configure Dry Hops” to add additions.
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>

    <p class="form-hint" x-show="dryHopRows.length > 0">
      Applied in fermentation (cold side). The event and the contact end record what you intend;
      there is no fermentation model behind them.
    </p>
  </div>

  <load src="src/partials/modal-dry-hop-editor.html" />
</section>
