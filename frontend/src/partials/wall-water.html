<section class="card">
  <div class="card-header">
    <h2 class="card-title" x-text="fieldset.title"></h2>
    <p class="card-subtitle" x-show="fieldset.subtitle" x-text="fieldset.subtitle"></p>
  </div>

  <div class="card-body">
    <section class="card-section">
      <div class="card-section-header">
        <h3 class="eyebrow">Water plan</h3>
      </div>

      <div
        class="wall-grid-2col"
        x-data="formBuilder" data-schema="waterPlanFields"
      >
        <div class="form-group">
          <span class="field-label" x-text="waterPlan.source.label"></span>
          <p class="text-sm font-medium" x-text="waterPlan.source.title || '—'"></p>
          <p class="text-xs text-muted" x-show="waterPlan.source.detail" x-text="waterPlan.source.detail"></p>
          <span class="form-hint" x-show="waterPlan.source.hint" x-text="waterPlan.source.hint"></span>
        </div>

        <load src="src/partials/ui-form-fields.html" />
      </div>

      <div class="data-table-container">
        <table class="data-table data-table--editor data-table--dense">
          <caption class="text-xs text-muted">Concentrations in ppm</caption>
          <thead>
            <tr>
              <th>Target</th>
              <th>Ion</th>
              <th>Source (ppm)</th>
              <th>Objective (ppm)</th>
              <th>Post-addition (ppm)</th>
              <th>Kettle (ppm)</th>
              <th>Δ (ppm)</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="r in waterSummary.ions" :key="r.ion">
              <tr>
                <td>
                  <input
                    type="checkbox"
                    class="form-checkbox"
                    :checked="r.checked"
                    :aria-label="r.checkboxLabel"
                    @change="toggleWaterTarget(r.pin)"
                  />
                </td>
                <td x-text="r.label"></td>
                <td x-text="r.sourceText"></td>
                <td>
                  <template x-if="r.checked">
                    <input
                      type="number"
                      :min="fmt.or(r.sourceValue, 0)"
                      step="1"
                      class="form-input tabular-nums"
                      :value="inputDraft(inputKey('ion', r.pin), r.targetValue)"
                      :aria-label="r.inputLabel"
                      :aria-invalid="r.belowSource ? 'true' : null"
                      @input="editWaterTargetInput(r.pin, $event.target.value)"
                      @change="commitWaterTargetInput(r.pin)"
                    />
                  </template>
                  <template x-if="!r.checked">
                    <span x-text="r.valueText"></span>
                  </template>
                </td>
                <td x-text="r.postDoseText"></td>
                <td x-text="r.kettleText"></td>
                <td x-text="r.deltaText"></td>
                <td>
                  <span x-text="r.status"></span>
                  <div class="text-xs text-warning" x-show="r.hint" x-text="r.hint"></div>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <p class="text-xs text-secondary font-medium" x-text="waterVerdict.targetLine"></p>
      <p class="text-xs text-warning" x-show="waterSummary.targetWarning" x-text="waterSummary.targetWarning"></p>
      <p class="text-sm font-semibold text-primary" x-text="waterVerdict.ratioLine"></p>
      <p class="text-sm">
        <span class="text-muted">Mash pH </span>
        <span class="tabular-nums" x-text="waterVerdict.phLine"></span>
        <span class="text-muted" x-show="waterVerdict.status" x-text="' · ' + waterVerdict.status"></span>
      </p>
      <button
        type="button"
        class="btn-link text-warning text-xs"
        x-show="waterWarningCount > 0"
        @click="toggleWaterDetails()"
        x-text="waterSummary.warningLabel + ' — view details'"
      ></button>
    </section>

    <section class="region">
      <div class="group-header">
        <h3 class="group-title">Practice</h3>
      </div>
      <div class="wall-grid-2col">
        <template x-for="f in waterTreatmentFields" :key="f.id">
          <div class="form-group">
            <label class="form-label" :for="f.id">
              <span x-text="f.label"></span>
            </label>
            <select
              class="form-select"
              :id="f.id"
              :value="f.value"
              @change="edit(f, $event.target.value)"
            >
              <template x-for="opt in (f.options || [])" :key="opt">
                <option
                  :value="opt"
                  :selected="opt === f.value"
                  x-text="fmt.optionLabel(f.optionLabels, opt)"
                ></option>
              </template>
            </select>
            <span class="form-hint" x-show="f.hint" x-text="f.hint"></span>
          </div>
        </template>
      </div>
    </section>

  </div>
</section>
