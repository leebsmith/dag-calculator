<section class="card">
  <div class="card-header">
    <h2 class="card-title" x-text="activeStep.title"></h2>
    <p class="card-subtitle" x-show="activeStep.subtitle" x-text="activeStep.subtitle"></p>
  </div>

  <div class="card-body">
    <section class="card-section">
      <div class="section-body">
        <div
          x-data="formBuilder({ schema: discussionFields() })"
        >
          <load src="src/partials/ui-form-fields.html" />
          <template x-for="issue in proseIssues(discussion)" :key="issue.code">
            <p class="form-hint text-warning" x-text="issue.message"></p>
          </template>
        </div>
      </div>
    </section>
  </div>
</section>
