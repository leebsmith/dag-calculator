<div class="catalog-drawer-content">
  <div class="catalog-drawer-controls">
    <div class="catalog-search-wrapper">
      <input
        type="text"
        class="form-input text-xs"
        :placeholder="draftSearchPlaceholder"
        x-model.debounce.50ms="draftSearch"
      />
    </div>

    <div class="filter-pills-container">
      <button
        type="button"
        class="filter-pill"
        :class="{ 'is-active': draftSearchNotes }"
        :aria-pressed="draftSearchNotes ? 'true' : 'false'"
        @click="toggleDraftSearchNotes()"
      >Search notes</button>
    </div>

    <template x-if="draftFamilies.length > 0">
      <div class="filter-pills-container">
        <template x-for="f in draftFamilies" :key="f.name">
          <button
            type="button"
            class="filter-pill"
            :class="{ 'is-active': draftFamily === f.name }"
            :aria-pressed="draftFamily === f.name ? 'true' : 'false'"
            @click="toggleDraftFamily(f.name)"
            x-text="f.label + ' · ' + f.count"
          ></button>
        </template>
      </div>
    </template>

    <template x-if="draftCatalogFormOptions.length > 0">
      <div class="form-group">
        <label class="form-label text-xs" :for="'draft-catalog-form-' + draftNodeId">Catalog</label>
        <select
          :id="'draft-catalog-form-' + draftNodeId"
          class="form-select text-xs"
          :value="draftCatalogForm"
          @change="setDraftCatalogForm($event.target.value)"
        >
          <template x-for="form in draftCatalogFormOptions" :key="form.value">
            <option
              :value="form.value"
              :selected="form.value === draftCatalogForm"
              x-text="form.label"
            ></option>
          </template>
        </select>
      </div>
    </template>

    <template x-if="draftCategories.length > 0">
      <div class="filter-pills-container">
        <template x-for="c in draftCategories" :key="c">
          <button
            type="button"
            class="filter-pill"
            :class="{ 'is-active': draftCategoryFilter.includes(c) }"
            :aria-pressed="draftCategoryFilter.includes(c) ? 'true' : 'false'"
            @click="toggleDraftCategory(c)"
            x-text="c"
          ></button>
        </template>
      </div>
    </template>

    <div class="catalog-result-counter text-xs" aria-live="polite" x-text="draftResultLabel"></div>
  </div>

  <template x-if="draftHasStandard">
    <div class="catalog-drawer-list">
      <template x-if="!draftStandard">
        <div>
          <template x-for="g in draftStandardGroups" :key="g.id">
            <div
              class="catalog-item-card catalog-item-card-selectable"
              role="button"
              tabindex="0"
              @click="selectDraftStandard(g.id)"
              @keydown.enter="selectDraftStandard(g.id)"
            >
              <div>
                <div class="catalog-item-name" x-text="g.name"></div>
                <div class="catalog-item-meta" x-text="draftGroupMeta(g)"></div>
              </div>
              <span class="catalog-item-chevron" aria-hidden="true">›</span>
            </div>
          </template>
          <template x-if="draftSearch.trim() && draftProductMatches.length > 0">
            <div class="catalog-drawer-breadcrumb">
              <span class="text-xs font-medium">Matching malts</span>
            </div>
          </template>
          <template x-for="item in draftProductMatches" :key="item.id">
            <div class="catalog-item-card">
              <div>
                <div class="catalog-item-name">
                  <span x-text="item.name"></span>
                  <template x-if="isUserItem(item.id)">
                    <span class="status-badge status-badge-info text-nano">mine</span>
                  </template>
                </div>
                <div class="catalog-item-meta" x-text="draftItemMeta(item)"></div>
              </div>
              <div class="catalog-item-actions">
                <button
                  type="button"
                  class="btn-primary text-xs"
                  @click="addCatalogItem(item.id)"
                  :disabled="draftAtLimit"
                >
                  ＋ Add
                </button>
              </div>
            </div>
          </template>
          <template x-if="draftStandardGroups.length === 0 && draftProductMatches.length === 0">
            <div class="table-empty-cell" x-text="draftEmptyMessage"></div>
          </template>
        </div>
      </template>

      <template x-if="draftStandard">
        <div>
          <div class="catalog-drawer-breadcrumb">
            <button type="button" class="btn-link text-xs" @click="clearDraftStandard()">← All standards</button>
            <span class="text-xs font-medium" x-text="draftStandardName"></span>
          </div>
          <template x-for="item in draftVisibleCatalog" :key="item.id">
            <div class="catalog-item-card">
              <div>
                <div class="catalog-item-name">
                  <span x-text="item.name"></span>
                  <template x-if="item.id.startsWith('std:')">
                    <span class="status-badge status-badge-success text-nano">generic</span>
                  </template>
                  <template x-if="isUserItem(item.id)">
                    <span class="status-badge status-badge-info text-nano">mine</span>
                  </template>
                </div>
                <div class="catalog-item-meta" x-text="draftItemMeta(item)"></div>
              </div>
              <div class="catalog-item-actions">
                <button
                  type="button"
                  class="btn-primary text-xs"
                  @click="addCatalogItem(item.id)"
                  :disabled="draftAtLimit"
                >
                  ＋ Add
                </button>
              </div>
            </div>
          </template>
          <template x-if="draftFilteredCatalog.length === 0">
            <div class="table-empty-cell" x-text="draftEmptyDrilldownMessage"></div>
          </template>
        </div>
      </template>
    </div>
  </template>

  <template x-if="!draftHasStandard">
    <div class="catalog-drawer-list">
      <template x-for="item in draftVisibleCatalog" :key="item.id">
        <div class="catalog-item-card">
          <div>
            <div class="catalog-item-name">
              <span x-text="item.name"></span>
              <template x-if="isUserItem(item.id)">
                <span class="status-badge status-badge-info text-nano">mine</span>
              </template>
              <span
                class="status-badge status-badge-info text-nano"
                x-show="draftCounts[item.id] > 0"
              >
                <span x-text="draftCounts[item.id]"></span> in draft
              </span>
            </div>
            <div class="catalog-item-meta" x-text="draftItemMeta(item)"></div>
          </div>
          <div class="catalog-item-actions">
            <button
              type="button"
              class="btn-primary text-xs"
              @click="addCatalogItem(item.id)"
              :disabled="draftAtLimit"
            >
              ＋ Add
            </button>
          </div>
        </div>
      </template>
      <template x-if="draftFilteredCatalog.length === 0">
        <div class="table-empty-cell" x-text="draftEmptyMessage"></div>
      </template>
    </div>
  </template>
</div>
