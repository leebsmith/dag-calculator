<section class="step-card">
  <div class="step-card-header">
    <h2 class="card-title" x-text="activeStep.title"></h2>
    <p class="card-subtitle" x-show="activeStep.subtitle" x-text="activeStep.subtitle"></p>
  </div>

  <div class="step-card-content">
    <!-- Selected style readout -->
    <template x-if="selectedStyle">
      <div class="synthesized-card">
        <div class="synthesized-header">
          <span class="synthesized-title" x-text="selectedStyle.name + ' (' + selectedStyle.id + ')'"></span>
        </div>
        <div class="text-xs text-muted" x-text="selectedStyle.overall_impression"></div>
        <div class="text-xs text-muted" x-show="selectedStyle.comments" x-text="selectedStyle.comments"></div>
        <div class="step-grid-2col">
          <div class="form-group">
            <span class="form-label">Category</span>
            <span x-text="selectedStyle.category_name"></span>
          </div>
          <div class="form-group">
            <span class="form-label">Vital statistics (OG / FG)</span>
            <span
              class="tabular-nums"
              x-text="styleVitals(selectedStyle)"
            ></span>
          </div>
        </div>
      </div>
    </template>

    <!-- Recipe targets: fermentation navigator + color/bitterness sliders -->
    <div class="target-cards">
      <!-- Fermentation target picker (OE/AE region navigator) -->
      <template x-if="styleExtract && stylePreview">
        <div class="synthesized-card">
          <div class="synthesized-header">
            <h3 class="synthesized-title">Fermentation target</h3>
            <button type="button" class="btn btn-secondary text-xs" @click="resetScaleTarget()">
              Reset to style
            </button>
          </div>
          <div class="form-group">
            <label class="form-label" for="style-scale-pin">Scale pin</label>
            <select
              id="style-scale-pin"
              class="form-select"
              :value="scalePin"
              @change="setScalePin($event.target.value)"
            >
              <template x-for="opt in scalePinOptions" :key="opt.value">
                <option :value="opt.value" :selected="opt.value === scalePin" x-text="opt.label"></option>
              </template>
            </select>
            <span class="form-hint" x-text="activeScaleTargetLabel + ': ' + activeScaleTargetDisplay + ' ' + activeScaleTargetUnit"></span>
          </div>
          <template x-if="scalePin === 'abv'">
            <div class="form-group">
              <label class="form-label" for="style-target-abv">Target ABV (%)</label>
              <input
                id="style-target-abv"
                type="number"
                step="0.1"
                class="form-input"
                :min="fmt.formatWithDecimals(styleAbvBounds?.[0], 3, { dash: '0' })"
                :max="fmt.formatWithDecimals(styleAbvBounds?.[1], 3, { dash: '100' })"
                :value="fmt.formatWithDecimals(styleAbvTarget, 1)"
                :disabled="!styleAbvBounds"
                @change="setStyleTargetAbv($event.target)"
              />
              <span class="form-hint" x-show="styleAbvBounds">
                Clamped to the fixed-AA ray inside the style's feasible region.
              </span>
              <span class="form-hint" x-show="!styleAbvBounds">
                Select a yeast to set the target ABV.
              </span>
            </div>
          </template>
          <template x-if="scalePin !== 'abv'">
            <div class="form-group">
              <span class="form-label" x-text="activeScaleTargetLabel"></span>
              <span class="field-value" x-text="activeScaleTargetDisplay + ' ' + activeScaleTargetUnit"></span>
              <span class="form-hint">Edit this target in Late Additions. Style conflicts are warnings.</span>
            </div>
          </template>
          <div class="extract-picker">
            <svg
              class="extract-preview"
              :width="stylePreview.width"
              :height="stylePreview.height"
            >
              <polygon class="extract-region" :points="stylePreview.polygon" />
              <line
                x-show="stylePreview.ray"
                class="extract-ray"
                :x1="stylePreview.ray?.x1 ?? 0"
                :y1="stylePreview.ray?.y1 ?? 0"
                :x2="stylePreview.ray?.x2 ?? 0"
                :y2="stylePreview.ray?.y2 ?? 0"
              />
              <circle class="extract-safest" :cx="stylePreview.safest.x" :cy="stylePreview.safest.y" r="3" />
              <circle class="extract-marker" :cx="stylePreview.marker.x" :cy="stylePreview.marker.y" r="2.5" />
            </svg>
          </div>
          <span class="form-hint">OE and AE are solved readouts; the ray is shown only when ABV is the pin.</span>
          <div class="extract-readouts">
            <div class="extract-readout">
              <span class="form-label">OG (SG)</span>
              <span class="tabular-nums" x-text="fmt.formatGravity(styleTargetInfo?.og)"></span>
            </div>
            <div class="extract-readout">
              <span class="form-label">FG (SG)</span>
              <span class="tabular-nums" x-text="fmt.formatGravity(styleTargetInfo?.fg)"></span>
            </div>
            <div class="extract-readout">
              <span class="form-label">Apparent attenuation</span>
              <span class="tabular-nums" x-text="fmt.formatPercent(styleTargetInfo?.aa)"></span>
            </div>
            <div class="extract-readout">
              <span class="form-label">ABV</span>
              <span class="tabular-nums" x-text="fmt.formatPercentValue(styleTargetInfo?.abv)"></span>
            </div>
            <div class="extract-readout">
              <span class="form-label">Style safety</span>
              <span
                class="tabular-nums"
                x-text="fmt.formatPercentRounded(styleTargetRisk?.safety)"
              ></span>
            </div>
            <div class="extract-readout">
              <span class="form-label">Nearest limit</span>
              <span class="tabular-nums" x-text="styleTargetNearest()"></span>
            </div>
          </div>

        </div>
      </template>

      <!-- Color & bitterness targets (style-envelope bounded) -->
      <div class="synthesized-card">
        <div class="synthesized-header">
          <h3 class="synthesized-title">Color &amp; Bitterness targets</h3>
        </div>

        <div class="form-group">
          <label class="form-label" for="target-srm">
            <span>Target SRM</span>
            <span
              class="seed-badge"
              x-show="srmTargetProvenance.showSeed"
              :title="srmTargetProvenance.seedTitle"
            >seed</span>
            <button
              type="button"
              class="seed-reset"
              x-show="srmTargetProvenance.showReset"
              :title="srmTargetProvenance.resetTitle"
              @click="resetField(srmTargetField)"
            >↺</button>
          </label>
          <template x-if="styleSrmBounds">
            <div>
              <input
                type="range"
                class="target-slider"
                :min="styleSrmBounds[0]"
                :max="styleSrmBounds[1]"
                step="0.5"
                :value="targetSrm"
                @input="setTargetSrm($event.target.value)"
                id="target-srm"
                aria-label="Target SRM"
              />
              <div class="target-slider-readout">
                <span class="tabular-nums" x-text="fmt.formatWithDecimals(targetSrm, 0) + ' SRM'"></span>
                <span class="text-xs text-muted" x-text="'Style ' + fmt.formatRange(styleSrmBounds[0], styleSrmBounds[1]) + ' SRM'"></span>
              </div>
            </div>
          </template>
          <span class="form-hint" x-show="!styleSrmBounds">No SRM range in this style's envelope.</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="target-ibu">
            <span>Target IBU</span>
            <span
              class="seed-badge"
              x-show="ibuTargetProvenance.showSeed"
              :title="ibuTargetProvenance.seedTitle"
            >seed</span>
            <button
              type="button"
              class="seed-reset"
              x-show="ibuTargetProvenance.showReset"
              :title="ibuTargetProvenance.resetTitle"
              @click="resetField(ibuTargetField)"
            >↺</button>
          </label>
          <template x-if="styleIbuBounds">
            <div>
              <input
                type="range"
                class="target-slider"
                :min="styleIbuBounds[0]"
                :max="styleIbuBounds[1]"
                step="1"
                :value="targetIbu"
                @input="setTargetIbu($event.target.value)"
                id="target-ibu"
                aria-label="Target IBU"
              />
              <div class="target-slider-readout">
                <span class="tabular-nums" x-text="fmt.formatWithDecimals(targetIbu, 1) + ' IBU'"></span>
                <span class="text-xs text-muted" x-text="'Style ' + fmt.formatRange(styleIbuBounds[0], styleIbuBounds[1]) + ' IBU'"></span>
              </div>
            </div>
          </template>
          <span class="form-hint" x-show="!styleIbuBounds">No IBU range in this style's envelope.</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="whirlpool-fraction">Bitterness allocation</label>
          <input
            id="whirlpool-fraction"
            type="range"
            class="target-slider"
            min="0"
            max="1"
            step="0.01"
            :value="whirlpoolFraction"
            @input="setWhirlpoolFraction($event.target.value)"
            aria-label="Whirlpool share of IBUs"
          />
          <div class="target-slider-readout">
            <span class="tabular-nums text-xs" x-text="'Boil ' + boilIbuDisplay + ' IBU'"></span>
            <span class="tabular-nums text-xs" x-text="whirlpoolPctDisplay + '% whirlpool · ' + whirlpoolIbuDisplay + ' IBU'"></span>
          </div>
          <span class="form-hint">Left = all boil-kettle; right = all whirlpool.</span>
        </div>

        <div class="target-slider-readout">
          <span class="form-label">Planned IBU/GU</span>
          <span class="tabular-nums" x-text="ibuGuDisplay"></span>
        </div>
        <span class="form-hint">Bitterness balance: ≈0.5–1.0 is typical; higher is more bitter.</span>
      </div>
    </div>

    <!-- Style conformance (realized drift vs. the envelope) -->
    <template x-if="conformanceSummary">
      <div class="synthesized-card">
        <div class="synthesized-header">
          <h3 class="synthesized-title">Style conformance</h3>
          <span class="tabular-nums" x-text="'SAI ' + conformanceSummary.sai"></span>
        </div>
        <div class="extract-readouts">
          <template x-for="d in conformanceSummary.dimensions" :key="d.id">
            <div class="extract-readout">
              <span class="form-label" x-text="d.label"></span>
              <span
                class="tabular-nums"
                :class="{ 'text-warning': d.status !== 'Within' }"
                x-text="d.value + ' — ' + d.status"
              ></span>
            </div>
          </template>
        </div>
      </div>
    </template>

    <!-- Style envelope: the sealed declaration is read-only -->
    <div class="synthesized-card">
      <div class="synthesized-header">
        <h3 class="synthesized-title">Style envelope</h3>
      </div>
      <div class="form-group">
        <span class="form-label">
          <span>Fermentation</span>
        </span>
        <span
          class="field-value"
          x-text="fmt.optionLabel(fermentationField.optionLabels, fermentationField.value)"
        ></span>
      </div>
      <div class="step-grid-2col">
        <template x-for="row in styleEnvelopeFields" :key="row.id">
          <div class="form-group">
            <span class="form-label">
              <span x-text="row.field.label"></span>
            </span>
            <span class="field-value" x-text="row.field.display"></span>
          </div>
        </template>
      </div>
    </div>
  </div>
</section>
