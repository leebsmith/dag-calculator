<section class="card">
  <div class="card-header">
    <h2 class="card-title" x-text="activeStep.title"></h2>
    <p class="card-subtitle" x-show="activeStep.subtitle" x-text="activeStep.subtitle"></p>
  </div>

  <div class="card-body">
    <!-- Selected style readout -->
    <template x-if="selectedStyle">
      <section class="card-section">
        <div class="card-section-header">
          <span class="eyebrow" x-text="selectedStyle.name + ' (' + selectedStyle.id + ')'"></span>
        </div>
        <div class="text-xs text-muted" x-text="selectedStyle.overall_impression"></div>
        <div class="text-xs text-muted" x-show="selectedStyle.comments" x-text="selectedStyle.comments"></div>
        <div class="step-grid-2col">
          <div class="form-group">
            <span class="field-label">Category</span>
            <span x-text="selectedStyle.category_name"></span>
          </div>
          <div class="form-group">
            <span class="field-label">Vital statistics (OG / FG)</span>
            <span class="tabular-nums" x-text="styleVitals()"></span>
          </div>
          <div class="form-group">
            <span class="field-label">Fermentation</span>
            <span
              x-text="fmt.optionLabel(fermentationField.optionLabels, fermentationField.value)"
            ></span>
          </div>
        </div>
      </section>
    </template>

    <!-- Recipe targets: fermentation navigator + color/bitterness sliders -->
    <div class="target-cards">
      <!-- Fermentation target picker (OE/AE region navigator) -->
      <template x-if="stylePreview">
        <section class="card-section">
          <div class="card-section-header">
            <h3 class="eyebrow">Fermentation target</h3>
            <button type="button" class="btn btn-secondary btn-sm" @click="resetScaleTarget()">
              Reset to style
            </button>
          </div>
          <div
            x-data="formBuilder({
              schema: [
                {
                  id: 'style-scale-pin',
                  type: 'select',
                  label: 'Scale pin',
                  read: () => scalePin,
                  write: (value) => setScalePin(value),
                  options: () => scalePinOptions,
                  commit: 'change'
                }
              ]
            })"
          >
            <load src="src/partials/ui-form-fields.html" />
          </div>
          <div class="form-group">
            <label class="form-label" for="style-scale-target" x-text="activeScaleTargetLabel"></label>
            <div class="row-actions">
              <input
                id="style-scale-target"
                type="number"
                class="form-input"
                :step="activeScaleTargetStep"
                :value="inputDraft(inputKey('field', 'scale-target'), activeScaleTargetDisplay)"
                @input="editScaleTargetInput($event.target.value)"
                @change="commitScaleTargetInput($event.target.value)"
              />
              <span class="text-xs text-muted" x-text="activeScaleTargetUnit"></span>
            </div>
            <span class="form-hint">
              Free target. Style conflicts are warnings; the solver realizes the other two
              gravity/strength axes.
            </span>
            <span class="form-hint text-warning" x-show="scaleTargetMismatch" x-text="scaleTargetMismatch"></span>
          </div>
          <div class="extract-picker">
            <div class="extract-canvas">
            <template x-if="stylePreview.placeholder">
              <svg
                class="extract-preview"
                viewBox="0 0 376 366"
                x-effect="$el.setAttribute('viewBox', stylePreview.viewBox)"
                role="img"
                :aria-label="stylePreview.summary"
              >
                <text
                  class="extract-unsolved-msg"
                  :x="stylePreview.center.x"
                  :y="stylePreview.center.y"
                  text-anchor="middle"
                  dominant-baseline="central"
                  x-text="stylePreview.placeholder"
                ></text>
              </svg>
            </template>
            <template x-if="!stylePreview.placeholder">
              <svg
                class="extract-preview"
                viewBox="0 0 376 366"
                x-effect="$el.setAttribute('viewBox', stylePreview.viewBox)"
                role="img"
                :aria-label="stylePreview.summary"
              >
                <defs>
                  <clipPath id="ferment-space-plot">
                    <rect
                      :x="stylePreview.plot.x"
                      :y="stylePreview.plot.y"
                      :width="stylePreview.plot.w"
                      :height="stylePreview.plot.h"
                    />
                  </clipPath>
                </defs>
                <g clip-path="url(#ferment-space-plot)">
                  <path class="extract-contours" :d="stylePreview.contours" />
                  <polygon class="extract-region" :points="stylePreview.polygon" />
                  <path class="extract-band" :d="stylePreview.bandPath" />
                  <path class="extract-locus" :d="stylePreview.locus" />
                  <path class="extract-pin" :d="stylePreview.pinPath" />
                  <circle
                    class="extract-safest"
                    :cx="stylePreview.safest.x"
                    :cy="stylePreview.safest.y"
                    r="3"
                  />
                  <circle
                    class="extract-marker"
                    :cx="stylePreview.marker.x"
                    :cy="stylePreview.marker.y"
                    r="3.5"
                  />
                </g>
                <rect
                  class="extract-frame"
                  :x="stylePreview.plot.x"
                  :y="stylePreview.plot.y"
                  :width="stylePreview.plot.w"
                  :height="stylePreview.plot.h"
                />
                <path class="extract-ticks" :d="stylePreview.tickMarks" />
                <text class="extract-tick" :x="stylePreview.ticks.x[0].x" :y="stylePreview.ticks.x[0].y" text-anchor="middle" x-text="stylePreview.ticks.x[0].label"></text>
                <text class="extract-tick" :x="stylePreview.ticks.x[1].x" :y="stylePreview.ticks.x[1].y" text-anchor="middle" x-text="stylePreview.ticks.x[1].label"></text>
                <text class="extract-tick" :x="stylePreview.ticks.x[2].x" :y="stylePreview.ticks.x[2].y" text-anchor="middle" x-text="stylePreview.ticks.x[2].label"></text>
                <text class="extract-tick" :x="stylePreview.ticks.x[3].x" :y="stylePreview.ticks.x[3].y" text-anchor="middle" x-text="stylePreview.ticks.x[3].label"></text>
                <text class="extract-tick" :x="stylePreview.ticks.x[4].x" :y="stylePreview.ticks.x[4].y" text-anchor="middle" x-text="stylePreview.ticks.x[4].label"></text>
                <text class="extract-tick" :x="stylePreview.ticks.y[0].x" :y="stylePreview.ticks.y[0].y" text-anchor="end" x-text="stylePreview.ticks.y[0].label"></text>
                <text class="extract-tick" :x="stylePreview.ticks.y[1].x" :y="stylePreview.ticks.y[1].y" text-anchor="end" x-text="stylePreview.ticks.y[1].label"></text>
                <text class="extract-tick" :x="stylePreview.ticks.y[2].x" :y="stylePreview.ticks.y[2].y" text-anchor="end" x-text="stylePreview.ticks.y[2].label"></text>
                <text class="extract-tick" :x="stylePreview.ticks.y[3].x" :y="stylePreview.ticks.y[3].y" text-anchor="end" x-text="stylePreview.ticks.y[3].label"></text>
                <text class="extract-tick" :x="stylePreview.ticks.y[4].x" :y="stylePreview.ticks.y[4].y" text-anchor="end" x-text="stylePreview.ticks.y[4].label"></text>
                <text
                  class="extract-axis"
                  :x="stylePreview.axes.y.x"
                  :y="stylePreview.axes.y.y"
                  :text-anchor="stylePreview.axes.y.anchor"
                  :transform="stylePreview.axes.y.transform"
                  x-text="stylePreview.axes.y.label"
                ></text>
                <text
                  class="extract-axis"
                  :x="stylePreview.axes.x.x"
                  :y="stylePreview.axes.x.y"
                  :text-anchor="stylePreview.axes.x.anchor"
                  x-text="stylePreview.axes.x.label"
                ></text>
                <text
                  class="extract-pin-label"
                  :x="stylePreview.pinLabelX"
                  :y="stylePreview.pinLabelY"
                  :text-anchor="stylePreview.pinLabelAnchor"
                  x-text="stylePreview.pinLabel"
                ></text>
              </svg>
            </template>
            <div
              class="extract-overlay"
              x-show="!stylePreview.placeholder"
              aria-hidden="true"
            >
              <template x-for="label in stylePreview.contourLabels" :key="label.key">
                <span class="extract-contour-label" :style="label.style" x-text="label.text"></span>
              </template>
            </div>
            </div>
          </div>
          <span class="form-hint" x-show="!stylePreview.placeholder">
            The dot is this batch. Contours are ABV; the line is this grain bill at every
            size. OG reads off the horizontal axis, FG off the vertical; the axes are not
            to equal scale.
          </span>
          <div class="extract-readouts">
            <div class="extract-readout">
              <span class="field-label">OG</span>
              <span class="tabular-nums" x-text="styleGravityReadouts.og"></span>
            </div>
            <div class="extract-readout">
              <span class="field-label">FG</span>
              <span class="tabular-nums" x-text="styleGravityReadouts.fg"></span>
            </div>
            <div class="extract-readout">
              <span class="field-label">Apparent attenuation</span>
              <span class="tabular-nums" x-text="fmt.formatPercent(attenuationBlend)"></span>
            </div>
            <div class="extract-readout">
              <span class="field-label">ABV</span>
              <span class="tabular-nums" x-text="fmt.formatPercentValue(styleTargetInfo?.abv)"></span>
            </div>
            <div class="extract-readout">
              <span class="field-label">Style safety</span>
              <span
                class="tabular-nums"
                x-text="fmt.formatPercentRounded(styleTargetRisk?.safety)"
              ></span>
            </div>
            <div class="extract-readout">
              <span class="field-label">Nearest limit</span>
              <span class="tabular-nums" x-text="styleTargetNearest()"></span>
            </div>
          </div>
          <span class="form-hint">
            Apparent attenuation is the realized outcome from the grain bill and the yeast
            cap set in the Yeast step.
          </span>
        </section>
      </template>

      <!-- Color & bitterness targets (style-envelope bounded) -->
      <section class="card-section">
        <div class="card-section-header">
          <h3 class="eyebrow">Color &amp; Bitterness targets</h3>
        </div>

        <div
          x-data="formBuilder({
            schema: [
              {
                id: 'target-srm',
                type: 'range',
                label: 'Target SRM',
                min: () => styleSrmSliderBounds?.[0],
                max: () => styleSrmSliderBounds?.[1],
                step: 0.5,
                when: () => Boolean(styleSrmSliderBounds),
                read: () => targetSrm,
                write: (value) => setTargetSrm(value),
                commit: 'input',
                readout: () => srmTargetDisplay,
                hint: () => styleSrmHint,
                badge: () => (srmTargetProvenance.showSeed
                  ? { text: 'seed', title: srmTargetProvenance.seedTitle }
                  : null),
                reset: () => ({
                  show: srmTargetProvenance.showReset,
                  title: srmTargetProvenance.resetTitle,
                  run: () => resetField(srmTargetField)
                }),
                warning: () => (srmTargetOutside ? srmTargetNote : null)
              }
            ]
          })"
        >
          <load src="src/partials/ui-form-fields.html" />
          <span class="form-hint" x-show="!styleSrmSliderBounds">No SRM range in this style's envelope.</span>
        </div>

        <div
          x-data="formBuilder({
            schema: [
              {
                id: 'target-ibu',
                type: 'range',
                label: 'Target IBU',
                min: () => styleIbuSliderBounds?.[0],
                max: () => styleIbuSliderBounds?.[1],
                step: 1,
                when: () => Boolean(styleIbuSliderBounds),
                read: () => targetIbu,
                write: (value) => setTargetIbu(value),
                commit: 'input',
                readout: () => fmt.formatWithDecimals(targetIbu, 1) + ' IBU',
                hint: () => (styleIbuBounds
                  ? 'Style ' + fmt.formatRange(styleIbuBounds[0], styleIbuBounds[1]) + ' IBU'
                  : ''),
                badge: () => (ibuTargetProvenance.showSeed
                  ? { text: 'seed', title: ibuTargetProvenance.seedTitle }
                  : null),
                reset: () => ({
                  show: ibuTargetProvenance.showReset,
                  title: ibuTargetProvenance.resetTitle,
                  run: () => resetField(ibuTargetField)
                }),
                warning: () => (ibuTargetOutside ? ibuTargetNote : null)
              }
            ]
          })"
        >
          <load src="src/partials/ui-form-fields.html" />
          <span class="form-hint" x-show="!styleIbuSliderBounds">No IBU range in this style's envelope.</span>
        </div>

        <div
          x-data="formBuilder({
            schema: [
              {
                id: 'whirlpool-fraction',
                type: 'range',
                label: 'Bitterness allocation',
                min: 0,
                max: 1,
                step: 0.01,
                read: () => whirlpoolFraction,
                write: (value) => setWhirlpoolFraction(value),
                commit: 'input',
                readout: () => 'Boil ' + boilIbuDisplay + ' IBU · ' + whirlpoolPctDisplay + '% whirlpool · ' + whirlpoolIbuDisplay + ' IBU',
                hint: 'Left = all boil-kettle; right = all whirlpool.'
              }
            ]
          })"
        >
          <load src="src/partials/ui-form-fields.html" />
        </div>

        <div class="target-slider-readout">
          <span class="field-label">Planned IBU/GU</span>
          <span class="tabular-nums" x-text="ibuGuDisplay"></span>
        </div>
        <span class="form-hint">Bitterness balance: ≈0.5–1.0 is typical; higher is more bitter.</span>
      </section>
    </div>

    <!-- Style conformance (realized drift vs. the envelope) -->
    <template x-if="conformanceSummary">
      <section class="card-section">
        <div class="card-section-header">
          <h3 class="eyebrow">Style conformance</h3>
          <span class="tabular-nums" x-text="'SAI ' + conformanceSummary.sai"></span>
        </div>
        <div class="extract-readouts">
          <template x-for="d in conformanceSummary.dimensions" :key="d.id">
            <div class="extract-readout">
              <span class="field-label" x-text="d.label"></span>
              <span
                class="tabular-nums"
                :class="{ 'text-warning': d.status !== 'Within' }"
                x-text="d.value + ' — ' + d.status"
              ></span>
            </div>
          </template>
        </div>
      </section>
    </template>

    <!-- Style envelope: the sealed declaration is read-only -->
    <section class="card-section">
      <div class="card-section-header">
        <h3 class="eyebrow">Style envelope</h3>
      </div>
      <div
        class="step-grid-2col"
        x-data="formBuilder({
          schema: styleEnvelopeFields.map((row, index) => ({
            id: row.id,
            type: 'readout',
            label: () => styleEnvelopeFields[index]?.field.label || '',
            read: () => {
              const field = styleEnvelopeFields[index]?.field;
              if (!field) return '';
              return field.toggleable && field.unit
                ? field.display + ' ' + field.unit
                : field.display;
            }
          }))
        })"
      >
        <load src="src/partials/ui-form-fields.html" />
      </div>
    </section>
  </div>
</section>
