<section class="step-card">
  <div class="step-card-header">
    <h2 class="card-title" x-text="activeStep.title"></h2>
    <p class="card-subtitle" x-show="activeStep.subtitle" x-text="activeStep.subtitle"></p>
  </div>

  <div class="step-card-content">
    <!-- Style source gate -->
    <div class="form-group">
      <label class="form-label">Style source</label>
      <select
        class="form-select"
        :value="styleSourceModel.value"
        @change="edit(styleSourceModel, $event.target.value)"
      >
        <option value="styleguide" :selected="styleSourceModel.value === 'styleguide'">Style guide</option>
        <option value="experimental" :selected="styleSourceModel.value === 'experimental'">Experimental</option>
      </select>
    </div>

    <!-- Styleguide picker -->
    <template x-if="styleSource === 'styleguide'">
      <div>
        <div class="step-grid-2col">
          <div class="form-group">
            <label class="form-label">Search by name, number, or category</label>
            <input
              type="text"
              class="form-input"
              placeholder="e.g. IPA, 21A, lager"
              x-model="styleSearchQuery"
            />
          </div>
          <div class="form-group">
            <label class="form-label">Category</label>
            <select class="form-select" x-model="styleCategoryFilter">
              <option value="">All categories</option>
              <template x-for="c in styleCategories" :key="c">
                <option :value="c" x-text="c"></option>
              </template>
            </select>
          </div>
        </div>

        <div class="filter-pills-container">
          <template x-for="s in styleStrengths" :key="'s-' + s">
            <button
              type="button"
              class="filter-pill"
              :class="{ 'is-active': styleStrengthFilter === s }"
              @click="toggleStyleStrength(s)"
              x-text="s"
            ></button>
          </template>
          <template x-for="c in styleColors" :key="'c-' + c">
            <button
              type="button"
              class="filter-pill"
              :class="{ 'is-active': styleColorFilter === c }"
              @click="toggleStyleColor(c)"
              x-text="c"
            ></button>
          </template>
          <template x-for="f in styleFermentations" :key="'f-' + f">
            <button
              type="button"
              class="filter-pill"
              :class="{ 'is-active': styleFermentationFilter === f }"
              @click="toggleStyleFermentation(f)"
              x-text="f"
            ></button>
          </template>
        </div>

        <div
          class="catalog-result-counter"
          aria-live="polite"
          x-text="styleResultLabel"
        ></div>

        <div class="data-table-container data-table-container-scroll">
          <table class="data-table is-fixed">
            <colgroup>
              <col style="width: 34%;" />
              <col style="width: 24%;" />
              <col style="width: 14%;" />
              <col style="width: 14%;" />
              <col style="width: 14%;" />
            </colgroup>
            <thead>
              <tr>
                <th>Style</th>
                <th>Category</th>
                <th class="text-right">OG</th>
                <th class="text-right">FG</th>
                <th class="text-right">Action</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="s in visibleStyles" :key="s.id">
                <tr :class="{ 'is-selected': selectedStyleId === s.id }">
                  <td>
                    <span class="font-medium" x-text="s.name"></span>
                    <span class="text-xs text-muted" x-text="' ' + s.id"></span>
                  </td>
                  <td x-text="s.category_name"></td>
                  <td class="text-right tabular-nums" x-text="fmt.formatGravityRange(s.og_min, s.og_max)"></td>
                  <td class="text-right tabular-nums" x-text="fmt.formatGravityRange(s.fg_min, s.fg_max)"></td>
                  <td class="table-action-cell">
                    <button type="button" class="btn btn-secondary text-xs" @click="selectStyle(s.id)">
                      Use
                    </button>
                  </td>
                </tr>
              </template>
              <template x-if="filteredStyles.length === 0">
                <tr>
                  <td colspan="5" class="table-empty-cell">No styles match the current filters.</td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </template>

    <!-- Selected style readout -->
    <template x-if="selectedStyle">
      <div class="synthesized-card">
        <div class="synthesized-header">
          <span class="synthesized-title" x-text="selectedStyle.name + ' (' + selectedStyle.id + ')'"></span>
          <button type="button" class="btn btn-secondary text-xs" @click="clearStyleSelection()">
            Clear
          </button>
        </div>
        <div class="text-xs text-muted" x-text="selectedStyle.overall_impression"></div>
        <div class="text-xs text-muted" x-show="selectedStyle.comments" x-text="selectedStyle.comments"></div>
        <div class="step-grid-2col">
          <div class="form-group">
            <span class="form-label">Category</span>
            <span x-text="selectedStyle.category_name"></span>
          </div>
          <div class="form-group">
            <span class="form-label">Vital statistics (OG / FG)</span>
            <span
              class="tabular-nums"
              x-text="styleVitals(selectedStyle)"
            ></span>
          </div>
        </div>
      </div>
    </template>

    <!-- Recipe targets: fermentation navigator + color/bitterness sliders -->
    <div class="target-cards">
      <!-- Fermentation target picker (OE/AE region navigator) -->
      <template x-if="styleExtract && stylePreview">
        <div class="synthesized-card">
          <div class="synthesized-header">
            <h3 class="synthesized-title">Fermentation target</h3>
            <button type="button" class="btn btn-secondary text-xs" @click="resetStyleTarget()">
              Reset to centroid
            </button>
          </div>
          <div class="extract-picker">
            <input
              type="range"
              class="extract-slider extract-slider-ae"
              :min="fmt.formatWithDecimals(styleAeBounds?.[0], 3, { dash: '0' })"
              :max="fmt.formatWithDecimals(styleAeBounds?.[1], 3, { dash: '1' })"
              step="0.01"
              :value="styleExtract.ae"
              @input="setStyleTargetAe($event.target.value)"
              aria-label="Apparent extract (degrees Plato)"
            />
            <svg
              class="extract-preview"
              :width="stylePreview.width"
              :height="stylePreview.height"
            >
              <polygon class="extract-region" :points="stylePreview.polygon" />
              <circle class="extract-safest" :cx="stylePreview.safest.x" :cy="stylePreview.safest.y" r="3" />
              <circle class="extract-marker" :cx="stylePreview.marker.x" :cy="stylePreview.marker.y" r="2.5" />
            </svg>
            <input
              type="range"
              class="extract-slider extract-slider-oe"
              :min="fmt.formatWithDecimals(styleOeBounds?.[0], 3, { dash: '0' })"
              :max="fmt.formatWithDecimals(styleOeBounds?.[1], 3, { dash: '1' })"
              step="0.01"
              :value="styleExtract.oe"
              @input="setStyleTargetOe($event.target.value)"
              aria-label="Original extract (degrees Plato)"
            />
          </div>
          <span class="form-hint">AE (vertical) and OE (horizontal) in °P, constrained to the style's feasible region.</span>
          <div class="extract-readouts">
            <div class="extract-readout">
              <span class="form-label">OG (SG)</span>
              <span class="tabular-nums" x-text="fmt.formatGravity(styleTargetInfo?.og)"></span>
            </div>
            <div class="extract-readout">
              <span class="form-label">FG (SG)</span>
              <span class="tabular-nums" x-text="fmt.formatGravity(styleTargetInfo?.fg)"></span>
            </div>
            <div class="extract-readout">
              <span class="form-label">Apparent attenuation</span>
              <span class="tabular-nums" x-text="fmt.formatPercent(styleTargetInfo?.aa)"></span>
            </div>
            <div class="extract-readout">
              <span class="form-label">ABV</span>
              <span class="tabular-nums" x-text="fmt.formatPercentValue(styleTargetInfo?.abv)"></span>
            </div>
            <div class="extract-readout">
              <span class="form-label">Style safety</span>
              <span
                class="tabular-nums"
                x-text="fmt.formatPercentRounded(styleTargetRisk?.safety)"
              ></span>
            </div>
            <div class="extract-readout">
              <span class="form-label">Nearest limit</span>
              <span class="tabular-nums" x-text="styleTargetNearest()"></span>
            </div>
          </div>
        </div>
      </template>

      <!-- Color & bitterness targets (style-envelope bounded) -->
      <div class="synthesized-card">
        <div class="synthesized-header">
          <h3 class="synthesized-title">Color &amp; Bitterness targets</h3>
        </div>

        <div class="form-group">
          <label class="form-label">
            <span>Target SRM</span>
            <span
              class="seed-badge"
              x-show="srmTargetProvenance.showSeed"
              :title="srmTargetProvenance.seedTitle"
            >seed</span>
            <button
              type="button"
              class="seed-reset"
              x-show="srmTargetProvenance.showReset"
              :title="srmTargetProvenance.resetTitle"
              @click="resetField(srmTargetField)"
            >↺</button>
          </label>
          <template x-if="styleSrmBounds">
            <div>
              <input
                type="range"
                class="target-slider"
                :min="styleSrmBounds[0]"
                :max="styleSrmBounds[1]"
                step="0.5"
                :value="targetSrm"
                @input="setTargetSrm($event.target.value)"
                aria-label="Target SRM"
              />
              <div class="target-slider-readout">
                <span class="tabular-nums" x-text="fmt.formatWithDecimals(targetSrm, 0) + ' SRM'"></span>
                <span class="text-xs text-muted" x-text="'Style ' + fmt.formatRange(styleSrmBounds[0], styleSrmBounds[1]) + ' SRM'"></span>
              </div>
            </div>
          </template>
          <span class="form-hint" x-show="!styleSrmBounds">No SRM range in this style's envelope.</span>
        </div>

        <div class="form-group">
          <label class="form-label">
            <span>Target IBU</span>
            <span
              class="seed-badge"
              x-show="ibuTargetProvenance.showSeed"
              :title="ibuTargetProvenance.seedTitle"
            >seed</span>
            <button
              type="button"
              class="seed-reset"
              x-show="ibuTargetProvenance.showReset"
              :title="ibuTargetProvenance.resetTitle"
              @click="resetField(ibuTargetField)"
            >↺</button>
          </label>
          <template x-if="styleIbuBounds">
            <div>
              <input
                type="range"
                class="target-slider"
                :min="styleIbuBounds[0]"
                :max="styleIbuBounds[1]"
                step="1"
                :value="targetIbu"
                @input="setTargetIbu($event.target.value)"
                aria-label="Target IBU"
              />
              <div class="target-slider-readout">
                <span class="tabular-nums" x-text="fmt.formatWithDecimals(targetIbu, 1) + ' IBU'"></span>
                <span class="text-xs text-muted" x-text="'Style ' + fmt.formatRange(styleIbuBounds[0], styleIbuBounds[1]) + ' IBU'"></span>
              </div>
            </div>
          </template>
          <span class="form-hint" x-show="!styleIbuBounds">No IBU range in this style's envelope.</span>
        </div>

        <div class="form-group">
          <label class="form-label">Bitterness allocation</label>
          <input
            type="range"
            class="target-slider"
            min="0"
            max="1"
            step="0.01"
            :value="whirlpoolFraction"
            @input="setWhirlpoolFraction($event.target.value)"
            aria-label="Whirlpool share of IBUs"
          />
          <div class="target-slider-readout">
            <span class="tabular-nums text-xs" x-text="'Boil ' + boilIbuDisplay + ' IBU'"></span>
            <span class="tabular-nums text-xs" x-text="whirlpoolPctDisplay + '% whirlpool · ' + whirlpoolIbuDisplay + ' IBU'"></span>
          </div>
          <span class="form-hint">Left = all boil-kettle; right = all whirlpool.</span>
        </div>

        <div class="target-slider-readout">
          <span class="form-label">Planned IBU/GU</span>
          <span class="tabular-nums" x-text="ibuGuDisplay"></span>
        </div>
        <span class="form-hint">Bitterness balance: ≈0.5–1.0 is typical; higher is more bitter.</span>
      </div>
    </div>

    <!-- Style conformance (realized drift vs. the envelope) -->
    <template x-if="conformanceSummary">
      <div class="synthesized-card">
        <div class="synthesized-header">
          <h3 class="synthesized-title">Style conformance</h3>
          <span class="tabular-nums" x-text="'SAI ' + conformanceSummary.sai"></span>
        </div>
        <div class="extract-readouts">
          <template x-for="d in conformanceSummary.dimensions" :key="d.id">
            <div class="extract-readout">
              <span class="form-label" x-text="d.label"></span>
              <span
                class="tabular-nums"
                :class="{ 'text-warning': d.status !== 'Within' }"
                x-text="d.value + ' — ' + d.status"
              ></span>
            </div>
          </template>
        </div>
      </div>
    </template>

    <!-- Style envelope (editable in both modes) -->
    <div class="synthesized-card">
      <div class="synthesized-header">
        <h3 class="synthesized-title">Style envelope</h3>
      </div>
      <div class="form-group">
        <label class="form-label">
          <span>Fermentation</span>
          <span
            class="seed-badge"
            x-show="fermentationProvenance.showSeed"
            :title="fermentationProvenance.seedTitle"
          >seed</span>
          <button
            type="button"
            class="seed-reset"
            x-show="fermentationProvenance.showReset"
            :title="fermentationProvenance.resetTitle"
            @click="resetField(fermentationField)"
          >↺</button>
        </label>
        <select
          class="form-select"
          :value="fermentationField.value"
          @change="edit(fermentationField, $event.target.value)"
        >
          <template x-for="opt in styleFermentations" :key="opt">
            <option :value="opt" :selected="opt === fermentationField.value" x-text="opt"></option>
          </template>
        </select>
      </div>
      <div class="step-grid-2col">
        <template x-for="row in styleEnvelopeFields" :key="row.id">
          <div class="form-group">
            <label class="form-label">
              <span x-text="row.field.label"></span>
              <span
                class="seed-badge"
                x-show="row.provenance.showSeed"
                :title="row.provenance.seedTitle"
              >seed</span>
              <button
                type="button"
                class="seed-reset"
                x-show="row.provenance.showReset"
                :title="row.provenance.resetTitle"
                @click="resetField(row.field)"
              >↺</button>
            </label>
            <input
              type="number"
              :step="row.step"
              class="form-input tabular-nums"
              :value="row.field.display"
              @input="edit(row.field, $event.target.value)"
              @change="commitField(row.field)"
            />
          </div>
        </template>
      </div>
    </div>
  </div>
</section>
