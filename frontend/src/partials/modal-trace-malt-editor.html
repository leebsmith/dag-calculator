<!-- Trace Malt Editor (workspace modal): definite-mass rows + catalog / inspector drawers -->
<div
  class="modal-backdrop"
  x-show="traceEditorOpen"
  @click.self="cancelTraceEditor()"
  @keydown.escape.window="handleTraceEscape()"
>
  <div
    class="modal-dialog modal-dialog-workspace"
    role="dialog"
    aria-modal="true"
    aria-labelledby="trace-malt-editor-title"
    tabindex="-1"
    x-effect="dialogFocus($el, traceEditorOpen)"
  >
    <div class="modal-workspace-header">
      <div class="modal-workspace-header-title">
        <h2 class="modal-workspace-title" id="trace-malt-editor-title">Trace Malt Editor</h2>
        <span class="status-badge badge-info text-xs" x-text="traceDraftMassDisplay"></span>
      </div>
      <div class="modal-workspace-header-actions">
        <button type="button" class="btn-outline text-xs" @click="cancelTraceEditor()">Cancel</button>
        <button type="button" class="btn-primary text-xs" @click="saveTraceEditor()">Save &amp; Apply</button>
      </div>
    </div>

    <div class="modal-workspace-body">
      <div class="modal-workspace-main">
        <load src="src/partials/draft-table.html" />
      </div>

      <div
        class="modal-drawer-scrim"
        x-show="traceDrawer !== null"
        x-transition.opacity.duration.200ms
        @click="closeTraceDrawer()"
      ></div>

      <div
        class="modal-workspace-drawer"
        id="trace-drawer"
        x-show="traceDrawer !== null"
        x-transition:enter="modal-drawer-enter"
        x-transition:enter-start="modal-drawer-enter-start"
        x-transition:enter-end="modal-drawer-enter-end"
        x-transition:leave="modal-drawer-leave"
        x-transition:leave-start="modal-drawer-leave-start"
        x-transition:leave-end="modal-drawer-leave-end"
      >
        <div class="modal-drawer-header">
          <h3
            class="section-title"
            x-text="traceDrawer === 'search' ? 'Malt Catalog Browser' : 'Trace Malt Inspector'"
          ></h3>
          <button type="button" class="btn-close text-xs" @click="closeTraceDrawer()">✕</button>
        </div>

        <div class="modal-drawer-body" :class="{ 'modal-drawer-body-pinned': traceDrawer === 'search' }">
          <template x-if="draftDrawer === 'search'">
            <load src="src/partials/draft-search-pane.html" />
          </template>

          <template x-if="traceDrawer === 'inspect'">
            <template x-if="traceActiveRow">
              <div class="inspector-form">
                <div class="form-group">
                  <label class="form-label text-xs" for="trace-row-name">Malt name</label>
                  <input
                    id="trace-row-name"
                    type="text"
                    class="form-input text-xs"
                    :value="traceActiveRow.name"
                    @input="setMaltField(traceActiveIndex, 'name', $event.target.value)"
                  />
                </div>
                <div class="form-group">
                  <label class="form-label text-xs" for="trace-row-category">Category</label>
                  <select
                    id="trace-row-category"
                    class="form-select text-xs"
                    :value="traceActiveRow.category"
                    @change="setMaltField(traceActiveIndex, 'category', $event.target.value)"
                  >
                    <template x-for="c in maltCategories" :key="c">
                      <option :value="c" :selected="c === traceActiveRow.category" x-text="c"></option>
                    </template>
                  </select>
                </div>
                <div class="inspector-grid-2col">
                  <div class="form-group">
                    <label class="form-label text-xs" for="trace-row-yield">Extract yield (%)</label>
                    <input
                      id="trace-row-yield"
                      type="number"
                      step="1"
                      min="0"
                      max="100"
                      class="form-input text-xs"
                      :value="fmt.toPercentValue(traceActiveRow.yield_fraction, 0)"
                      @change="setMaltField(traceActiveIndex, 'yield_fraction', $event.target.value, 0.01)"
                    />
                  </div>
                  <div class="form-group">
                    <label class="form-label text-xs" for="trace-row-color" x-text="'Color (' + colorUnit() + ')'"></label>
                    <input
                      id="trace-row-color"
                      type="number"
                      step="0.1"
                      min="0"
                      class="form-input text-xs"
                      :value="colorDisplay(traceActiveRow.color_lovibond)"
                      @change="setColorField(traceActiveIndex, $event.target.value)"
                    />
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label text-xs" for="trace-row-notes">Notes</label>
                  <textarea
                    id="trace-row-notes"
                    class="form-input text-xs"
                    rows="3"
                    :value="traceActiveRow.notes ?? ''"
                    @input="setMaltField(traceActiveIndex, 'notes', $event.target.value)"
                  ></textarea>
                </div>
              </div>
            </template>
          </template>
        </div>
      </div>
    </div>

    <load src="src/partials/draft-discard-confirm.html" />
  </div>
</div>
