<section class="wall-drawer" id="wall-drawer" x-show="drawerOpen" aria-label="Notes and checklist">
  <header class="wall-drawer-header">
    <h2 class="wall-drawer-title" x-text="drawerTitle"></h2>
    <span
      class="wall-drawer-hint truncate"
      x-show="drawerTab === 'notes'"
      title="Markdown supported: paragraphs, lists, tables, emphasis, links, and code. Blank lines separate paragraphs."
    >Markdown supported: paragraphs, lists, tables, emphasis, links, and code.</span>
    <button type="button" class="btn-link text-xs" @click="closeDrawer()">Close</button>
  </header>

  <div class="wall-drawer-body">
    <div x-show="drawerTab === 'notes'" role="tabpanel" aria-label="Notes" class="notes-list">
      <details class="notes-disclosure" name="drawer-notes">
        <summary>
          <span class="region-title">Discussion</span>
          <span class="notes-preview truncate" x-text="drawerPreview(discussion)"></span>
        </summary>
        <div class="notes-body" x-data="formBuilder" data-schema="discussionFields">
          <load src="src/partials/ui-form-fields.html" />
          <template x-for="issue in proseIssues(discussion)" :key="issue.code">
            <p class="form-hint text-warning" x-text="issue.message"></p>
          </template>
        </div>
      </details>

      <details class="notes-disclosure" name="drawer-notes">
        <summary>
          <span class="region-title">Hop strategy</span>
          <span class="notes-preview truncate" x-text="drawerPreview(hopStrategy)"></span>
        </summary>
        <div class="notes-body" x-data="formBuilder" data-schema="hopStrategyFields">
          <load src="src/partials/ui-form-fields.html" />
          <template x-for="issue in proseIssues(hopStrategy)" :key="issue.code">
            <p class="form-hint text-warning" x-text="issue.message"></p>
          </template>
        </div>
      </details>

      <details class="notes-disclosure" name="drawer-notes">
        <summary>
          <span class="region-title">Fermentation strategy</span>
          <span class="notes-preview truncate" x-text="drawerPreview(fermentationStrategy)"></span>
        </summary>
        <div class="notes-body" x-data="formBuilder" data-schema="fermentationStrategyFields">
          <load src="src/partials/ui-form-fields.html" />
          <template x-for="issue in proseIssues(fermentationStrategy)" :key="issue.code">
            <p class="form-hint text-warning" x-text="issue.message"></p>
          </template>
        </div>
      </details>

      <details class="notes-disclosure" name="drawer-notes">
        <summary>
          <span class="region-title">Process notes</span>
          <span class="notes-preview truncate" x-text="drawerPreview(processNotes)"></span>
        </summary>
        <div class="notes-body" x-data="formBuilder" data-schema="processNotesFields">
          <load src="src/partials/ui-form-fields.html" />
          <template x-for="issue in proseIssues(processNotes)" :key="issue.code">
            <p class="form-hint text-warning" x-text="issue.message"></p>
          </template>
        </div>
      </details>
    </div>

    <div x-show="drawerTab === 'checklist'" role="tabpanel" aria-label="Checklist">
      <load src="src/partials/step-brew-day.html" />
    </div>
  </div>
</section>
