<div class="chooser">
  <header class="menu-bar">
    <span class="menu-title">Brewing Calculator</span>
    <div class="menu-actions">
      <button type="button" class="btn-outline" @click="openLibrary()">Library</button>
      <span class="auth-user">
        <span x-text="$store.auth.user.email || ''"></span>
        <button type="button" class="btn-link" @click="$store.auth.signOut()">Sign out</button>
      </span>
    </div>
  </header>

  <div
    class="chooser-body"
    @scroll="$store.recipes.closeRowMenu(); $store.recipes.closeSort()"
  >
    <div class="alert alert-warning" x-show="$store.recipes.loadError">
      <div class="alert-header">
        <span class="alert-dot"></span>
        <span>Couldn't reach the server</span>
      </div>
      <p>Your batches couldn't be loaded.</p>
      <button type="button" class="btn-outline" @click="$store.recipes.retryLoad()">Retry</button>
    </div>

    <div class="landing">
      <div class="landing-page">
        <section class="landing-library">
          <div class="landing-section-bar">
            <h2 class="landing-heading">Batches</h2>
            <button
              type="button"
              class="btn-primary"
              :disabled="!$store.recipes.canCreateBatch"
              @click="$store.recipes.newBatch()"
            >New batch</button>
          </div>

          <div class="alert alert-warning" x-show="!$store.recipes.canCreateBatch">
            <div class="alert-header">
              <span class="alert-dot"></span>
              <span>A batch needs one of each: style, rig, and water source</span>
            </div>
            <p>
              Missing:
              <span x-text="$store.recipes.prerequisites.missing.join(', ')"></span>.
              Add them in the Library's Sources section, then come back.
            </p>
            <button type="button" class="btn-outline" @click="openLibrary()">Open Library</button>
          </div>

          <div class="landing-section-bar">
            <div class="filter-pills-container">
              <template x-for="s in [['all', 'All'], ['drafts', 'Drafts'], ['frozen', 'Frozen'], ['trash', 'Trash']]" :key="s[0]">
                <button
                  type="button"
                  class="filter-pill"
                  :class="{ 'is-active': $store.recipes.scope === s[0] }" :aria-pressed="($store.recipes.scope === s[0]) ? 'true' : 'false'"
                  @click="$store.recipes.setScope(s[0])"
                  x-text="s[1]"
                ></button>
              </template>
            </div>
            <button
              type="button"
              class="btn-outline landing-sort-btn"
              @click.stop="$store.recipes.toggleSort($event)"
            >
              <span x-text="'Sort: ' + $store.recipes.sortLabel"></span>
              <span aria-hidden="true">▾</span>
            </button>
          </div>

          <div class="landing-table-wrap" x-show="$store.recipes.rows.length">
            <table class="landing-table">
              <thead>
                <tr>
                  <th scope="col">Title</th>
                  <th scope="col">Style</th>
                  <th scope="col">Rig</th>
                  <th scope="col">Water</th>
                  <th scope="col">Status</th>
                  <th scope="col" class="landing-col-date">Updated</th>
                  <th scope="col" class="landing-col-actions" aria-label="Actions"></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="b in $store.recipes.rows" :key="b.id">
                  <tr>
                    <td class="landing-col-title">
                      <template x-if="$store.recipes.renamingId === b.id">
                        <input
                          class="landing-rename"
                          type="text"
                          :value="$store.recipes.renameValue"
                          @input="$store.recipes.setRenameValue($event.target.value)"
                          @keydown.enter.prevent="$store.recipes.commitRename(b)"
                          @keydown.escape.prevent="$store.recipes.cancelRename()"
                          @blur="$store.recipes.commitRename(b)"
                          x-init="$el.focus(); $el.select()"
                        />
                      </template>
                      <template x-if="$store.recipes.renamingId !== b.id">
                        <button
                          type="button"
                          class="landing-title"
                          @click="$store.recipes.openDraft(b.id)"
                        >
                          <span class="landing-name" x-text="b.name"></span>
                          <span
                            class="text-xs text-muted"
                            x-show="$store.recipes.parentLabel(b)"
                            x-text="'from ' + $store.recipes.parentLabel(b)"
                          ></span>
                        </button>
                      </template>
                    </td>
                    <td x-text="$store.recipes.styleLabel(b)"></td>
                    <td x-text="$store.recipes.rigLabel(b)"></td>
                    <td x-text="$store.recipes.waterLabel(b)"></td>
                    <td>
                      <span
                        class="status-badge status-badge-info text-xs"
                        x-text="b.status === 'frozen' ? 'Frozen' : 'Draft'"
                      ></span>
                    </td>
                    <td class="landing-col-date" x-text="$store.recipes.dateLabel(b.updated_at)"></td>
                    <td class="landing-col-actions">
                      <template x-if="$store.recipes.scope === 'trash'">
                        <div class="recipes-row-actions">
                          <button type="button" class="btn-outline text-xs" @click="$store.recipes.restoreRow(b)">
                            Restore
                          </button>
                          <button type="button" class="btn-outline text-xs" @click="$store.recipes.deleteRow(b)">
                            Delete permanently
                          </button>
                        </div>
                      </template>
                      <template x-if="$store.recipes.scope !== 'trash'">
                        <button
                          type="button"
                          class="landing-kebab"
                          aria-label="Batch actions"
                          aria-haspopup="menu"
                          :aria-expanded="$store.recipes.rowMenu && $store.recipes.rowMenu.id === b.id"
                          @click.stop="$store.recipes.openRowMenu(b, $event)"
                        >
                          ⋮
                        </button>
                      </template>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <p class="landing-empty" x-show="!$store.recipes.rows.length" x-text="$store.recipes.emptyMessage"></p>
        </section>
      </div>
    </div>
  </div>

  <template x-if="$store.recipes.rowMenu">
    <div
      class="landing-menu"
      :style="$store.recipes.rowMenuStyle"
      role="menu"
      @click.outside="$store.recipes.closeRowMenu()"
      @keydown.escape.window="$store.recipes.closeRowMenu()"
    >
      <button
        type="button"
        class="landing-menu-item"
        role="menuitem"
        x-show="$store.recipes.rowMenu.status === 'frozen'"
        @click="$store.recipes.forkRow()"
      >
        Fork a copy
      </button>
      <button
        type="button"
        class="landing-menu-item"
        role="menuitem"
        @click="$store.recipes.startRename()"
      >
        Rename
      </button>
      <button
        type="button"
        class="landing-menu-item"
        role="menuitem"
        @click="$store.recipes.trashRow()"
      >
        Move to trash
      </button>
    </div>
  </template>

  <template x-if="$store.recipes.sortOpen">
    <div
      class="landing-menu"
      :style="$store.recipes.sortMenuStyle"
      role="menu"
      @click.outside="$store.recipes.closeSort()"
      @keydown.escape.window="$store.recipes.closeSort()"
    >
      <button
        type="button"
        class="landing-menu-item"
        role="menuitemradio"
        :aria-checked="$store.recipes.sort === 'modified'"
        @click="$store.recipes.setSort('modified')"
      >
        Last modified
      </button>
      <button
        type="button"
        class="landing-menu-item"
        role="menuitemradio"
        :aria-checked="$store.recipes.sort === 'title'"
        @click="$store.recipes.setSort('title')"
      >
        Title
      </button>
    </div>
  </template>
</div>
