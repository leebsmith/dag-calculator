<section class="card">
  <div class="card-header">
    <h2 class="card-title" x-text="activeStep.title"></h2>
    <p class="card-subtitle" x-show="activeStep.subtitle" x-text="activeStep.subtitle"></p>
  </div>

  <div class="card-body">
    <!-- Mash style preset -->
    <div class="table-header-toolbar">
      <div
        x-data="formBuilder({
          schema: [
            {
              id: 'mash-preset-selector',
              type: 'select',
              label: 'Mash Style Preset',
              read: () => mashPresetId,
              write: (value) => onMashPresetChange(value),
              options: () => Object.entries(mashPresetLabels).map(([value, label]) => ({ value, label })),
              commit: 'change'
            }
          ]
        })"
      >
        <load src="src/partials/ui-form-fields.html" />
      </div>
    </div>

    <!-- Available rests (checkbox table) -->
    <section class="card-section">
      <div class="card-section-header">
        <h3 class="eyebrow">Available Rests</h3>
        <button
          type="button"
          class="btn btn-secondary btn-sm"
          @click="openMashModal()"
        >
          Configure Rests
        </button>
      </div>

      <div class="data-table-container">
        <table class="data-table data-table--editor">
          <thead>
            <tr>
              <th>Rest</th>
              <th>Range (<span x-text="temperatureUnit"></span>)</th>
              <th>Purpose</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="rest in canonicalMashRests" :key="rest.rest_id">
              <tr>
                <td>
                  <label class="mash-rest-toggle">
                    <input
                      type="checkbox"
                      :checked="rest.enabled"
                      @change="toggleMashRest(rest.rest_id, $event.target.checked)"
                    />
                    <span x-text="rest.name"></span>
                  </label>
                </td>
                <td class="text-xs text-muted tabular-nums" x-text="fmt.displayOrDash(restTempRangeDisplay(rest.rest_id))"></td>
                <td class="text-xs text-muted" x-text="rest.purpose"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>

    <!-- Mash summary + metric strip -->
    <section class="card-section">
      <div class="card-section-header">
        <h3 class="eyebrow">Mash Summary</h3>
      </div>

      <p class="form-hint">
        Dough-in target
        <span class="tabular-nums" x-text="doughInDisplay || '—'"></span>
        <span x-text="temperatureUnit"></span>
      </p>

      <div class="data-table-container">
        <table class="data-table data-table--editor">
          <thead>
            <tr>
              <th>Rest</th>
              <th>Use Temp (<span x-text="temperatureUnit"></span>)</th>
              <th>Duration</th>
              <th>Purpose</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="rest in enabledMashRests" :key="rest.rest_id">
              <tr>
                <td x-text="restName(rest.rest_id)"></td>
                <td class="tabular-nums">
                  <span x-text="restUseTempDisplay(rest) || '—'"></span>
                </td>
                <td class="tabular-nums">
                  <template x-if="rest.duration_min != null">
                    <span x-text="rest.duration_min + ' min'"></span>
                  </template>
                  <template x-if="rest.duration_min == null">
                    <span class="text-muted">—</span>
                  </template>
                </td>
                <td class="text-xs text-muted" x-text="restPurpose(rest.rest_id)"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <p class="form-hint" :class="mashLgrBelowFloor ? 'text-warning' : 'text-muted'" x-text="mashLgrSummary"></p>

      <div class="metric-strip">
        <div class="metric-cell">
          <span class="metric-cell-label">Grain Temperature</span>
          <div class="metric-cell-value-wrap">
            <input
              type="number"
              step="0.1"
              class="form-input tabular-nums"
              :value="inputDraft(inputKey('field', 'mash.grain_temp_c'), mashField('mash.grain_temp_c').display)"
              @input="editNumberInput(inputKey('field', 'mash.grain_temp_c'), mashField('mash.grain_temp_c'), $event.target.value)"
              @change="commitNumberInput(inputKey('field', 'mash.grain_temp_c'), mashField('mash.grain_temp_c'))"
            />
            <span class="metric-cell-unit" x-text="mashField('mash.grain_temp_c').unit"></span>
          </div>
        </div>

        <div class="metric-cell">
          <span class="metric-cell-label">Mash Tun Temperature</span>
          <div class="metric-cell-value-wrap">
            <input
              type="number"
              step="0.1"
              class="form-input tabular-nums"
              :value="inputDraft(inputKey('field', 'mash.tun_initial_temp_c'), mashField('mash.tun_initial_temp_c').display)"
              @input="editNumberInput(inputKey('field', 'mash.tun_initial_temp_c'), mashField('mash.tun_initial_temp_c'), $event.target.value)"
              @change="commitNumberInput(inputKey('field', 'mash.tun_initial_temp_c'), mashField('mash.tun_initial_temp_c'))"
            />
            <span class="metric-cell-unit" x-text="mashField('mash.tun_initial_temp_c').unit"></span>
          </div>
        </div>

        <div class="metric-cell">
          <span class="metric-cell-label">Strike Water Temp</span>
          <div class="metric-cell-value-wrap">
            <span class="metric-cell-val" x-text="strikeWaterTempDisplay() || '—'"></span>
            <span class="metric-cell-unit" x-text="mashField('mash.strike_water_temp_c').unit"></span>
          </div>
          <template x-if="Number(mashField('mash.strike_water_tun_offset_c').value) > 0">
            <span
              class="text-xs text-muted"
              x-text="'incl. tun ' + fmt.formatQuantity(mashField('mash.strike_water_tun_offset_c'), { dash: '' })"
            ></span>
          </template>
        </div>

        <div class="metric-cell">
          <span class="metric-cell-label">Total Mash Time</span>
          <div class="metric-cell-value-wrap">
            <span class="metric-cell-val" x-text="totalMashTimeDisplay"></span>
            <span class="metric-cell-unit">min</span>
          </div>
          <span class="text-xs text-muted" x-show="rampTimeMin > 0" x-text="mashTimeSummary"></span>
        </div>
      </div>
    </section>

  </div>

  <load src="src/partials/mash-rests-modal.html" />
</section>
