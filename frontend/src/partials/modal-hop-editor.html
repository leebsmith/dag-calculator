<!-- Boil Hop Editor (workspace modal): draft grid + hop catalog / inspector drawers -->
<div
  x-data="modalShell({
    id: 'hop-editor',
    title: 'Hop Schedule Editor',
    badge: () => hopDraftSummary,
    badgeClass: 'badge-info',
    cancel: () => cancelHopEditor(),
    save: () => saveHopEditor(),
    escape: () => handleHopEscape()
  })"
  x-effect="syncOpen(hopEditorOpen)"
>
  <load src="src/partials/ui-modal-shell.html" />

  <template x-teleport="#hop-editor-body">
    <div class="modal-workspace-main">
      <load src="src/partials/draft-table.html" />
    </div>

      <div
        class="modal-drawer-scrim"
        x-show="hopDrawer !== null"
        x-transition.opacity.duration.200ms
        @click="closeHopDrawer()"
      ></div>

      <div
        class="modal-workspace-drawer"
        id="hop-drawer"
        x-show="hopDrawer !== null"
        x-transition:enter="modal-drawer-enter"
        x-transition:enter-start="modal-drawer-enter-start"
        x-transition:enter-end="modal-drawer-enter-end"
        x-transition:leave="modal-drawer-leave"
        x-transition:leave-start="modal-drawer-leave-start"
        x-transition:leave-end="modal-drawer-leave-end"
      >
        <div class="modal-drawer-header">
          <h3
            class="section-title"
            x-text="hopDrawer === 'search' ? 'Hop Catalog' : 'Hop Inspector'"
          ></h3>
          <button type="button" class="btn-close text-xs" @click="closeHopDrawer()">✕</button>
        </div>

        <div class="modal-drawer-body" :class="{ 'modal-drawer-body-pinned': hopDrawer === 'search' }">
          <template x-if="draftDrawer === 'search'">
            <load src="src/partials/draft-search-pane.html" />
          </template>

          <template x-if="hopDrawer === 'inspect'">
            <template x-if="hopActiveRow">
              <div
                class="inspector-form"
                x-data="formBuilder({
                  schema: [
                    { id: 'hop-row-name', type: 'text', label: 'Hop name', modelKey: 'name', default: '' },
                    { id: 'hop-row-alpha', type: 'number', label: 'Alpha acid (%)', read: () => fmt.toPercentValue(hopActiveRow.alpha_acid_pct, 1), min: 0, max: 100, step: 0.1, lazy: true, hint: 'Override for crop-year alpha; defaults to the catalog median.' },
                    { id: 'hop-row-cone', type: 'number', label: 'Cone utilization (0–1)', read: () => hopActiveRow.cone_utilization ?? '', when: () => hopActiveRow.product_form === 'whole_cone', min: 0, max: 1, step: 0.01, lazy: true, hint: 'No source publishes it; measure it or own the assumption. The mass stays unsolved until it is set.' },
                    { id: 'hop-row-form', type: 'select', label: 'Form', read: () => hopActiveRow.product_form || 't90_pellet', options: hopForms, lazy: true }
                  ],
                  onChange: (field, value) => {
                    if (field.id === 'hop-row-alpha') return setMaltField(hopActiveIndex, 'alpha_acid_pct', value, 0.01);
                    if (field.id === 'hop-row-cone') return patchDraftRow(hopActiveIndex, { cone_utilization: value === '' ? null : Number(value) });
                    if (field.id === 'hop-row-form') return patchDraftRow(hopActiveIndex, { product_form: value });
                    return setMaltField(hopActiveIndex, field.modelKey, value);
                  }
                })"
                x-effect="setModel(hopActiveRow)"
              >
                <load src="src/partials/ui-form-fields.html" />
                <span class="form-hint" x-show="hopActiveRow.product_form === 'flowable_extract'">
                  Use the lot CoA alpha; the catalog value is a preset. Extracts default to a
                  late addition, and the leaf does not restrict the stage.
                </span>
                <span class="form-hint" x-show="hopActiveRow.product_form === 'whole_cone'">
                  Whole cone needs the batch's cone utilization factor before the mass can solve.
                </span>
              </div>
            </template>
          </template>
        </div>
      </div>
  </template>

  <template x-teleport="#hop-editor-overlay">
    <load src="src/partials/draft-discard-confirm.html" />
  </template>
</div>
