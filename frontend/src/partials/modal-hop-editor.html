<!-- Boil Hop Editor (workspace modal): draft grid + hop catalog / inspector drawers -->
<div
  class="modal-backdrop"
  x-show="hopEditorOpen"
  @click.self="cancelHopEditor()"
  @keydown.escape.window="handleHopEscape()"
>
  <div
    class="modal-dialog modal-dialog-workspace"
    role="dialog"
    aria-modal="true"
    aria-labelledby="hop-editor-title"
    tabindex="-1"
    x-effect="dialogFocus($el, hopEditorOpen)"
  >
    <div class="modal-workspace-header">
      <div class="modal-workspace-header-title">
        <h2 class="modal-workspace-title" id="hop-editor-title">Hop Schedule Editor</h2>
        <span
          class="status-badge badge-info text-xs"
          x-text="hopDraftSummary"
        ></span>
      </div>
      <div class="modal-workspace-header-actions">
        <button type="button" class="btn-outline text-xs" @click="cancelHopEditor()">Cancel</button>
        <button type="button" class="btn-primary text-xs" @click="saveHopEditor()">Save &amp; Apply</button>
      </div>
    </div>

    <div class="modal-workspace-body">
      <div class="modal-workspace-main">
        <div class="table-header-toolbar">
          <span class="text-xs text-muted">
            Enter relative IBU parts; Hamilton normalizes them to 100%. Mass is derived from Tinseth.
          </span>
          <button type="button" class="btn-primary text-xs" @click="openHopSearch()" :aria-expanded="(hopDrawer !== null) ? 'true' : 'false'" aria-controls="hop-drawer">
            ＋ Add Hop from Catalog
          </button>
        </div>

        <div class="data-table-container">
          <table class="data-table is-fixed">
            <thead>
              <tr>
                <template x-for="c in draftColumns" :key="c.id">
                  <th :class="c.id === 'name' ? '' : 'text-right'" x-text="fmt.formatColumnHeader(c)"></th>
                </template>
                <th class="text-right">Actions</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="(row, ri) in draftDisplayRows" :key="ri">
                <tr>
                  <template x-for="c in draftColumns" :key="c.id">
                    <td :class="c.id === 'name' ? '' : 'text-right'">
                      <template x-if="c.editable">
                        <input
                          type="number"
                          step="0.1"
                          min="0"
                          class="form-input table-input-parts"
                          :value="inputDraft(inputKey('draft', draftNodeId, ri, c.id), row[c.id])"
                          @input="editDraftCellInput(inputKey('draft', draftNodeId, ri, c.id), ri, c.id, $event.target.value)"
                          @change="commitDraftCellInput(inputKey('draft', draftNodeId, ri, c.id))"
                        />
                      </template>
                      <template x-if="!c.editable">
                        <span class="collection-readout tabular-nums" x-text="row[c.id]"></span>
                      </template>
                    </td>
                  </template>
                  <td class="text-right">
                    <div class="table-action-cell">
                      <button type="button" class="btn-action-icon" @click="inspectHopRow(ri)" title="Inspect">✎</button>
                      <button
                        type="button"
                        class="btn-action-icon btn-action-danger"
                        @click="removeHop(ri)"
                        title="Remove"
                      >
                        🗑
                      </button>
                    </div>
                  </td>
                </tr>
              </template>
              <template x-if="draftRows.length === 0">
                <tr>
                  <td :colspan="draftColumns.length + 1" class="table-empty-cell">
                    No hops in the draft. Click “＋ Add Hop from Catalog”.
                  </td>
                </tr>
              </template>
            </tbody>
            <tfoot>
              <tr>
                <td :colspan="draftColumns.length + 1" class="tabular-nums">
                  <span class="font-bold">Total parts:</span>
                  <span x-text="fmt.formatWithDecimals(hopDraftPartsTotal, 1)"></span>
                </td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>

      <div
        class="modal-drawer-scrim"
        x-show="hopDrawer !== null"
        x-transition.opacity.duration.200ms
        @click="closeHopDrawer()"
      ></div>

      <div
        class="modal-workspace-drawer"
        id="hop-drawer"
        x-show="hopDrawer !== null"
        x-transition:enter="modal-drawer-enter"
        x-transition:enter-start="modal-drawer-enter-start"
        x-transition:enter-end="modal-drawer-enter-end"
        x-transition:leave="modal-drawer-leave"
        x-transition:leave-start="modal-drawer-leave-start"
        x-transition:leave-end="modal-drawer-leave-end"
      >
        <div class="modal-drawer-header">
          <h3
            class="section-title"
            x-text="hopDrawer === 'search' ? 'Hop Catalog' : 'Hop Inspector'"
          ></h3>
          <button type="button" class="btn-close text-xs" @click="closeHopDrawer()">✕</button>
        </div>

        <div class="modal-drawer-body" :class="{ 'modal-drawer-body-pinned': hopDrawer === 'search' }">
          <template x-if="draftDrawer === 'search'">
            <load src="src/partials/draft-search-pane.html" />
          </template>

          <template x-if="hopDrawer === 'inspect'">
            <template x-if="hopActiveRow">
              <div class="inspector-form">
                <div class="form-group">
                  <label class="form-label text-xs" for="hop-row-name">Hop name</label>
                  <input
                    id="hop-row-name"
                    type="text"
                    class="form-input text-xs"
                    :value="hopActiveRow.name"
                    @input="setMaltField(hopActiveIndex, 'name', $event.target.value)"
                  />
                </div>
                <div class="form-group">
                  <label class="form-label text-xs" for="hop-row-alpha">Alpha acid (%)</label>
                  <input
                    id="hop-row-alpha"
                    type="number"
                    step="0.1"
                    min="0"
                    max="100"
                    class="form-input text-xs"
                    :value="fmt.toPercentValue(hopActiveRow.alpha_acid_pct, 1)"
                    @change="setMaltField(hopActiveIndex, 'alpha_acid_pct', $event.target.value, 0.01)"
                  />
                  <span class="form-hint">Override for crop-year alpha; defaults to the catalog median.</span>
                </div>
                <div class="form-group" x-show="hopActiveRow.product_form === 'whole_cone'">
                  <label class="form-label text-xs" for="hop-row-cone">Cone utilization (0–1)</label>
                  <input
                    id="hop-row-cone"
                    type="number"
                    step="0.01"
                    min="0"
                    max="1"
                    class="form-input text-xs"
                    :value="hopActiveRow.cone_utilization ?? ''"
                    @change="patchDraftRow(hopActiveIndex, { cone_utilization: $event.target.value === '' ? null : Number($event.target.value) })"
                  />
                  <span class="form-hint">
                    No source publishes it; measure it or own the assumption. The mass
                    stays unsolved until it is set.
                  </span>
                </div>
                <div class="form-group">
                  <label class="form-label text-xs" for="hop-row-form">Form</label>
                  <select
                    id="hop-row-form"
                    class="form-select text-xs"
                    :value="hopActiveRow.product_form || 't90_pellet'"
                    @change="patchDraftRow(hopActiveIndex, { product_form: $event.target.value })"
                  >
                    <template x-for="form in hopForms" :key="form.value">
                      <option
                        :value="form.value"
                        :selected="form.value === (hopActiveRow.product_form || 't90_pellet')"
                        x-text="form.label"
                      ></option>
                    </template>
                  </select>
                </div>
                <span
                  class="form-hint"
                  x-show="hopActiveRow.product_form === 'flowable_extract'"
                >
                  Use the lot CoA alpha; the catalog value is a preset. Extracts default to a
                  late addition, and the leaf does not restrict the stage.
                </span>
                <span
                  class="form-hint"
                  x-show="hopActiveRow.product_form === 'whole_cone'"
                >
                  Whole cone needs the batch's cone utilization factor before the mass can solve.
                </span>
              </div>
            </template>
          </template>
        </div>
      </div>
    </div>

    <load src="src/partials/draft-discard-confirm.html" />
  </div>
</div>
