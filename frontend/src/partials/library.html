<div class="library-overlay" @keydown.escape.window="closeLibrary()">
  <section class="library-panel" role="dialog" aria-modal="true" aria-label="Library">
    <header class="library-header">
      <div>
        <h2 class="card-title">Library</h2>
        <p class="card-subtitle">
          Reference data. Records are sealed when saved and never edited; a correction is a new
          record. A batch copies what it uses, so changing or deleting a record never changes a
          batch.
        </p>
      </div>
      <button type="button" class="btn-outline" @click="closeLibrary()">Close</button>
    </header>

    <div class="filter-pills-container">
      <button
        type="button"
        class="filter-pill"
        :class="{ 'is-active': librarySection === 'sources' }"
        @click="selectLibrarySection('sources')"
      >Sources</button>
      <button
        type="button"
        class="filter-pill"
        :class="{ 'is-active': librarySection === 'ingredients' }"
        @click="selectLibrarySection('ingredients')"
      >Ingredients</button>
    </div>

    <p class="form-hint" x-show="libraryLoading">Loading records…</p>
    <div class="alert alert-warning" x-show="libraryError">
      <div class="alert-header">
        <span class="alert-dot"></span>
        <span>Couldn't load the library</span>
      </div>
      <p x-text="libraryError && libraryError.message"></p>
    </div>

    <template x-if="libraryNotice">
      <p class="form-hint" x-text="libraryNotice"></p>
    </template>

    <div class="catalog-search-wrapper">
      <input
        type="text"
        class="form-input text-xs"
        :placeholder="'Search ' + activeKindLabel.toLowerCase() + '…'"
        :value="librarySearch"
        @input="librarySetSearch($event.target.value)"
      />
    </div>
    <div class="filter-pills-container" x-show="activeKindHasNotes">
      <button
        type="button"
        class="filter-pill"
        :class="{ 'is-active': librarySearchNotes }"
        @click="toggleLibrarySearchNotes()"
      >Search notes</button>
    </div>

    <template x-if="librarySection === 'sources'">
      <div>
        <div class="filter-pills-container">
          <template x-for="k in identityTabs" :key="k.id">
            <button
              type="button"
              class="filter-pill"
              :class="{ 'is-active': sourceKind === k.id }"
              @click="selectSourceKind(k.id)"
              x-text="k.label"
            ></button>
          </template>
        </div>

        <p class="form-hint">
          Styles, rigs, and water sources are equal co-requisites: a batch snapshots one of each,
          and cannot be created until every one of them has a record. Styles are forked from an
          existing declaration before they are edited.
        </p>

        <section class="library-section">
          <h3 class="library-heading">Your records</h3>
          <div class="library-records">
            <template x-for="item in libraryRecords" :key="libraryItemId(item)">
              <div class="catalog-item-card">
                <div>
                  <div class="catalog-item-name" x-text="libraryItemTitle(item)"></div>
                  <div
                    class="text-xs text-muted"
                    x-text="item.forked_from_name ? libraryItemId(item) + ' · forked from ' + item.forked_from_name : libraryItemId(item)"
                  ></div>
                </div>
                <div class="catalog-item-actions">
                  <button
                    type="button"
                    class="btn-outline text-xs"
                    x-show="canForkRecord"
                    @click="forkLibraryItem(item)"
                  >Fork</button>
                  <button
                    type="button"
                    class="btn-outline text-xs"
                    @click="deleteLibraryItem(libraryItemId(item))"
                  >Delete</button>
                </div>
              </div>
            </template>
            <p
              class="landing-empty"
              x-show="!libraryRecords.length"
              x-text="librarySearch ? 'No matching records.' : 'No records yet.'"
            ></p>
          </div>
        </section>

        <div class="recipes-actions" x-show="canAuthorRecord">
          <button type="button" class="btn-primary text-xs" @click="newLibraryItem()">
            ＋ New record
          </button>
        </div>

        <section class="library-section">
          <h3 class="library-heading">Bundled seeds (read-only)</h3>
          <div class="library-records">
            <template x-for="item in librarySeedItems" :key="libraryItemId(item)">
              <div class="catalog-item-card is-readonly">
                <span class="catalog-item-name" x-text="librarySeedItemTitle(item)"></span>
                <span class="catalog-item-actions">
                  <button
                    type="button"
                    class="btn-outline text-xs"
                    x-show="canForkRecord"
                    @click="forkLibraryItem(item)"
                  >Fork</button>
                  <span class="status-badge status-badge-info text-nano">seed</span>
                </span>
              </div>
            </template>
          </div>
          <p class="landing-empty" x-show="librarySearch && !librarySeedItems.length">
            No matching seeds.
          </p>
          <p class="form-hint">
            Showing <span x-text="librarySeedItems.length"></span> of
            <span x-text="librarySeedCount"></span>
            <span x-text="librarySearch ? 'matching seeds' : 'bundled seeds'"></span>.
          </p>
        </section>
      </div>
    </template>

    <template x-if="librarySection === 'ingredients'">
      <div>
        <div class="filter-pills-container">
          <template x-for="t in libraryTabs" :key="t.id">
            <button
              type="button"
              class="filter-pill"
              :class="{ 'is-active': libraryTab === t.id }"
              @click="selectLibraryTab(t.id)"
              x-text="t.label"
            ></button>
          </template>
        </div>

        <p class="form-hint">
          Step-local inputs. A batch copies the record when it is picked, so a measurement that
          differs from the record is edited on the batch, not here.
        </p>

        <section class="library-section">
          <h3 class="library-heading">Your records</h3>
          <div class="library-records">
            <template x-for="item in libraryRecords" :key="libraryItemId(item)">
              <div class="catalog-item-card">
                <div>
                  <div class="catalog-item-name" x-text="libraryItemTitle(item)"></div>
                  <div class="text-xs text-muted" x-text="libraryItemId(item)"></div>
                </div>
                <button
                  type="button"
                  class="btn-outline text-xs"
                  @click="deleteLibraryItem(libraryItemId(item))"
                >Delete</button>
              </div>
            </template>
            <p
              class="landing-empty"
              x-show="!libraryRecords.length"
              x-text="librarySearch ? 'No matching records.' : 'No records yet. Create one below, or select a bundled seed.'"
            ></p>
          </div>
        </section>

        <div class="recipes-actions">
          <button type="button" class="btn-primary text-xs" @click="newLibraryItem()">
            ＋ New record
          </button>
        </div>

        <section class="library-section">
          <h3 class="library-heading">Bundled seeds (read-only)</h3>
          <div class="library-records">
            <template x-for="item in librarySeedItems" :key="libraryItemId(item)">
              <div class="catalog-item-card is-readonly">
                <span class="catalog-item-name" x-text="librarySeedItemTitle(item)"></span>
                <span class="status-badge status-badge-info text-nano">seed</span>
              </div>
            </template>
          </div>
          <p class="landing-empty" x-show="librarySearch && !librarySeedItems.length">
            No matching seeds.
          </p>
          <p class="form-hint">
            Showing <span x-text="librarySeedItems.length"></span> of
            <span x-text="librarySeedCount"></span>
            <span x-text="librarySearch ? 'matching seeds' : 'bundled seeds'"></span>.
          </p>
        </section>
      </div>
    </template>

    <template x-if="libraryDraft">
      <div class="library-editor">
        <h3 class="library-heading" x-text="libraryDraft.forked_from_name ? 'Forked ' + activeKindLabel.toLowerCase() : 'New ' + activeKindLabel.toLowerCase()"></h3>
        <template x-for="f in libraryFields" :key="f.field">
          <div class="form-group">
            <label
              class="form-label text-xs"
              x-text="fmt.formatFieldLabel(f.label, f.symbol)"
            ></label>
            <template x-if="f.kind === 'select'">
              <select
                class="form-select text-xs"
                :value="libraryFieldDisplay(f.field)"
                @change="librarySetField(f.field, $event.target.value)"
              >
                <option value="" :selected="libraryFieldDisplay(f.field) === ''">—</option>
                <template x-for="o in f.options" :key="o">
                  <option
                    :value="o"
                    :selected="o === libraryFieldDisplay(f.field)"
                    x-text="o"
                  ></option>
                </template>
              </select>
            </template>
            <template x-if="f.kind === 'number'">
              <input
                type="number"
                step="any"
                class="form-input text-xs"
                :value="libraryFieldDisplay(f.field)"
                @input="librarySetField(f.field, $event.target.value)"
              />
            </template>
            <template x-if="f.kind === 'text'">
              <input
                type="text"
                class="form-input text-xs"
                :value="libraryFieldDisplay(f.field)"
                @input="librarySetField(f.field, $event.target.value)"
              />
            </template>
          </div>
        </template>
        <div class="recipes-actions">
          <button type="button" class="btn-outline text-xs" @click="cancelLibraryItem()">
            Cancel
          </button>
          <button type="button" class="btn-primary text-xs" @click="saveLibraryItem()">
            Save and seal
          </button>
        </div>
        <template x-if="libraryErrors.length">
          <div class="text-xs text-muted">
            <template x-for="e in libraryErrors" :key="e.field + e.message">
              <div x-text="e.field + ': ' + e.message"></div>
            </template>
          </div>
        </template>
      </div>
    </template>
  </section>
</div>
