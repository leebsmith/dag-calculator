<div class="library-overlay" @keydown.escape.window="closeLibrary()">
  <section
    class="library-panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="library-title"
    tabindex="-1"
    x-init="dialogFocus($el, true)"
  >
    <header class="library-header">
      <div>
        <h2 class="card-title" id="library-title">Library</h2>
        <p class="card-subtitle">
          Reference data. Records are sealed when saved and never edited; a correction is a new
          record. A batch copies what it uses, so changing or deleting a record never changes a
          batch.
        </p>
      </div>
      <button type="button" class="btn-outline" @click="closeLibrary()">Close</button>
    </header>

    <div class="segmented-control filter-pills-container">
      <button
        type="button"
        class="filter-pill segmented-item segmented-item--solid"
        :class="{ 'is-active': librarySection === 'sources' }" :aria-pressed="(librarySection === 'sources') ? 'true' : 'false'"
        @click="selectLibrarySection('sources')"
      >Sources</button>
      <button
        type="button"
        class="filter-pill segmented-item segmented-item--solid"
        :class="{ 'is-active': librarySection === 'ingredients' }" :aria-pressed="(librarySection === 'ingredients') ? 'true' : 'false'"
        @click="selectLibrarySection('ingredients')"
      >Ingredients</button>
    </div>

    <p class="form-hint" x-show="libraryLoading">Loading records…</p>
    <div class="alert alert-warning" x-show="libraryError">
      <div class="alert-header">
        <span class="alert-dot"></span>
        <span>Couldn't load the library</span>
      </div>
      <p x-text="libraryError && libraryError.message"></p>
    </div>

    <template x-if="libraryNotice">
      <p class="form-hint" x-text="libraryNotice"></p>
    </template>

    <template x-if="librarySection === 'sources'">
      <div>
        <div class="segmented-control filter-pills-container">
          <template x-for="k in identityTabs" :key="k.id">
            <button
              type="button"
              class="filter-pill segmented-item segmented-item--solid"
              :class="{ 'is-active': sourceKind === k.id }" :aria-pressed="(sourceKind === k.id) ? 'true' : 'false'"
              @click="selectSourceKind(k.id)"
              x-text="k.label"
            ></button>
          </template>
        </div>

        <div class="library-filter-bar">
          <label class="form-label text-xs" :for="'library-search-' + librarySection">
            <span x-text="librarySearchLabel"></span>
          </label>
          <div class="catalog-search-wrapper">
            <input
              type="text"
              class="form-input text-xs"
              :id="'library-search-' + librarySection"
              :placeholder="'Search ' + activeKindLabel.toLowerCase() + '…'"
              :value="librarySearch"
              @input="librarySetSearch($event.target.value)"
            />
          </div>
          <div class="segmented-control filter-pills-container" x-show="activeKindHasNotes">
            <button
              type="button"
              class="filter-pill segmented-item segmented-item--solid"
              :class="{ 'is-active': librarySearchNotes }" :aria-pressed="(librarySearchNotes) ? 'true' : 'false'"
              @click="toggleLibrarySearchNotes()"
            >Search notes</button>
          </div>
        </div>

        <p class="form-hint">
          Styles, rigs, and water sources are equal co-requisites: a batch snapshots one of each,
          and cannot be created until every one of them has a record. Styles are forked from an
          existing declaration before they are edited.
        </p>

        <section class="library-section">
          <h3 class="library-heading">Your records</h3>
          <div class="library-records">
            <template x-for="item in libraryRecords" :key="libraryItemId(item)">
              <div class="catalog-item-card">
                <div>
                  <div class="catalog-item-name" x-text="libraryItemTitle(item)"></div>
                  <div
                    class="text-xs text-muted"
                    x-text="item.forked_from_name ? libraryItemId(item) + ' · forked from ' + item.forked_from_name : libraryItemId(item)"
                  ></div>
                </div>
                <div class="catalog-item-actions">
                  <button
                    type="button"
                    class="btn-outline btn-sm"
                    x-show="canForkRecord"
                    @click="forkLibraryItem(item)"
                  >Fork</button>
                  <button
                    type="button"
                    class="btn-outline btn-sm"
                    @click="deleteLibraryItem(libraryItemId(item))"
                  >Delete</button>
                </div>
              </div>
            </template>
            <p
              class="landing-empty"
              x-show="!libraryRecords.length"
              x-text="librarySearch ? 'No matching records.' : 'No records yet.'"
            ></p>
          </div>
        </section>

        <div class="recipes-actions" x-show="canAuthorRecord">
          <button type="button" class="btn-primary btn-sm" @click="newLibraryItem()">
            ＋ New record
          </button>
        </div>

        <section class="library-section">
          <h3 class="library-heading">Bundled seeds (read-only)</h3>
          <div class="library-records">
            <template x-for="item in librarySeedItems" :key="libraryItemId(item)">
              <div class="catalog-item-card is-readonly">
                <span class="catalog-item-name" x-text="librarySeedItemTitle(item)"></span>
                <span class="catalog-item-actions">
                  <button
                    type="button"
                    class="btn-outline btn-sm"
                    x-show="canForkRecord"
                    @click="forkLibraryItem(item)"
                  >Fork</button>
                  <button
                    type="button"
                    class="btn-outline btn-sm"
                    x-show="canCloneRecord"
                    @click="cloneLibraryItem(item)"
                  >Clone</button>
                  <span class="status-badge status-badge-info text-nano">seed</span>
                </span>
              </div>
            </template>
          </div>
          <p class="landing-empty" x-show="librarySearch && !librarySeedItems.length">
            No matching seeds.
          </p>
          <p class="form-hint">
            Showing <span x-text="librarySeedItems.length"></span> of
            <span x-text="librarySeedCount"></span>
            <span x-text="librarySearch ? 'matching seeds' : 'bundled seeds'"></span>.
          </p>
          <button
            type="button"
            class="btn-outline btn-sm"
            x-show="librarySeedItems.length < librarySeedCount"
            @click="showMoreSeeds()"
          >Show 50 more</button>
        </section>
      </div>
    </template>

    <template x-if="librarySection === 'ingredients'">
      <div>
        <div class="segmented-control filter-pills-container">
          <template x-for="t in libraryTabs" :key="t.id">
            <button
              type="button"
              class="filter-pill segmented-item segmented-item--solid"
              :class="{ 'is-active': libraryTab === t.id }" :aria-pressed="(libraryTab === t.id) ? 'true' : 'false'"
              @click="selectLibraryTab(t.id)"
              x-text="t.label"
            ></button>
          </template>
        </div>

        <div class="library-filter-bar">
          <label class="form-label text-xs" :for="'library-search-' + librarySection">
            <span x-text="librarySearchLabel"></span>
          </label>
          <div class="catalog-search-wrapper">
            <input
              type="text"
              class="form-input text-xs"
              :id="'library-search-' + librarySection"
              :placeholder="'Search ' + activeKindLabel.toLowerCase() + '…'"
              :value="librarySearch"
              @input="librarySetSearch($event.target.value)"
            />
          </div>
          <div class="segmented-control filter-pills-container" x-show="activeKindHasNotes">
            <button
              type="button"
              class="filter-pill segmented-item segmented-item--solid"
              :class="{ 'is-active': librarySearchNotes }" :aria-pressed="(librarySearchNotes) ? 'true' : 'false'"
              @click="toggleLibrarySearchNotes()"
            >Search notes</button>
          </div>
        </div>

        <p class="form-hint">
          Step-local inputs. A batch copies the record when it is picked, so a measurement that
          differs from the record is edited on the batch, not here.
        </p>

        <section class="library-section">
          <h3 class="library-heading">Your records</h3>
          <template x-for="group in libraryGroups" :key="group.title || 'all'">
            <div x-show="group.items.length">
              <h4 class="library-heading" x-show="group.title" x-text="group.title"></h4>
              <div class="library-records">
                <template x-for="item in group.items" :key="libraryItemId(item)">
                  <div class="catalog-item-card">
                    <div>
                      <div class="catalog-item-name" x-text="libraryItemTitle(item)"></div>
                      <div class="text-xs text-muted" x-text="libraryItemId(item)"></div>
                      <div class="text-xs text-muted" x-show="libraryItemComposition(item)"
                        x-text="libraryItemComposition(item)"></div>
                    </div>
                    <button
                      type="button"
                      class="btn-outline btn-sm"
                      @click="deleteLibraryItem(libraryItemId(item))"
                    >Delete</button>
                  </div>
                </template>
              </div>
            </div>
          </template>
          <p
            class="landing-empty"
            x-show="!libraryRecords.length"
            x-text="librarySearch ? 'No matching records.' : 'No records yet. Create one below, or select a bundled seed.'"
          ></p>
        </section>

        <div class="recipes-actions">
          <button type="button" class="btn-primary btn-sm" @click="newLibraryItem()">
            ＋ New record
          </button>
        </div>

        <section class="library-section">
          <h3 class="library-heading">Bundled seeds (read-only)</h3>
          <div class="library-records">
            <template x-for="item in librarySeedItems" :key="libraryItemId(item)">
              <div class="catalog-item-card is-readonly">
                <span class="catalog-item-name" x-text="librarySeedItemTitle(item)"></span>
                <span class="catalog-item-actions">
                  <button
                    type="button"
                    class="btn-outline btn-sm"
                    @click="cloneLibraryItem(item)"
                  >Clone</button>
                  <span class="status-badge status-badge-info text-nano">seed</span>
                </span>
              </div>
            </template>
          </div>
          <p class="landing-empty" x-show="librarySearch && !librarySeedItems.length">
            No matching seeds.
          </p>
          <p class="form-hint">
            Showing <span x-text="librarySeedItems.length"></span> of
            <span x-text="librarySeedCount"></span>
            <span x-text="librarySearch ? 'matching seeds' : 'bundled seeds'"></span>.
          </p>
          <button
            type="button"
            class="btn-outline btn-sm"
            x-show="librarySeedItems.length < librarySeedCount"
            @click="showMoreSeeds()"
          >Show 50 more</button>
        </section>
      </div>
    </template>

    <template x-if="libraryDraft">
      <div
        class="library-editor"
        x-data="(() => {
          const spec = (name) => libraryFields.find((field) => field.field === name) || null;
          const labelFor = (name) => {
            const current = spec(name);
            return fmt.formatFieldLabel(current?.label ?? name, current?.symbol);
          };
          const pointSchema = (list) => list.fields.map((point) => ({
            id: `library-point-${point.field}`,
            type: point.kind === 'number' ? 'number' : 'text',
            label: point.label,
            labelClass: 'metric-cell-label',
            controlClass: 'form-input text-xs',
            read: (context) => libraryPointDisplay(context.index, point.field),
            write: (value, context) => librarySetPointField(context.index, point.field, value),
            commit: 'change',
            step: point.kind === 'number' ? 'any' : undefined
          }));
          return formBuilder({
            schema: libraryFields.map((field) => {
              if (field.kind === 'list') {
                return {
                  id: `library-field-${field.field}`,
                  type: 'repeat',
                  label: '',
                  labelClass: 'form-label text-xs',
                  items: () => libraryPointRows(),
                  key: (row, index) => String(index),
                  schema: pointSchema(field),
                  rowClass: 'metric-strip',
                  cellClass: 'metric-cell',
                  add: { label: 'Add point', run: () => libraryAddPoint() },
                  remove: { label: 'Remove', run: (row, index) => libraryRemovePoint(index) }
                };
              }
              const base = {
                id: `library-field-${field.field}`,
                label: () => labelFor(field.field),
                labelClass: 'form-label text-xs',
                hint: () => spec(field.field)?.hint
              };
              const read = () => libraryFieldDisplay(field.field);
              const write = (value) => librarySetField(field.field, value);
              if (field.kind === 'select') {
                return {
                  ...base,
                  type: 'select',
                  read,
                  write,
                  options: () => [
                    { value: '', label: '—' },
                    ...field.options.map((option) => ({
                      value: option,
                      label: field.optionLabels?.[option] ?? option
                    }))
                  ],
                  controlClass: 'form-select text-xs',
                  commit: 'change'
                };
              }
              if (field.kind === 'boolean') {
                return {
                  ...base,
                  type: 'select',
                  read,
                  write,
                  options: [
                    { value: '', label: 'Unknown' },
                    { value: 'true', label: 'Yes' },
                    { value: 'false', label: 'No' }
                  ],
                  controlClass: 'form-select text-xs',
                  commit: 'change'
                };
              }
              if (field.kind === 'number') {
                return {
                  ...base,
                  type: 'number',
                  read,
                  draft: { read, write },
                  write: () => libraryCommitField(field.field),
                  readonly: () => spec(field.field)?.readOnly === true,
                  controlClass: 'form-input text-xs',
                  step: 'any',
                  commit: 'change'
                };
              }
              if (field.kind === 'date') {
                return {
                  ...base,
                  type: 'date',
                  read,
                  write,
                  controlClass: 'form-input text-xs',
                  commit: 'change'
                };
              }
              return {
                ...base,
                type: 'text',
                read,
                write,
                controlClass: 'form-input text-xs',
                commit: 'input'
              };
            })
          });
        })()"
      >
        <h3 class="library-heading" x-text="libraryEditorTitle"></h3>
        <p class="form-hint" x-show="activeKind === 'yeast'">
          A strain leaves <em>Blend of</em> empty. A blend lists the strains it is composed of,
          comma-separated, and carries the attenuation the blend finishes at.
        </p>
        <load src="src/partials/ui-form-fields.html" />
        <div class="recipes-actions">
          <button type="button" class="btn-outline btn-sm" @click="cancelLibraryItem()">
            Cancel
          </button>
          <button type="button" class="btn-primary btn-sm" @click="saveLibraryItem()">
            Save and seal
          </button>
        </div>
        <template x-if="libraryErrors.length">
          <div class="text-xs text-muted">
            <template x-for="e in libraryErrors" :key="e.field + e.message">
              <div x-text="e.field + ': ' + e.message"></div>
            </template>
          </div>
        </template>
      </div>
    </template>
  </section>
</div>
