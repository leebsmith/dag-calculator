<div class="table-header-toolbar">
  <span class="text-xs text-muted" x-text="draftToolbarNote"></span>
  <button
    type="button"
    class="btn-primary text-xs"
    @click="openDraftSearch()"
    :aria-expanded="draftDrawer !== null ? 'true' : 'false'"
    :aria-controls="draftDrawerId"
    :disabled="draftAtLimit"
    x-text="draftAddLabel"
  ></button>
</div>

<div class="data-table-container">
  <table class="data-table is-fixed">
    <thead>
      <tr>
        <template x-for="c in draftColumns" :key="c.id">
          <th :class="draftTextColumns.includes(c.id) ? '' : 'text-right'">
            <span x-text="fmt.formatColumnHeader(c)"></span>
          </th>
        </template>
        <th class="text-right">Actions</th>
      </tr>
    </thead>
    <tbody>
      <template x-for="(row, ri) in draftDisplayRows" :key="ri">
        <tr>
          <template x-for="c in draftColumns" :key="c.id">
            <td :class="draftTextColumns.includes(c.id) ? '' : 'text-right'">
              <template x-if="c.editable">
                <input
                  type="number"
                  :step="draftInputStep"
                  min="0"
                  class="form-input table-input-parts"
                  :value="inputDraft(inputKey('draft', draftNodeId, ri, c.id), row[c.id])"
                  @input="editDraftCellInput(inputKey('draft', draftNodeId, ri, c.id), ri, c.id, $event.target.value)"
                  @change="commitDraftCellInput(inputKey('draft', draftNodeId, ri, c.id))"
                />
              </template>
              <template x-if="!c.editable">
                <span class="collection-readout tabular-nums">
                  <span x-text="row[c.id]"></span>
                  <template x-if="draftRowBadge(row, c.id)">
                    <span class="table-pct-badge" :class="draftRowBadge(row, c.id).className">
                      <span x-text="draftRowBadge(row, c.id).text"></span>
                    </span>
                  </template>
                </span>
              </template>
            </td>
          </template>
          <td class="text-right">
            <div class="table-action-cell">
              <template x-if="draftTableInspect">
                <button type="button" class="btn-action-icon" @click="inspectDraftRow(ri)" title="Inspect">✎</button>
              </template>
              <button
                type="button"
                class="btn-action-icon btn-action-danger"
                @click="removeDraftRow(ri)"
                title="Remove"
              >
                🗑
              </button>
            </div>
          </td>
        </tr>
      </template>
      <template x-if="draftRows.length === 0">
        <tr>
          <td :colspan="draftColumns.length + 1" class="table-empty-cell" x-text="draftEmptyText"></td>
        </tr>
      </template>
    </tbody>
    <tfoot>
      <tr>
        <td :colspan="draftColumns.length + 1" class="tabular-nums">
          <span class="font-bold" x-text="draftTotals.label"></span>
          <span x-text="draftTotals.value"></span>
        </td>
      </tr>
    </tfoot>
  </table>
</div>
