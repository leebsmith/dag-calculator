<div class="form-group" x-show="field.visible">
  <template x-if="field.type === 'repeat'">
    <div>
      <span :class="field.labelClass" x-show="field.label" x-text="field.label"></span>
      <template x-for="row in field.rows" :key="row.key">
        <div :class="row.rowClass || null">
          <template x-for="child in row.fields" :key="child.id">
            <div
              :class="row.cellClass || null"
              x-show="child.visible"
              x-data="{ field: child }"
            >
              <load src="src/partials/ui-form-field-control.html" />
            </div>
          </template>
          <button
            type="button"
            class="btn-outline btn-sm"
            x-show="row.remove"
            @click="row.remove.run(row.key, row.index)"
            x-text="row.remove?.label || 'Remove'"
          ></button>
        </div>
      </template>
      <button
        type="button"
        class="btn-outline btn-sm"
        x-show="field.add"
        @click="field.add.run()"
        x-text="field.add?.label || 'Add'"
      ></button>
      <p
        class="form-hint"
        :id="field.hintId"
        x-show="field.hint"
        x-text="field.hint"
      ></p>
      <template x-for="hint in field.hints" :key="hint.id">
        <span
          class="form-hint"
          :id="hint.id"
          :class="hint.class || null"
          x-show="hint.when"
          x-text="hint.text"
        ></span>
      </template>
    </div>
  </template>

  <div class="form-field-control" x-show="field.type !== 'repeat'">
    <load src="src/partials/ui-form-field-control.html" />
  </div>
</div>
