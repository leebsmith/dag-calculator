[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Lee B. Smith", email = "leeb@lee-smith.org" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "firebase-admin>=7.7.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pypdf>=6.0.0",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "tach>=0.35.3",
]
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../tests/backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C901"]
ignore = ["E501"]

# C901 counts branch statements (if / for / while / except / match arms), not
# `and` / `or` / ternaries: a function whose only control flow is a boolean chain
# reports 1. So 10 here is stricter in branch terms than the frontend's
# `complexity 12`, which counts both. A function over the line is split, never
# exempted; the ceiling moves only with a plan.
[tool.ruff.lint.mccabe]
max-complexity = 10
